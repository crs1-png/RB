          dbus-update-activation-environment GIO_USE_NETWORK_MONITOR DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR 2>/dev/null || true

          # Unlock keyring with empty password (for Online Accounts / Google Drive)
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets,pkcs11 >/dev/null 2>&1 || true
          eval "$(gnome-keyring-daemon --start --components=secrets,pkcs11 2>/dev/null)" || true
          export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK

          # Dark theme & desktop icons
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' || true
          gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark' || true
          gsettings set org.gnome.gnome-flashback desktop true || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.default-applications.terminal exec 'xfce4-terminal' 2>/dev/null || true

          # PERFORMANCE: no animations, no compositing (much smoother over VNC)
          gsettings set org.gnome.desktop.interface enable-animations false || true
          gsettings set org.gnome.metacity compositing-manager false 2>/dev/null || true

          # PERFORMANCE: plain dark background instead of a picture (less data on every window move)
          gsettings set org.gnome.desktop.background picture-options 'none' 2>/dev/null || true
          gsettings set org.gnome.desktop.background color-shading-type 'solid' 2>/dev/null || true
          gsettings set org.gnome.desktop.background primary-color '#202124' 2>/dev/null || true

          # SHARPNESS: grayscale font smoothing (no coloured fringes, compresses cleaner over VNC)
          gsettings set org.gnome.desktop.interface font-antialiasing 'grayscale' 2>/dev/null || true
          gsettings set org.gnome.desktop.interface font-hinting 'slight' 2>/dev/null || true
          gsettings set org.gnome.settings-daemon.plugins.xsettings antialiasing 'grayscale' 2>/dev/null || true
          gsettings set org.gnome.settings-daemon.plugins.xsettings hinting 'slight' 2>/dev/null || true

          # UI scale chosen in the workflow (or later via "Display scale")
          SCALE=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
          gsettings set org.gnome.desktop.interface text-scaling-factor "$SCALE" 2>/dev/null || true
          gsettings set org.gnome.desktop.interface cursor-size "$(python3 -c "print(int(round(24*$SCALE)))")" 2>/dev/null || true

          for f in "$HOME"/Desktop/*.desktop; do gio set "$f" metadata::trusted true 2>/dev/null || true; done

          # Terminal look (xfce4-terminal 1.x stores settings in xfconf)
          if command -v xfconf-query >/dev/null; then
            xt() { xfconf-query -c xfce4-terminal -p "$1" -n -t "$2" -s "$3" 2>/dev/null || true; }
            xt /font-name string "DejaVu Sans Mono 11"
            xt /font-use-system bool false
            xt /misc-default-geometry string "110x30"
            xt /misc-menubar-default bool false
            xt /misc-toolbar-default bool false
            xt /misc-confirm-close bool false
            xt /scrolling-unlimited bool true
            xt /color-foreground string "#e6e6e6"
            xt /color-background string "#1e1e1e"
            xt /color-cursor string "#e6e6e6"
