                if (mode !== 'single') {
                  mode = 'single'; lastKey = '';
                  rfb.resizeSession = true;
                  if (rfb._supportsSetDesktopSize) {
                    sendLayout(rfb, [{ id: rfb._screenID >>> 0, x: 0, y: 0, w: own.w, h: own.h }], own.w, own.h);
                  }
                  say('One screen. Open window "Screen 2" to use two screens.');
                  setTimeout(function () { if (mode === 'single') { say(''); } }, 4000);
                }
                return;
              }

              // TWO screens
              if (!rfb._supportsSetDesktopSize) {
                say('Two screens need the TigerVNC server. This desktop runs in fallback mode (one screen only).');
                return;
              }
              if (mode !== 'dual') { mode = 'dual'; say(''); }
              rfb.resizeSession = false;
              var W = Math.min(16384, own.w + partner.w), H = Math.max(own.h, partner.h);
              var key = own.w + 'x' + own.h + '|' + partner.w + 'x' + partner.h;
              var wrong = rfb._fbWidth !== W || rfb._fbHeight !== H;
              if ((key !== lastKey || wrong) && Date.now() - lastSent > 2000) {
                lastKey = key; lastSent = Date.now();
                var id0 = rfb._screenID >>> 0;
                sendLayout(rfb, [
                  { id: id0, x: 0, y: 0, w: own.w, h: own.h },
                  { id: (id0 + 1) >>> 0, x: own.w, y: 0, w: W - own.w, h: partner.h }
                ], W, H);
              }
            }
            setInterval(tick, 1000);
          })();
          </script>
