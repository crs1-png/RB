          cat > ~/desktop-session.sh << 'EOF'
          #!/bin/bash
          export DISPLAY=:99
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=GNOME-Flashback:GNOME
          export XDG_SESSION_DESKTOP=gnome-flashback-metacity
          export DESKTOP_SESSION=gnome-flashback-metacity
          export NO_AT_BRIDGE=1
          # Check network state directly instead of via NetworkManager (fixes "offline")
          export GIO_USE_NETWORK_MONITOR=netlink
          export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # Own D-Bus session
