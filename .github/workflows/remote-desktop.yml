          echo $((START + HANDOVER_MINUTES * 60)) > /tmp/runner-handover-ts

          # ------------------------------------------------------------------
          # Gemini in Chrome ("Ask Gemini" button, Gemini side panel, Skills, Alt+G, Help me write,
          # tab organizer, AI history search, AI Mode ...).
          # Google officially releases Gemini in Chrome only for Windows, Mac and Chromebook Plus.
          # The Linux Chrome contains the feature, but Google's experiment config ("variations seed")
          # switches it off. So before every Chrome start:
          #   1. the seed is deleted and Chrome is not allowed to download a new one
          #   2. "Local State" is marked as US + eligible for Gemini, Chrome language = English (US)
