name: Remote Desktop Runner (GNOME + Google Drive, Zero Trust, Auto-Restart)

on:
  workflow_dispatch:
  # Sicherheitsnetz: prüft alle 30 Minuten nach, ob die Auto-Neustart-Kette noch läuft.
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: remote-desktop
  cancel-in-progress: false

permissions:
  actions: write   # nötig, damit der Job den nächsten Lauf selbst anstoßen darf
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Hard-Limit von GitHub Actions liegt bei 360 Min.

    steps:
      # ------------------------------------------------------------------
      # SCHNELLER START: WARP wird im Hintergrund vorbereitet, während der
      # Desktop installiert wird. Beides läuft gleichzeitig.
      # ------------------------------------------------------------------
      - name: Fast start (tune apt, start WARP in background)
        env:
          WARP_ORGANIZATION: ${{ secrets.WARP_ORGANIZATION }}
          WARP_AUTH_CLIENT_ID: ${{ secrets.WARP_AUTH_CLIENT_ID }}
          WARP_AUTH_CLIENT_SECRET: ${{ secrets.WARP_AUTH_CLIENT_SECRET }}
        run: |
          date +%s > /tmp/start-ts

          if [ -z "$WARP_ORGANIZATION" ] || [ -z "$WARP_AUTH_CLIENT_ID" ] || [ -z "$WARP_AUTH_CLIENT_SECRET" ]; then
            echo "❌ ERROR: One or more WARP secrets (WARP_ORGANIZATION, WARP_AUTH_CLIENT_ID, WARP_AUTH_CLIENT_SECRET) are missing!"
            exit 1
          fi

          # apt schneller machen: keine man-Seiten-Datenbank neu bauen, kein fsync, keine Übersetzungen
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/99-fast-io > /dev/null
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99-fast > /dev/null

          # Plattenplatz freigeben: im Hintergrund mit niedriger Priorität (blockiert nichts)
          sudo nohup ionice -c3 nice -n 19 rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android > /dev/null 2>&1 &

          # WARP-Setup-Skript (läuft komplett im Hintergrund, parallel zur Desktop-Installation)
          cat > ~/warp-setup.sh << 'WARPSCRIPT'
          #!/bin/bash
          exec > /tmp/warp-setup.log 2>&1
          rm -f /tmp/warp.done /tmp/warp.failed /tmp/warp.connected
          fail() { echo "❌ $*"; touch /tmp/warp.failed; exit 1; }

          # 1. Ubuntu-Container für den offiziellen WARP-Client
          docker run -d \
            --name warp-proxy \
            --privileged \
            --cap-add NET_ADMIN \
            -p 127.0.0.1:1080:1080 \
            ubuntu:22.04 sleep infinity || fail "docker run failed"

          # 2. Offizielles cloudflare-warp Paket installieren
          docker exec warp-proxy bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y curl gnupg lsb-release ca-certificates dbus socat
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main' > /etc/apt/sources.list.d/cloudflare-client.list
            apt-get update
            apt-get install -y cloudflare-warp
          " || fail "WARP install failed"

          # 3. Zero-Trust-Anmeldung per Service Token über mdm.xml (Proxy-Modus auf Port 4000)
          umask 077
          cat > /tmp/mdm.xml << EOF
          <dict>
            <key>organization</key>
            <string>${WARP_ORGANIZATION}</string>
            <key>auth_client_id</key>
            <string>${WARP_AUTH_CLIENT_ID}</string>
            <key>auth_client_secret</key>
            <string>${WARP_AUTH_CLIENT_SECRET}</string>
            <key>service_mode</key>
            <string>proxy</string>
            <key>proxy_port</key>
            <integer>4000</integer>
            <key>auto_connect</key>
            <integer>1</integer>
            <key>onboarding</key>
            <false/>
          </dict>
          EOF
          docker exec warp-proxy mkdir -p /var/lib/cloudflare-warp
          docker cp /tmp/mdm.xml warp-proxy:/var/lib/cloudflare-warp/mdm.xml
          rm -f /tmp/mdm.xml

          # 4. System-D-Bus und WARP-Dienst starten
          docker exec warp-proxy bash -c "mkdir -p /run/dbus && rm -f /run/dbus/pid && dbus-daemon --config-file=/usr/share/dbus-1/system.conf --fork"
          docker exec -d warp-proxy bash -c "warp-svc > /var/log/warp-svc.log 2>&1"

          # 5. Auf Verbindung warten (max. ~90 Sekunden)
          for i in $(seq 1 30); do
            sleep 3
            if docker exec warp-proxy warp-cli --accept-tos status 2>/dev/null | grep -q "Connected"; then
              touch /tmp/warp.connected; break
            fi
            [ "$i" = "10" ] && docker exec warp-proxy warp-cli --accept-tos connect || true
          done

          # 6. Internen WARP-Proxy (4000) auf Container-Port 1080 weiterleiten
          docker exec -d warp-proxy socat TCP-LISTEN:1080,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:4000
          sleep 1

          docker exec warp-proxy warp-cli --accept-tos status || true
          if [ -f /tmp/warp.connected ]; then
            echo "✅ WARP verbunden. Test über den Proxy:"
            curl -s --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp=|gateway=" || echo "⚠️ Test fehlgeschlagen (evtl. Zertifikat passt nicht)"
          else
            echo "⚠️ WARP ist NICHT verbunden. Chrome lädt dann keine Seiten (kein Datenleck)."
            docker exec warp-proxy tail -n 50 /var/log/warp-svc.log || true
          fi
          touch /tmp/warp.done
          WARPSCRIPT
          chmod +x ~/warp-setup.sh

          nohup setsid bash ~/warp-setup.sh > /dev/null 2>&1 &
          echo "WARP-Setup läuft im Hintergrund (Log: /tmp/warp-setup.log)"

      - name: Install Desktop, Chrome, Terminal & Tools (one single apt run)
        run: |
          export DEBIAN_FRONTEND=noninteractive

          # Chrome und cloudflared parallel herunterladen, während apt die Paketlisten lädt
          mkdir -p /tmp/dl && chmod 755 /tmp/dl
          curl -fsSL -o /tmp/dl/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
          P1=$!
          curl -fsSL -o /tmp/dl/cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb &
          P2=$!
          sudo apt-get update
          wait $P1 || { echo "❌ Chrome-Download fehlgeschlagen"; exit 1; }
          wait $P2 || { echo "❌ cloudflared-Download fehlgeschlagen"; exit 1; }
          chmod 644 /tmp/dl/*.deb

          # Alles in EINEM apt-Aufruf (ein einziger Lauf, Chrome + cloudflared direkt mit dabei).
          # Schon vorhandene Standardprogramme (cp, mv, tar, gzip, curl, git ...) sind auf dem Runner vorinstalliert.
          sudo apt-get install -y \
            /tmp/dl/google-chrome-stable_current_amd64.deb \
            /tmp/dl/cloudflared-linux-amd64.deb \
            gnome-session-flashback \
            gnome-flashback \
            gnome-panel \
            metacity \
            gnome-control-center \
            gnome-online-accounts \
            gnome-keyring \
            gvfs \
            gvfs-backends \
            nautilus \
            adwaita-icon-theme \
            xvfb \
            x11-utils \
            x11vnc \
            novnc \
            websockify \
            curl \
            wget \
            dbus-x11 \
            libnss3-tools \
            openssl \
            xfce4-terminal \
            xfconf \
            fonts-dejavu-core \
            bash-completion \
            mc \
            fzf \
            zoxide \
            tree \
            htop \
            ncdu \
            python3 \
            python3-gi \
            gir1.2-glib-2.0 \
            zip \
            unzip \
            p7zip-full \
            libarchive-tools \
            rsync \
            nano \
            git \
            jq \
            ripgrep \
            fd-find \
            bat \
            tmux \
            lsof \
            psmisc \
            xclip
          rm -rf /tmp/dl

          # Ubuntu names some tools differently: make "fd" and "bat" work as usual
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat 2>/dev/null || true

          # Make xfce4-terminal the default terminal
          sudo update-alternatives --set x-terminal-emulator /usr/bin/xfce4-terminal.wrapper || true

          # Check that the important commands really exist
          MISSING=""
          for c in cp mv rm mkdir ls cat find grep sed awk tar gzip bzip2 xz zip unzip 7z bsdtar rsync \
                   nano git jq rg fd bat curl wget less file tree htop ncdu mc fzf zoxide tmux \
                   xfce4-terminal python3 google-chrome-stable cloudflared; do
            command -v "$c" >/dev/null || MISSING="$MISSING $c"
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️ Missing commands:$MISSING"
          else
            echo "✅ All standard commands are available"
          fi

      - name: Install Google Drive Shell (gdsh)
        run: |
          # gdsh = terminal for Google Drive with REAL file names.
          # Uses the Google account from GNOME Online Accounts. No extra OAuth app, no rclone, no API keys.
          sudo tee /usr/local/bin/gdsh > /dev/null << 'EOF'
          #!/usr/bin/env python3
          """gdsh - Google Drive shell with real file names (account from GNOME Online Accounts)."""
          import cmd, glob, os, re, readline, subprocess, time
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio, GLib

          ATTRS = "standard::name,standard::display-name,standard::type,standard::size"
          BLUE, GREEN, OFF = "\033[1;34m", "\033[1;32m", "\033[0m"
          DIR = Gio.FileType.DIRECTORY


          def human(n):
              for unit in ("B", "K", "M", "G", "T"):
                  if n < 1024:
                      return f"{n:.0f}{unit}" if unit == "B" else f"{n:.1f}{unit}"
                  n /= 1024
              return f"{n:.1f}P"


          def safe(name):
              return name.replace("/", "_")


          def find_drive_uris():
              try:
                  out = subprocess.run(["gio", "mount", "-li"], capture_output=True, text=True, timeout=30).stdout
              except Exception:
                  return []
              uris = []
              # Stop at whitespace, quotes and angle brackets (gio prints e.g. 'google-drive://user@host/')
              for m in re.findall(r"google-drive://[^\s'\"<>]+", out):
                  if not m.endswith("/"):
                      m += "/"
                  if m not in uris:
                      uris.append(m)
              return uris


          def ensure_mounted(uri):
              root = Gio.File.new_for_uri(uri)
              try:
                  root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
                  return root
              except GLib.Error:
                  pass
              subprocess.run(["gio", "mount", uri], capture_output=True, timeout=90)
              root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
              return root


          class DriveShell(cmd.Cmd):
              intro = "Google Drive shell - type 'help' for commands, 'exit' to quit."

              def __init__(self, root):
                  super().__init__()
                  readline.set_completer_delims(" \t\n")
                  self.stack = [(root, "")]
                  self.cache = {}
                  os.makedirs(os.path.expanduser("~/Downloads"), exist_ok=True)
                  os.chdir(os.path.expanduser("~/Downloads"))
                  self._prompt()

              # ---------- helpers ----------
              def _prompt(self):
                  path = "/" + "/".join(n for _, n in self.stack[1:])
                  self.prompt = f"\001{GREEN}\002drive:{path}\001{OFF}\002> "

              def _arg(self, arg):
                  arg = arg.strip()
                  if len(arg) >= 2 and arg[0] == arg[-1] and arg[0] in "\"'":
                      arg = arg[1:-1]
                  return arg

              def _err(self, e):
                  print(f"Error: {e.message if isinstance(e, GLib.Error) else e}")

              def _list(self, folder, fresh=False):
                  key = folder.get_uri()
                  hit = self.cache.get(key)
                  if hit and not fresh and time.time() - hit[0] < 30:
                      return hit[1]
                  items = []
                  en = folder.enumerate_children(ATTRS, Gio.FileQueryInfoFlags.NONE, None)
                  while True:
                      info = en.next_file(None)
                      if info is None:
                          break
                      items.append(info)
                  en.close(None)
                  items.sort(key=lambda i: (i.get_file_type() != DIR, i.get_display_name().lower()))
                  self.cache[key] = (time.time(), items)
                  return items

              def _find(self, folder, name):
                  items = self._list(folder)
                  for test in (lambda i: i.get_display_name() == name,
                               lambda i: i.get_display_name().lower() == name.lower(),
                               lambda i: i.get_name() == name):
                      for info in items:
                          if test(info):
                              return info
                  return None

              def _walk(self, path):
                  stack = self.stack[:1] if path.startswith("/") else list(self.stack)
                  info = None
                  for part in [p for p in path.split("/") if p and p != "."]:
                      if part == "..":
                          if len(stack) > 1:
                              stack.pop()
                          info = None
                          continue
                      info = self._find(stack[-1][0], part)
                      if info is None:
                          raise LookupError(f"Not found: {part}")
                      stack.append((stack[-1][0].get_child(info.get_name()), info.get_display_name()))
                  return stack, info

              def _target(self, arg):
                  stack, info = self._walk(self._arg(arg))
                  if info is None:
                      raise LookupError("Please give a file or folder name")
                  return stack[-1][0], info

              # ---------- Drive commands ----------
              def do_ls(self, arg):
                  """ls [folder]        list files with real names (also: dir, ll)"""
                  try:
                      stack, info = self._walk(self._arg(arg))
                      if info and info.get_file_type() != DIR:
                          return print(info.get_display_name())
                      items = self._list(stack[-1][0], fresh=True)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if not items:
                      print("(empty)")
                  for i in items:
                      if i.get_file_type() == DIR:
                          print(f"{'<DIR>':>9}  {BLUE}{i.get_display_name()}/{OFF}")
                      else:
                          print(f"{human(i.get_size()):>9}  {i.get_display_name()}")
              do_dir = do_ll = do_ls

              def do_cd(self, arg):
                  """cd <folder>        change folder (cd .. = up, cd / = top, Tab completes)"""
                  try:
                      stack, info = self._walk(self._arg(arg) or "/")
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if info and info.get_file_type() != DIR:
                      return print(f"Not a folder: {info.get_display_name()}")
                  self.stack = stack
                  self._prompt()

              def do_pwd(self, arg):
                  """pwd                show current Drive folder"""
                  print("/" + "/".join(n for _, n in self.stack[1:]))

              def do_get(self, arg):
                  """get <file|folder>  download into the current local folder (see lpwd, lcd)"""
                  try:
                      src, info = self._target(arg)
                      dest = os.path.join(os.getcwd(), safe(info.get_display_name()))
                      self._download(src, info, dest)
                      print(f"Done -> {dest}")
                  except (GLib.Error, LookupError, OSError) as e:
                      self._err(e)

              def _download(self, src, info, dest):
                  if info.get_file_type() == DIR:
                      os.makedirs(dest, exist_ok=True)
                      for child in self._list(src):
                          self._download(src.get_child(child.get_name()), child,
                                         os.path.join(dest, safe(child.get_display_name())))
                      return
                  try:
                      src.copy(Gio.File.new_for_path(dest), Gio.FileCopyFlags.OVERWRITE, None, None)
                      print(f"  {info.get_display_name()}")
                  except GLib.Error as e:
                      print(f"  skipped {info.get_display_name()} ({e.message})")

              def do_put(self, arg):
                  """put <local path>   upload a local file or folder into the current Drive folder"""
                  local = os.path.expanduser(self._arg(arg))
                  if not local or not os.path.exists(local):
                      return print(f"Not found locally: {local}")
                  try:
                      self._upload(os.path.abspath(local), self.stack[-1][0])
                      print("Done.")
                  except (GLib.Error, LookupError) as e:
                      self._err(e)
                  self.cache.clear()

              def _upload(self, local, folder):
                  name = os.path.basename(os.path.normpath(local))
                  existing = self._find(folder, name)
                  if os.path.isdir(local):
                      if not (existing and existing.get_file_type() == DIR):
                          folder.get_child_for_display_name(name).make_directory(None)
                          self.cache.pop(folder.get_uri(), None)
                          existing = self._find(folder, name)
                          if existing is None:
                              raise LookupError(f"Could not create folder: {name}")
                      target = folder.get_child(existing.get_name())
                      for entry in sorted(os.listdir(local)):
                          self._upload(os.path.join(local, entry), target)
                      return
                  if existing:
                      dest, flags = folder.get_child(existing.get_name()), Gio.FileCopyFlags.OVERWRITE
                  else:
                      dest, flags = folder.get_child_for_display_name(name), Gio.FileCopyFlags.NONE
                  Gio.File.new_for_path(local).copy(dest, flags, None, None)
                  print(f"  {name}")

              def do_mkdir(self, arg):
                  """mkdir <name>       create a folder in the current Drive folder"""
                  name = self._arg(arg)
                  if not name:
                      return print("Please give a folder name")
                  try:
                      self.stack[-1][0].get_child_for_display_name(name).make_directory(None)
                      print(f"Created: {name}")
                  except GLib.Error as e:
                      self._err(e)
                  self.cache.clear()

              def do_rm(self, arg):
                  """rm <file|folder>   move to Google Drive trash (asks first)"""
                  try:
                      f, info = self._target(arg)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if input(f"Move '{info.get_display_name()}' to trash? [y/N] ").strip().lower() != "y":
                      return print("Cancelled.")
                  try:
                      try:
                          f.trash(None)
                      except GLib.Error:
                          f.delete(None)
                      print("Moved to trash.")
                  except GLib.Error as e:
                      self._err(e)
                  self.cache.clear()

              def do_cat(self, arg):
                  """cat <file>         show a text file"""
                  try:
                      f, info = self._target(arg)
                      ok, data, _ = f.load_contents(None)
                      print(data[:200000].decode("utf-8", errors="replace"))
                  except (GLib.Error, LookupError) as e:
                      self._err(e)

              def do_refresh(self, arg):
                  """refresh            reload file lists from Google Drive"""
                  self.cache.clear()
                  print("Cache cleared.")

              # ---------- local commands ----------
              def do_lpwd(self, arg):
                  """lpwd               show the local folder (downloads go here)"""
                  print(os.getcwd())

              def do_lcd(self, arg):
                  """lcd <path>         change the local folder"""
                  try:
                      os.chdir(os.path.expanduser(self._arg(arg) or "~"))
                      print(os.getcwd())
                  except OSError as e:
                      self._err(e)

              def do_lls(self, arg):
                  """lls                list the local folder"""
                  subprocess.run(["ls", "-lh", "--color=auto", "--group-directories-first"])

              def do_shell(self, arg):
                  """!<command>         run a normal Linux command locally, e.g. !unzip file.zip"""
                  subprocess.run(arg, shell=True)

              def do_clear(self, arg):
                  """clear              clear the screen (also: cls)"""
                  os.system("clear")
              do_cls = do_clear

              def do_exit(self, arg):
                  """exit               leave gdsh"""
                  return True
              do_quit = do_exit

              def do_EOF(self, arg):
                  print()
                  return True

              def do_help(self, arg):
                  if arg:
                      return super().do_help(arg)
                  print("\nCommands:")
                  for name in ("ls", "cd", "pwd", "get", "put", "mkdir", "rm", "cat", "refresh",
                               "lpwd", "lcd", "lls", "shell", "clear", "exit"):
                      print("  " + getattr(self, "do_" + name).__doc__)
                  print("\nNames with spaces work without quotes. Tab completes names.\n")

              def emptyline(self):
                  pass

              # ---------- tab completion ----------
              def _complete_remote(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  base, sep, partial = arg.rpartition("/")
                  try:
                      stack = self._walk(base + sep)[0] if sep else self.stack
                      items = self._list(stack[-1][0])
                  except Exception:
                      return []
                  out = []
                  for i in items:
                      is_dir = i.get_file_type() == DIR
                      if dirs_only and not is_dir:
                          continue
                      name = i.get_display_name() + ("/" if is_dir else "")
                      if name.lower().startswith(partial.lower()):
                          out.append((base + sep + name)[len(arg) - len(text):])
                  return out

              def _complete_local(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  home = os.path.expanduser("~")
                  out = []
                  for p in glob.glob(os.path.expanduser(arg) + "*"):
                      if dirs_only and not os.path.isdir(p):
                          continue
                      p += "/" if os.path.isdir(p) else ""
                      if arg.startswith("~"):
                          p = "~" + p[len(home):]
                      out.append(p[len(arg) - len(text):])
                  return out

              def complete_cd(self, text, line, b, e):
                  return self._complete_remote(text, line, dirs_only=True)

              def complete_ls(self, text, line, b, e):
                  return self._complete_remote(text, line)
              complete_dir = complete_ll = complete_get = complete_rm = complete_cat = complete_ls

              def complete_put(self, text, line, b, e):
                  return self._complete_local(text, line)

              def complete_lcd(self, text, line, b, e):
                  return self._complete_local(text, line, dirs_only=True)


          def main():
              uris = find_drive_uris()
              if not uris:
                  print("No Google account found.")
                  print("Open 'Settings (Online Accounts)' on the desktop, add your Google account,")
                  print("make sure 'Files' is switched on, then run 'gdsh' again.")
                  return 1
              uri = uris[0]
              if len(uris) > 1:
                  for n, u in enumerate(uris, 1):
                      print(f"  {n}) {u}")
                  choice = input("Which account? [1] ").strip() or "1"
                  if choice.isdigit() and 1 <= int(choice) <= len(uris):
                      uri = uris[int(choice) - 1]
              try:
                  root = ensure_mounted(uri)
              except GLib.Error as e:
                  print(f"Could not open Google Drive ({uri}): {e.message}")
                  print("Tip: open the Google Drive once in 'Dateien (Google Drive)', then run gdsh again.")
                  return 1
              print(f"Connected: {uri}")
              shell = DriveShell(root)
              while True:
                  try:
                      shell.cmdloop()
                      return 0
                  except KeyboardInterrupt:
                      print("^C")
                      shell.intro = None


          if __name__ == "__main__":
              raise SystemExit(main())
          EOF
          sudo chmod +x /usr/local/bin/gdsh
          python3 -m py_compile /usr/local/bin/gdsh && echo "✅ gdsh installed"

      - name: Fix "Offline" in Online Accounts (disable NetworkManager)
        run: |
          # NetworkManager verwaltet die Netzwerkkarte des Runners nicht und meldet fälschlich "offline"
          sudo systemctl stop NetworkManager 2>/dev/null || true
          sudo systemctl mask NetworkManager 2>/dev/null || true
          sudo pkill -x NetworkManager 2>/dev/null || true
          # Prüfen: Internet muss weiterhin funktionieren
          curl -s --max-time 10 -o /dev/null -w "Internet-Test: HTTP %{http_code}\n" https://www.google.com || echo "⚠️ Kein Internet"

      - name: Install Cloudflare Zero Trust Root CA (from Secret)
        env:
          CF_CA_1: ${{ secrets.CLOUDFLARE_ROOT_CA_B64 }}
          CF_CA_2: ${{ secrets.CLOUDFLARE_CA_CERT }}
        run: |
          # Akzeptiert beide Secret-Namen
          if [ -n "$CF_CA_1" ]; then
            CF_CA="$CF_CA_1"; echo "Verwende Secret CLOUDFLARE_ROOT_CA_B64"
          elif [ -n "$CF_CA_2" ]; then
            CF_CA="$CF_CA_2"; echo "Verwende Secret CLOUDFLARE_CA_CERT"
          else
            echo "❌ FEHLER: Kein Zertifikat-Secret gefunden!"
            echo "   Lege unter Settings > Secrets and variables > Actions > Repository secrets"
            echo "   ein Secret namens CLOUDFLARE_ROOT_CA_B64 oder CLOUDFLARE_CA_CERT an."
            exit 1
          fi

          CERT="$RUNNER_TEMP/cf-zt-root.pem"
          RAW="$RUNNER_TEMP/cf-zt-raw"
          rm -f "$CERT" "$RAW"

          if printf '%s' "$CF_CA" | grep -q "BEGIN CERTIFICATE"; then
            # Secret enthält das Zertifikat als Text (PEM)
            printf '%s\n' "$CF_CA" | tr -d '\r' > "$CERT"
          else
            # Secret enthält das Zertifikat Base64-kodiert (PEM- oder DER-Datei)
            printf '%s' "$CF_CA" | tr -d '\r\n ' | base64 -d > "$RAW" 2>/dev/null || true
            if openssl x509 -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -in "$RAW" -out "$CERT"
            elif openssl x509 -inform DER -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -inform DER -in "$RAW" -out "$CERT"
            fi
            rm -f "$RAW"
          fi

          # Prüfen, ob das Zertifikat gültig und nicht abgelaufen ist
          if ! openssl x509 -in "$CERT" -noout 2>/dev/null; then
            echo "❌ FEHLER: Der Inhalt des Secrets ist kein gültiges Zertifikat!"
            exit 1
          fi
          echo "Zertifikat:"
          openssl x509 -in "$CERT" -noout -subject -enddate -fingerprint -sha256
          openssl x509 -in "$CERT" -noout -checkend 0 || { echo "❌ Zertifikat ist abgelaufen"; exit 1; }

          # 1. Systemweit vertrauen (curl, apt usw.)
          sudo cp "$CERT" /usr/local/share/ca-certificates/cloudflare-zt-root.crt
          sudo update-ca-certificates

          # 2. Chrome vertrauen (NSS-Datenbank)
          mkdir -p ~/.pki/nssdb
          [ -f ~/.pki/nssdb/cert9.db ] || certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          certutil -d sql:$HOME/.pki/nssdb -D -n "Cloudflare Zero Trust Root CA" 2>/dev/null || true
          certutil -d sql:$HOME/.pki/nssdb -A -t "C,," -n "Cloudflare Zero Trust Root CA" -i "$CERT"
          certutil -d sql:$HOME/.pki/nssdb -L | grep "Cloudflare Zero Trust Root CA"
          rm -f "$CERT"
          echo "✅ Cloudflare Zero Trust Root CA installiert."

      - name: Configure Launchers & Desktop Session Script
        run: |
          mkdir -p ~/.config/autostart ~/Desktop ~/.local/share/applications ~/.config/xfce4/terminal ~/Downloads

          # Chrome-Starter (geroutet über WARP SOCKS5 Proxy)
          cat > ~/Desktop/google-chrome.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome (WARP ZT)
          Comment=Web-Browser via Cloudflare Zero Trust
          Exec=/usr/bin/google-chrome-stable --proxy-server="socks5://127.0.0.1:1080" --force-dark-mode --enable-features=WebUIDarkMode --start-maximized --no-first-run --no-default-browser-check --disable-session-crashed-bubble --disable-dev-shm-usage --password-store=basic %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          EOF

          # GNOME Settings (Online Accounts -> Google Drive)
          cat > ~/Desktop/gnome-control-center.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Settings (Online Accounts)
          Comment=GNOME Settings – Google-Konto für Google Drive hinzufügen
          Exec=env GIO_USE_NETWORK_MONITOR=netlink XDG_CURRENT_DESKTOP=GNOME gnome-control-center online-accounts
          Icon=org.gnome.Settings
          Terminal=false
          Categories=Settings;
          EOF

          # Dateimanager (Google Drive erscheint links nach Anmeldung)
          cat > ~/Desktop/nautilus.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Dateien (Google Drive)
          Exec=nautilus --new-window
          Icon=org.gnome.Nautilus
          Terminal=false
          Categories=Utility;
          EOF

          # Normal terminal (compact window, no menu bar)
          cat > ~/Desktop/terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Terminal
          Comment=Linux terminal
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar
          Icon=utilities-terminal
          Terminal=false
          Categories=System;TerminalEmulator;
          EOF

          # Google Drive terminal (opens gdsh, after "exit" you are back in a normal shell)
          cat > ~/Desktop/gdrive-terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Drive Terminal
          Comment=Navigate Google Drive with real file names
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar --title="Google Drive" -x bash -c "gdsh; exec bash"
          Icon=folder-remote
          Terminal=false
          Categories=System;Utility;
          EOF

          chmod +x ~/Desktop/*.desktop
          cp ~/Desktop/*.desktop ~/.local/share/applications/

          # Terminal look (fallback for older xfce4-terminal versions; newer ones are set via xfconf in the session script)
          cat > ~/.config/xfce4/terminal/terminalrc << 'EOF'
          [Configuration]
          FontName=DejaVu Sans Mono 11
          FontUseSystem=FALSE
          MiscDefaultGeometry=110x30
          MiscMenubarDefault=FALSE
          MiscToolbarDefault=FALSE
          MiscConfirmClose=FALSE
          ScrollingUnlimited=TRUE
          ColorForeground=#e6e6e6
          ColorBackground=#1e1e1e
          ColorCursor=#e6e6e6
          EOF

          # Comfortable bash: short colored prompt, CMD-like aliases, fast search and folder jumps
          cat >> ~/.bashrc << 'EOF'

          # ---- Terminal comfort ----
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          export EDITOR=nano
          export VISUAL=nano
          PS1='\[\e[1;32m\]\u\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          alias ls='ls --color=auto --group-directories-first'
          alias ll='ls -alh'
          alias la='ls -A'
          alias dir='ls -lh'
          alias cls='clear'
          alias ..='cd ..'
          alias ...='cd ../..'
          alias grep='grep --color=auto'
          alias df='df -h'
          alias du='du -h'
          alias free='free -h'
          alias drive='gdsh'
          # Unpack almost any archive: x file.zip / file.tar.gz / file.7z / file.rar
          x() { [ -f "$1" ] || { echo "File not found: $1"; return 1; }; bsdtar -xvf "$1"; }
          HISTSIZE=10000
          HISTFILESIZE=20000
          shopt -s histappend autocd cdspell 2>/dev/null
          bind 'set completion-ignore-case on' 2>/dev/null
          [ -f /usr/share/bash-completion/bash_completion ] && . /usr/share/bash-completion/bash_completion
          [ -f /usr/share/doc/fzf/examples/key-bindings.bash ] && . /usr/share/doc/fzf/examples/key-bindings.bash
          command -v zoxide >/dev/null && eval "$(zoxide init bash)"
          EOF

          # Desktop-Sitzung OHNE gnome-session (verhindert "Oh no! Something has gone wrong")
          # Ein Wächter startet abgestürzte Teile automatisch neu.
          cat > ~/desktop-session.sh << 'EOF'
          #!/bin/bash
          export DISPLAY=:99
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=GNOME-Flashback:GNOME
          export XDG_SESSION_DESKTOP=gnome-flashback-metacity
          export DESKTOP_SESSION=gnome-flashback-metacity
          export NO_AT_BRIDGE=1
          # Netzwerkstatus direkt prüfen statt über NetworkManager (behebt "Offline")
          export GIO_USE_NETWORK_MONITOR=netlink
          export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # Eigene D-Bus-Sitzung
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID
          dbus-update-activation-environment GIO_USE_NETWORK_MONITOR DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR 2>/dev/null || true

          # Schlüsselbund mit leerem Passwort entsperren (für Online Accounts / Google Drive)
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets,pkcs11 >/dev/null 2>&1 || true
          eval "$(gnome-keyring-daemon --start --components=secrets,pkcs11 2>/dev/null)" || true
          export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK

          # Dark Theme & Desktop-Symbole
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' || true
          gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark' || true
          gsettings set org.gnome.gnome-flashback desktop true || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.default-applications.terminal exec 'xfce4-terminal' 2>/dev/null || true
          for f in "$HOME"/Desktop/*.desktop; do gio set "$f" metadata::trusted true 2>/dev/null || true; done

          # Terminal look (xfce4-terminal 1.x stores settings in xfconf)
          if command -v xfconf-query >/dev/null; then
            xt() { xfconf-query -c xfce4-terminal -p "$1" -n -t "$2" -s "$3" 2>/dev/null || true; }
            xt /font-name string "DejaVu Sans Mono 11"
            xt /font-use-system bool false
            xt /misc-default-geometry string "110x30"
            xt /misc-menubar-default bool false
            xt /misc-toolbar-default bool false
            xt /misc-confirm-close bool false
            xt /scrolling-unlimited bool true
            xt /color-foreground string "#e6e6e6"
            xt /color-background string "#1e1e1e"
            xt /color-cursor string "#e6e6e6"
          fi

          start_if_missing() {
            local name="$1"; shift
            if ! pgrep -u "$(id -u)" -x "$name" >/dev/null; then
              echo "$(date '+%H:%M:%S') starte $name"
              "$@" >> "/tmp/desktop-$name.log" 2>&1 &
              sleep 2
            fi
          }

          while true; do
            start_if_missing metacity metacity --replace
            start_if_missing gnome-flashback gnome-flashback
            start_if_missing gnome-panel gnome-panel
            sleep 5
          done
          EOF
          chmod +x ~/desktop-session.sh

      - name: Start Display & GNOME Desktop Services
        run: |
          # 1. Virtuelles Display starten
          nohup Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          for i in $(seq 1 20); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { echo "❌ Xvfb startet nicht"; cat /tmp/xvfb.log; exit 1; }

          # 2. Desktop-Sitzung mit Wächter starten (läuft unabhängig weiter)
          nohup setsid bash ~/desktop-session.sh > /tmp/desktop-session.log 2>&1 &
          # Nicht stur 8 Sekunden warten, sondern nur bis das Panel da ist (max. 20 Sekunden)
          for i in $(seq 1 20); do
            pgrep -x gnome-panel >/dev/null && break
            sleep 1
          done

          # 3. VNC-Server ohne Passwort, nur lokal (Zugriff nur über Cloudflare Access)
          x11vnc -nopw -localhost -rfbport 5900 -forever -shared -display :99 -bg -o /tmp/x11vnc.log

          # 4. noVNC Web-Proxy (Port 6080, nur lokal)
          nohup websockify --web=/usr/share/novnc/ 127.0.0.1:6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 1

          echo "--- Desktop-Status ---"
          cat /tmp/desktop-session.log
          pgrep -a -x metacity || echo "⚠️ metacity läuft nicht"
          pgrep -a -x gnome-flashback || echo "⚠️ gnome-flashback läuft nicht"
          pgrep -a -x gnome-panel || echo "⚠️ gnome-panel läuft nicht"

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "❌ FEHLER: Secret CLOUDFLARE_TUNNEL_TOKEN ist nicht gesetzt!"
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          # Warten, bis der Tunnel verbunden ist (max. 30 Sekunden)
          for i in $(seq 1 30); do
            grep -q "Registered tunnel connection" /tmp/cloudflared.log 2>/dev/null && break
            sleep 1
          done

          echo "=========================================="
          echo "✅ GNOME Remote Desktop läuft und ist via Cloudflare Zero Trust erreichbar."
          echo "   Rufe https://DEINE-SUBDOMAIN.DEINE-DOMAIN.com/vnc.html auf"
          echo "   Desktop bereit nach $(( $(date +%s) - $(cat /tmp/start-ts) )) Sekunden."
          echo "=========================================="

      - name: Wait for WARP (started in background at the beginning)
        run: |
          # WARP wurde schon ganz am Anfang parallel gestartet. Meist ist es jetzt fertig.
          for i in $(seq 1 100); do
            [ -f /tmp/warp.done ] && break
            [ -f /tmp/warp.failed ] && break
            sleep 3
          done
          echo "---------- WARP-Log ----------"
          cat /tmp/warp-setup.log 2>/dev/null || true
          echo "------------------------------"
          if [ -f /tmp/warp.failed ]; then
            echo "⚠️ WARP-Setup ist fehlgeschlagen. Chrome lädt dann keine Seiten (kein Datenleck)."
          elif [ ! -f /tmp/warp.done ]; then
            echo "⚠️ WARP war nach 5 Minuten noch nicht fertig. Log siehe oben."
          fi
          echo "Gesamtzeit bis hierher: $(( $(date +%s) - $(cat /tmp/start-ts) )) Sekunden."

      - name: Keep Alive (mit Auto-Neustart vor Ablauf)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          health() {
            pgrep -x Xvfb >/dev/null        || echo "⚠️ Xvfb läuft nicht mehr"
            pgrep -x x11vnc >/dev/null      || echo "⚠️ x11vnc läuft nicht mehr"
            pgrep -x cloudflared >/dev/null || echo "⚠️ cloudflared läuft nicht mehr"
          }

          echo "Phase 1: 325 Minuten aktiv..."
          for i in $(seq 1 325); do
            sleep 60
            [ $((i % 15)) -eq 0 ] && { echo "Minute $i"; health; }
          done

          # Dateiname des Workflows automatisch ermitteln
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          echo "Stoße nächsten Lauf an (Auto-Neustart) für $WF_FILE ..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF_FILE/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"

          echo "Phase 2: restliche 10 Minuten aktiv..."
          for i in $(seq 1 10); do
            sleep 60
          done

          echo "Dieser Lauf endet jetzt - der nachrückende Lauf übernimmt in Kürze."
