name: Remote Desktop Runner (Windows, Zero Trust, Auto-Restart + Google Drive)

on:
  workflow_dispatch:
  # Sicherheitsnetz: prüft alle 30 Minuten, ob die Auto-Neustart-Kette noch
  # läuft. Läuft bereits eine Session, passiert dank "concurrency" nichts -
  # der Trigger wird ignoriert. Ist die Kette abgerissen, startet er neu.
  schedule:
    - cron: '*/30 * * * *'

# Genau 1 laufender + 1 wartender Lauf pro Gruppe.
# cancel-in-progress: false ist WICHTIG - sonst würde ein neuer,
# nachrückender Lauf die noch aktive Session sofort abwürgen.
concurrency:
  group: remote-desktop-windows
  cancel-in-progress: false

permissions:
  actions: write   # nötig, damit der Job den nächsten Lauf selbst anstoßen darf
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 350   # Hard-Limit von GitHub Actions liegt bei 360 Min.

    steps:
      - name: Install Cloudflared & rclone
        shell: powershell
        run: |
          # Cloudflared installieren (für den Zero-Trust-Tunnel/RDP)
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

          # rclone installieren - wird NUR genutzt, um den kleinen
          # Google-Drive-Anmeldeordner zwischen den Sessions zu übertragen,
          # NICHT für deine eigentlichen Arbeitsdateien (die übernimmt
          # Google Drive Desktop selbst, live und automatisch).
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone" -Force
          $rcloneDir = Get-ChildItem "C:\rclone" -Directory | Select-Object -First 1
          Copy-Item "$($rcloneDir.FullName)\rclone.exe" "C:\Windows\System32\rclone.exe"

      - name: Install Google Drive Desktop (silent)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/drive-file-stream/GoogleDriveSetup.exe" -OutFile "C:\GoogleDriveSetup.exe"
          Start-Process -FilePath "C:\GoogleDriveSetup.exe" -ArgumentList "--silent","--desktop_shortcut" -Wait
          echo "✅ Google Drive Desktop installiert."

      - name: Restore Google-Drive-Anmeldedaten aus Cloud-Backup
        shell: powershell
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          New-Item -ItemType Directory -Force -Path "C:\rclone-config" | Out-Null
          [System.IO.File]::WriteAllBytes(
            "C:\rclone-config\rclone.conf",
            [System.Convert]::FromBase64String($env:RCLONE_CONF_B64)
          )

          $driveFsPath = "C:\Users\runneradmin\AppData\Local\Google\DriveFS"
          New-Item -ItemType Directory -Force -Path $driveFsPath | Out-Null

          # Passe "backupcloud:drivefs-backup" ggf. an deinen Remote-Namen an.
          # Dieser Ordner enthält NUR die Anmelde-/Session-Daten von Google
          # Drive Desktop, keine eigentlichen Arbeitsdateien.
          rclone sync "backupcloud:drivefs-backup" $driveFsPath `
            --config "C:\rclone-config\rclone.conf" `
            --create-empty-src-dirs
          echo "✅ Google-Drive-Session wiederhergestellt (falls vorhanden)."

      - name: Start Google Drive Desktop
        shell: powershell
        run: |
          $drivePath = "C:\Program Files\Google\Drive File Stream"
          $exe = Get-ChildItem -Path $drivePath -Filter "GoogleDriveFS.exe" -Recurse | Select-Object -First 1
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 15
          echo "ℹ️  Falls dies die ALLERERSTE Session ist: Bitte gleich per RDP"
          echo "   verbinden und dich EINMALIG manuell in Google Drive einloggen."
          echo "   Ab der nächsten Session läuft es automatisch, ohne erneuten Login"
          echo "   (siehe Setup-Anleitung, Hinweis zu Google-Sicherheitsprüfungen)."

      - name: Enable Remote Desktop (RDP)
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
            Write-Error "❌ FEHLER: Secret RDP_PASSWORD ist nicht gesetzt!"
            exit 1
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $securePw = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser | Where-Object { $_.Name -like "*runneradmin*" -or $_.Name -like "*administrator*" } | Select-Object -First 1
          Set-LocalUser -Name $user.Name -Password $securePw
          echo "RDP aktiviert für Benutzer: $($user.Name)"

      - name: Start Cloudflare Tunnel
        shell: powershell
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TUNNEL_TOKEN)) {
            Write-Error "❌ FEHLER: Secret CLOUDFLARE_TUNNEL_TOKEN ist nicht gesetzt!"
            exit 1
          }

          Start-Process -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --no-autoupdate run --token $env:TUNNEL_TOKEN" `
            -RedirectStandardOutput "C:\cloudflared.log" `
            -RedirectStandardError "C:\cloudflared_err.log" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 5

          echo "=========================================="
          echo "✅ Windows Remote Desktop läuft, erreichbar via Cloudflare Zero Trust."
          echo "   Verbinden per: cloudflared access rdp --hostname DEIN-HOSTNAME --url rdp://localhost:3389"
          echo "   Danach RDP-Client auf localhost:PORT (siehe Anleitung unten)."
          echo "   Dein Arbeitsordner liegt live-synchronisiert unter G:\ (Google Drive)."
          echo "=========================================="

      - name: Keep Alive mit periodischer Sicherung der Google-Drive-Session & Auto-Neustart
        shell: powershell
        run: |
          $confPath    = "C:\rclone-config\rclone.conf"
          $driveFsPath = "C:\Users\runneradmin\AppData\Local\Google\DriveFS"
          $remote      = "backupcloud:drivefs-backup"

          function Backup-DriveSession {
            rclone sync $driveFsPath $remote --config $confPath --exclude "**/content_cache/**"
            echo "💾 Google-Drive-Session gesichert: $(Get-Date -Format 'HH:mm:ss')"
          }

          # Phase 1: ~325 Minuten aktiv, alle 15 Minuten Session-Backup
          # (Arbeitsdateien selbst brauchen KEIN manuelles Backup mehr -
          # Google Drive Desktop synchronisiert sie live im Hintergrund.)
          for ($i = 1; $i -le 21; $i++) {
            Start-Sleep -Seconds 900
            Backup-DriveSession
          }

          Backup-DriveSession
          echo "Stoße nächsten Lauf an (Auto-Neustart)..."
          $headers = @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            Accept        = "application/vnd.github+json"
          }
          $body = @{ ref = "${{ github.ref_name }}" } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/remote-desktop-windows.yml/dispatches" `
            -Headers $headers -Body $body

          Start-Sleep -Seconds 300
          echo "Dieser Lauf endet jetzt - der nachrückende Lauf übernimmt in Kürze."
