          EOF

          chmod +x ~/Desktop/*.desktop
          cp ~/Desktop/*.desktop ~/.local/share/applications/

          # Terminal look (fallback for older xfce4-terminal versions; newer ones are set via xfconf in the session script)
          cat > ~/.config/xfce4/terminal/terminalrc << 'EOF'
