          # Normal terminal (compact window, no menu bar)
          cat > ~/Desktop/terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Terminal
          Comment=Linux terminal
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar
          Icon=utilities-terminal
          Terminal=false
          Categories=System;TerminalEmulator;
          EOF

          # Google Drive terminal (opens gdsh, after "exit" you are back in a normal shell)
          cat > ~/Desktop/gdrive-terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Drive Terminal
          Comment=Navigate Google Drive with real file names
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar --title="Google Drive" -x bash -c "gdsh; exec bash"
          Icon=folder-remote
