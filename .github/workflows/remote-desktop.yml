          # gsd-xsettings passes font smoothing + scale to ALL apps (Chrome, Files, Terminal, Settings)
          XSETTINGS=""
          for p in /usr/libexec/gsd-xsettings /usr/lib/gnome-settings-daemon/gsd-xsettings; do
            [ -x "$p" ] && { XSETTINGS="$p"; break; }
