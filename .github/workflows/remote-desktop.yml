          #   4. Chrome policies explicitly ALLOW all Gemini / AI features (see below)
          # You still have to sign in to Chrome with your Google account (once per desktop).
          # ------------------------------------------------------------------
          sudo mkdir -p /etc/opt/chrome/policies/managed
          sudo tee /etc/opt/chrome/policies/managed/gemini-ai.json > /dev/null << 'EOF'
          {
            "GeminiSettings": 0,
            "GeminiActOnWebSettings": 0,
            "GenAiDefaultSettings": 0,
            "HelpMeWriteSettings": 0,
            "TabOrganizerSettings": 0,
            "TabCompareSettings": 0,
            "HistorySearchSettings": 0,
