          # Chrome start script: reads the chosen scale, sharp grayscale text, no smooth scrolling.
          # Before Chrome starts, the page zoom is set to 125 % (Settings > Appearance > Page zoom),
          # old Chrome lock files are removed and Gemini in Chrome is unlocked (see above).
          sudo tee /usr/local/bin/chrome-warp > /dev/null << 'EOF'
          #!/bin/bash
          SCALE=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
          PROFILE="$HOME/.config/google-chrome"
          if ! pgrep -x chrome > /dev/null; then
            rm -f "$PROFILE"/Singleton* 2>/dev/null
            # Gemini: remove the experiment config that switches Gemini off on Linux
            rm -f "$PROFILE"/Variations "$PROFILE"/VariationsSeed* "$PROFILE"/VariationsSafeSeed* 2>/dev/null
            mkdir -p "$PROFILE/Default"
            VERSION=$(/usr/bin/google-chrome-stable --version 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
            python3 - "$PROFILE/Default/Preferences" "$PROFILE/Local State" "${VERSION:-0}" << 'PY'
          import json, math, os, sys
          prefs_path, state_path, version = sys.argv[1], sys.argv[2], sys.argv[3]


          def load(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}


          def save(path, data):
              tmp = path + ".tmp"
              with open(tmp, "w") as f:
                  json.dump(data, f)
              os.replace(tmp, path)


          def mark_eligible(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "is_glic_eligible":
                          node[key] = True
                      else:
                          mark_eligible(value)
              elif isinstance(node, list):
                  for value in node:
                      mark_eligible(value)


          # --- profile preferences: page zoom 125 %, languages English (US) first ---
          prefs = load(prefs_path)
          # Chrome stores the zoom as a level: 125 % = log(1.25) / log(1.2)
          level = math.log(1.25) / math.log(1.2)
          prefs.setdefault("partition", {}).setdefault("default_zoom_level", {})["x"] = level
          intl = prefs.setdefault("intl", {})
          intl["selected_languages"] = "en-US,en,de"
          intl["accept_languages"] = "en-US,en,de"
          save(prefs_path, prefs)

          # --- browser state: US, eligible for Gemini, no stored experiment seed ---
          state = load(state_path)
          for key in [k for k in list(state) if k.startswith("variations_") and ("seed" in k or "signature" in k)]:
              state.pop(key, None)
          state["variations_country"] = "us"
          state["variations_permanent_consistency_country"] = [version, "us"]
          state.setdefault("glic", {})["is_glic_eligible"] = True
          mark_eligible(state)
          state.setdefault("intl", {})["app_locale"] = "en-US"
          labs = state.setdefault("browser", {}).setdefault("enabled_labs_experiments", [])
          for flag in ("glic@1", "glic-side-panel@1"):
              if flag not in labs:
                  labs.append(flag)
          save(state_path, state)
          PY
          fi
          # WebGL ON (e.g. Google Earth): there is no graphics card in the VNC desktop, so Chrome
          # renders WebGL in software (SwiftShader). Without these flags Chrome turns WebGL off.
          exec /usr/bin/google-chrome-stable \
            --proxy-server="socks5://127.0.0.1:1080" \
            --force-device-scale-factor="$SCALE" \
            --force-dark-mode \
            --lang=en-US \
            --enable-features=WebUIDarkMode,Glic,GlicRollout,GlicSidePanel,GlicActor,GlicLiveMode,GlicContextMenu,GlicWarming \
            --disable-features=GlicCountryFiltering,GlicLocaleFiltering,GlicUserStatusCheck \
            --glic-always-skip-fre \
            --variations-server-url=http://127.0.0.1:9/ \
            --variations-insecure-server-url=http://127.0.0.1:9/ \
            --start-maximized --no-first-run --no-default-browser-check \
            --disable-session-crashed-bubble --password-store=basic \
            --disable-smooth-scrolling \
            --disable-lcd-text \
            --force-color-profile=srgb \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            "$@"
          EOF
          sudo chmod +x /usr/local/bin/chrome-warp

          # VS Code start script (no GPU in VNC = smoother, logins saved in the GNOME keyring)
          # NEW: all VS Code traffic (sign-in, extensions, Copilot) through WARP
          sudo tee /usr/local/bin/vscode-launch > /dev/null << 'EOF'
          #!/bin/bash
          [ -f /etc/warp-proxy.env ] && . /etc/warp-proxy.env
          exec /usr/bin/code --disable-gpu --password-store=gnome-libsecret \
            --proxy-server=http://127.0.0.1:8118 --proxy-bypass-list="<local>" "$@"
          EOF
          sudo chmod +x /usr/local/bin/vscode-launch

          # Antigravity start script (waits politely if the background installation is not finished yet)
          # NEW: all Antigravity traffic through WARP
          sudo tee /usr/local/bin/antigravity-launch > /dev/null << 'EOF'
          #!/bin/bash
          [ -f /etc/warp-proxy.env ] && . /etc/warp-proxy.env
          for b in /usr/local/bin/antigravity /usr/bin/antigravity; do
            if [ -x "$b" ]; then
              exec "$b" --disable-gpu --password-store=gnome-libsecret \
                --proxy-server=http://127.0.0.1:8118 --proxy-bypass-list="<local>" "$@"
            fi
          done
          if [ ! -f /tmp/devtools.done ]; then
            zenity --info --width=360 --text="Antigravity is still being installed in the background.\nPlease try again in a minute." 2>/dev/null
          else
            zenity --error --width=360 --text="Antigravity could not be installed.\nSee /tmp/devtools-setup.log" 2>/dev/null
          fi
          EOF
          sudo chmod +x /usr/local/bin/antigravity-launch

          # Display scale dialog (bigger/smaller text and UI for all apps)
          sudo tee /usr/local/bin/desktop-scale > /dev/null << 'EOF'
          #!/bin/bash
          S="$1"
          if [ -z "$S" ]; then
            CUR=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
            S=$(zenity --list --title="Display scale" --text="Current: $CUR\nChoose a size:" \
                  --column="Scale" --column="Size" --height=360 --width=320 \
                  1 "100 % (small)" 1.25 "125 %" 1.5 "150 %" 1.75 "175 %" 2 "200 % (large)") || exit 0
          fi
          printf '%s' "$S" | grep -Eq '^[1-3](\.[0-9]{1,2})?$' || exit 1
          echo "$S" > "$HOME/.config/desktop-scale"
          gsettings set org.gnome.desktop.interface text-scaling-factor "$S"
          gsettings set org.gnome.desktop.interface cursor-size "$(python3 -c "print(int(round(24*$S)))")"
          [ -z "$1" ] && zenity --info --width=320 --text="Done. Please close and reopen Chrome to apply it there." || true
          EOF
          sudo chmod +x /usr/local/bin/desktop-scale

          # ------------------------------------------------------------------
          # "Run" dialog for Win+R (like Windows: type a program or command and press Enter)
          # ------------------------------------------------------------------
          sudo tee /usr/local/bin/run-dialog > /dev/null << 'EOF'
          #!/bin/bash
          CMD=$(zenity --entry --title="Run" --width=440 \
                --text="Type the name of a program or command (e.g. code, nautilus, google-chrome):") || exit 0
          [ -z "$CMD" ] && exit 0
          case "$CMD" in
            google-chrome|google-chrome-stable|chrome) CMD=/usr/local/bin/chrome-warp ;;
            code) CMD=/usr/local/bin/vscode-launch ;;
          esac
          setsid bash -c "$CMD" > /dev/null 2>&1 &
          EOF
          sudo chmod +x /usr/local/bin/run-dialog

          # ------------------------------------------------------------------
          # Runner clock (bottom right, directly above the bottom panel) - same size as before:
          #  - line 1 (small): time left until this runner shuts down + end time
          #  - line 2: world clock in ONE line, small, from west to east:
          #      CA (California), TX (Texas), OK (Oklahoma), FL (Florida), NY (New York),
          #      BR (Palmital, Parana, Brazil), Srv (time of this virtual server), IN (India), CN (China/Beijing)
          #    and at the end, big as before: the GERMAN time (Europe/Berlin, CET/CEST automatically).
          #  - Hover = all places with full names, weekday and date.
          #  - Summer/winter time of every place is switched automatically (time zone database).
          #  The system time zone and region are NOT changed (stay UTC / en_US).
          #  Colours: green > 60 min, yellow <= 60 min, red <= 15 min.
          # ------------------------------------------------------------------
          sudo tee /usr/local/bin/runner-clock > /dev/null << 'EOF'
          #!/usr/bin/python3
          """runner-clock - world clock (German time big) and the time left until this runner shuts down."""
          import datetime as dt
          import re
          import subprocess
          import time

          import gi
          gi.require_version("Gtk", "3.0")
          gi.require_version("Gdk", "3.0")
          gi.require_version("GdkX11", "3.0")
          from gi.repository import Gdk, GdkX11, GLib, Gtk  # noqa: F401  (GdkX11 provides get_xid)

          try:
              from zoneinfo import ZoneInfo
          except Exception:
              ZoneInfo = None


          def load_zone(name):
              if ZoneInfo is None or not name:
                  return None
              try:
                  return ZoneInfo(name)
              except Exception:
                  return None


          BERLIN = load_zone("Europe/Berlin")

          # (short label, time zone, name in the tooltip, fallback rule if no time zone database exists)
          # Order: from west to east. The German time follows at the end (big).
          WORLD = [
              ("CA", "America/Los_Angeles", "California (Los Angeles, San Francisco)", ("us", -8)),
              ("TX", "America/Chicago", "Texas (Dallas, Houston, Austin)", ("us", -6)),
              ("OK", "America/Chicago", "Oklahoma (Oklahoma City, Tulsa)", ("us", -6)),
              ("FL", "America/New_York", "Florida (Miami, Orlando, Tampa)", ("us", -5)),
              ("NY", "America/New_York", "New York", ("us", -5)),
              ("BR", "America/Sao_Paulo", "Palmital, Paraná (Brazil, Brasília time)", ("fixed", -3)),
              ("Srv", "", "Server (system time of this virtual machine)", ("server", 0)),
              ("IN", "Asia/Kolkata", "India (New Delhi, Mumbai, Bengaluru)", ("fixed", 5.5)),
              ("CN", "Asia/Shanghai", "China (Beijing)", ("fixed", 8)),
          ]
          ZONES = {name: load_zone(name) for _, name, _, _ in WORLD if name}

          END_FILE = "/tmp/runner-end-ts"
          HANDOVER_FILE = "/tmp/runner-handover-ts"
          SMALL_PT = 9   # font size of the world clock part (German time stays 12 pt)
          MIN_PT = 7     # on very narrow screens the world clock part shrinks down to this size
          DIM = "#9aa0a6"

          CSS = b"""
          #rc { background-color: #202124; }
          #rc-left { font-size: 8pt; color: #9aa0a6; }
          #rc-time { font-family: "DejaVu Sans Mono", monospace; font-size: 12pt; font-weight: bold; color: #e8eaed; }
          #rc-left.ok { color: #81c995; }
          #rc-left.warn { color: #fdd663; }
          #rc-left.crit { color: #f28b82; }
          """


          def last_sunday(year, month):
              day = dt.date(year, month, 31)  # March and October both have 31 days
              return day - dt.timedelta(days=(day.weekday() + 1) % 7)


          def nth_sunday(year, month, n):
              first = dt.date(year, month, 1)
              first_sunday = first + dt.timedelta(days=(6 - first.weekday()) % 7)
              return first_sunday + dt.timedelta(weeks=n - 1)


          def us_summer(utc, std):
              """US daylight saving time: 2nd Sunday in March 02:00 until 1st Sunday in November 02:00 (local)."""
              begin = dt.datetime.combine(nth_sunday(utc.year, 3, 2), dt.time(2), dt.timezone.utc) - dt.timedelta(hours=std)
              end = dt.datetime.combine(nth_sunday(utc.year, 11, 1), dt.time(2), dt.timezone.utc) - dt.timedelta(hours=std + 1)
              return begin <= utc < end


          def utc_label(offset):
              sign = "+" if offset >= 0 else "-"
              minutes = int(round(abs(offset) * 60))
              hours, rest = divmod(minutes, 60)
              return f"UTC{sign}{hours}" + (f":{rest:02d}" if rest else "")


          def german_time(ts):
              utc = dt.datetime.fromtimestamp(ts, dt.timezone.utc)
              if BERLIN is not None:
                  local = utc.astimezone(BERLIN)
                  return local, local.tzname()
              # Fallback without time zone database: EU summer time rule
              begin = dt.datetime.combine(last_sunday(utc.year, 3), dt.time(1), dt.timezone.utc)
              end = dt.datetime.combine(last_sunday(utc.year, 10), dt.time(1), dt.timezone.utc)
              if begin <= utc < end:
                  return utc + dt.timedelta(hours=2), "CEST"
              return utc + dt.timedelta(hours=1), "CET"


          def zone_time(ts, name, rule):
              kind, std = rule
              if kind == "server":
                  local = dt.datetime.fromtimestamp(ts).astimezone()
                  return local, local.tzname() or "local"
              utc = dt.datetime.fromtimestamp(ts, dt.timezone.utc)
              tz = ZONES.get(name)
              if tz is not None:
                  local = utc.astimezone(tz)
                  return local, local.tzname()
              offset = std + 1 if kind == "us" and us_summer(utc, std) else std
              return utc + dt.timedelta(hours=offset), utc_label(offset)


          def read_ts(path):
              try:
                  with open(path) as f:
                      return int(f.read().strip())
              except (OSError, ValueError):
                  return None


          def fmt_left(sec):
              if sec >= 3600:
                  return f"{sec // 3600} h {sec % 3600 // 60:02d} min"
              if sec >= 600:
                  return f"{sec // 60} min"
              return f"{sec // 60}:{sec % 60:02d} min"


          def xprop(*args):
              try:
                  return subprocess.run(["xprop", *args], capture_output=True, text=True, timeout=3).stdout
              except Exception:
                  return ""


          def reserved_bottom(own_xid):
              """Height that other docks (the GNOME bottom panel) reserve at the bottom of the screen."""
              best = 0
              for wid in re.findall(r"0x[0-9a-fA-F]+", xprop("-root", "_NET_CLIENT_LIST")):
                  if int(wid, 16) == own_xid:
                      continue
                  out = xprop("-id", wid, "_NET_WM_STRUT_PARTIAL")
                  if "=" not in out:
                      continue
                  nums = [int(n) for n in re.findall(r"\d+", out.split("=", 1)[1])]
                  if len(nums) >= 4:
                      best = max(best, nums[3])
              return best


          def set_strut(xid, bottom, x0, x1):
              """Reserve space so maximized windows end above the clock (nothing gets covered)."""
              wid = hex(xid)
              try:
                  subprocess.run(["xprop", "-id", wid, "-f", "_NET_WM_STRUT_PARTIAL", "32c", "-set",
                                  "_NET_WM_STRUT_PARTIAL", f"0, 0, 0, {bottom}, 0, 0, 0, 0, 0, 0, {x0}, {x1}"],
                                 capture_output=True, timeout=3)
                  subprocess.run(["xprop", "-id", wid, "-f", "_NET_WM_STRUT", "32c", "-set",
                                  "_NET_WM_STRUT", f"0, 0, 0, {bottom}"], capture_output=True, timeout=3)
              except Exception:
                  pass


          class RunnerClock(Gtk.Window):
              def __init__(self):
                  super().__init__(title="Runner clock")
                  self.set_name("rc")
                  self.set_type_hint(Gdk.WindowTypeHint.DOCK)
                  self.set_decorated(False)
                  self.set_resizable(False)
                  self.set_skip_taskbar_hint(True)
                  self.set_skip_pager_hint(True)
                  self.set_keep_above(True)
                  self.set_accept_focus(False)
                  self.stick()

                  box = Gtk.Box(orientation=Gtk.Orientation.VERTICAL)
                  box.set_margin_start(12)
                  box.set_margin_end(12)
                  box.set_margin_top(3)
                  box.set_margin_bottom(3)
                  self.left = Gtk.Label(xalign=1.0)
                  self.left.set_name("rc-left")
                  self.clock = Gtk.Label(xalign=1.0)
                  self.clock.set_name("rc-time")
                  box.pack_start(self.left, False, False, 0)
                  box.pack_start(self.clock, False, False, 0)
                  self.add(box)

                  self.geo = None
                  self.strut = None
                  self.panel = 0
                  self.scanned = 0.0
                  self.tip = ""
                  self.markup = ""
                  self.small_pt = SMALL_PT
                  self.connect("destroy", Gtk.main_quit)
                  self.update()
                  self.show_all()

                  screen = Gdk.Screen.get_default()
                  screen.connect("size-changed", lambda *_: self.screen_changed())
                  screen.connect("monitors-changed", lambda *_: self.screen_changed())
                  GLib.timeout_add(500, self.update)
                  GLib.timeout_add(2000, self.place)
                  self.place(True)

              def screen_changed(self):
                  self.small_pt = SMALL_PT   # new screen size: start again with the normal size
                  self.update()
                  self.place(True)

              def update(self):
                  now = time.time()

                  # ---- line 2: world clock (small) + German time (big) ----
                  parts, world_tip = [], []
                  for short, name, long_name, rule in WORLD:
                      local, abbr = zone_time(now, name, rule)
                      parts.append(f'<span foreground="{DIM}">{short}</span> {local:%H:%M}')
                      world_tip.append(f"{short:<4}{local:%a %d.%m. %H:%M}  {abbr:<5}  {long_name}")
                  de, tz = german_time(now)
                  world_tip.append(f"{'DE':<4}{de:%a %d.%m. %H:%M}  {tz:<5}  Germany (Europe/Berlin)")
                  world = "  ".join(parts)
                  markup = (f'<span size="{self.small_pt * 1024}" weight="normal">{world}   '
                            f'<span foreground="{DIM}">DE</span></span> {de:%H:%M:%S} {tz}')
                  if markup != self.markup:
                      self.clock.set_markup(markup)
                      self.markup = markup

                  # ---- line 1: time left until this runner shuts down ----
                  ctx = self.left.get_style_context()
                  for c in ("ok", "warn", "crit"):
                      ctx.remove_class(c)
                  tip = "World clock (summer/winter time is switched automatically):\n" + "\n".join(world_tip)
                  tip += "\nThe system time zone of the server is not changed."
                  end = read_ts(END_FILE)
                  if end is None:
                      self.left.set_text("Runner: time left unknown")
                  else:
                      left = int(end - now)
                      end_local, end_tz = german_time(end)
                      if left > 0:
                          self.left.set_text(f"Runner: {fmt_left(left)} left (ends {end_local:%H:%M})")
                          ctx.add_class("ok" if left > 3600 else "warn" if left > 900 else "crit")
                      else:
                          self.left.set_text("Runner ending - new desktop takes over")
                          ctx.add_class("crit")
                      tip += f"\n\nThis desktop ends at {end_local:%H:%M} {end_tz} (German time)."
                      hand = read_ts(HANDOVER_FILE)
                      if hand:
                          tip += f"\nThe next desktop starts preparing at {german_time(hand)[0]:%H:%M}."
                      tip += "\nPush or save your work before the end - local files are not carried over."
                  if tip != self.tip:
                      self.set_tooltip_text(tip)
                      self.tip = tip
                  return True

              def place(self, rescan=False):
                  win = self.get_window()
                  display = Gdk.Display.get_default()
                  mon = display.get_primary_monitor() or display.get_monitor(0) if display else None
                  if win is None or mon is None:
                      return True
                  g = mon.get_geometry()
                  xid = win.get_xid()
                  if rescan or time.monotonic() - self.scanned > 10:
                      self.panel = reserved_bottom(xid)
                      self.scanned = time.monotonic()
                  nat = self.get_preferred_size()[1]
                  w, h = nat.width, nat.height
                  # Very narrow screen: make the world clock part smaller instead of taking more space
                  if w > g.width * 0.85 and self.small_pt > MIN_PT:
                      self.small_pt -= 1
                      self.update()
                      nat = self.get_preferred_size()[1]
                      w, h = nat.width, nat.height
                  x = g.x + max(0, g.width - w)
                  y = g.y + g.height - self.panel - h
                  if (x, y, w, h) != self.geo:
                      self.resize(w, h)
                      self.move(x, y)
                      self.geo = (x, y, w, h)
                  strut = (self.panel + h, x, g.x + g.width - 1)
                  if strut != self.strut:
                      set_strut(xid, *strut)
                      self.strut = strut
                  return True


          def main():
              provider = Gtk.CssProvider()
              provider.load_from_data(CSS)
              Gtk.StyleContext.add_provider_for_screen(
                  Gdk.Screen.get_default(), provider, Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION)
              RunnerClock()
              Gtk.main()


          if __name__ == "__main__":
              main()
          EOF
          sudo chmod +x /usr/local/bin/runner-clock
          python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" /usr/local/bin/runner-clock && echo "✅ runner-clock installed"

          # Chrome launcher (routed through the WARP SOCKS5 proxy)
          cat > ~/Desktop/google-chrome.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome (WARP ZT)
          Comment=Web browser via Cloudflare Zero Trust
          Exec=/usr/local/bin/chrome-warp %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          # VS Code launcher
          cat > ~/Desktop/vscode.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Visual Studio Code
          Comment=Code editor
          Exec=/usr/local/bin/vscode-launch --new-window %F
          Icon=vscode
          Terminal=false
          Categories=Development;IDE;
          EOF

          # Antigravity launcher
          cat > ~/Desktop/antigravity.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Antigravity
          Comment=Google Antigravity IDE
          Exec=/usr/local/bin/antigravity-launch %F
          Icon=/usr/local/share/antigravity.png
          Terminal=false
          Categories=Development;IDE;
          EOF

          # AI terminal (shows how to start Copilot CLI and Antigravity CLI)
          cat > ~/Desktop/ai-terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=AI Terminal (copilot / agy)
          Comment=Terminal for GitHub Copilot CLI and Antigravity CLI
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar --title="AI Terminal" -x bash -c "echo 'GitHub Copilot CLI:  copilot'; echo 'Antigravity CLI:     agy       (first time: sign in with Google)'; echo; exec bash"
          Icon=utilities-terminal
          Terminal=false
          Categories=System;Development;
          EOF

          # Display scale launcher
          cat > ~/Desktop/display-scale.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Display scale
          Comment=Make text and windows bigger or smaller
          Exec=/usr/local/bin/desktop-scale
          Icon=preferences-desktop-display
          Terminal=false
          Categories=Settings;
          EOF

          # GNOME Settings (Online Accounts -> Google Drive)
          cat > ~/Desktop/gnome-control-center.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Settings (Online Accounts)
          Comment=GNOME Settings - add a Google account for Google Drive
          Exec=env GIO_USE_NETWORK_MONITOR=netlink XDG_CURRENT_DESKTOP=GNOME gnome-control-center online-accounts
          Icon=org.gnome.Settings
          Terminal=false
          Categories=Settings;
          EOF

          # File manager (Google Drive appears on the left after login)
          cat > ~/Desktop/nautilus.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Files (Google Drive)
          Exec=nautilus --new-window
          Icon=org.gnome.Nautilus
          Terminal=false
          Categories=Utility;
          EOF

          # Normal terminal (compact window, no menu bar)
          cat > ~/Desktop/terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Terminal
          Comment=Linux terminal
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar
          Icon=utilities-terminal
          Terminal=false
          Categories=System;TerminalEmulator;
          EOF

          # Google Drive terminal (opens gdsh, after "exit" you are back in a normal shell)
          cat > ~/Desktop/gdrive-terminal.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Drive Terminal
          Comment=Navigate Google Drive with real file names
          Exec=xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar --title="Google Drive" -x bash -c "gdsh; exec bash"
          Icon=folder-remote
          Terminal=false
          Categories=System;Utility;
          EOF

          chmod +x ~/Desktop/*.desktop
          cp ~/Desktop/*.desktop ~/.local/share/applications/

          # Links and sign-in pages from VS Code / Antigravity / CLIs open in Chrome (WARP)
          xdg-mime default google-chrome.desktop x-scheme-handler/http x-scheme-handler/https text/html 2>/dev/null || true
          mkdir -p ~/.config
          cat > ~/.config/mimeapps.list << 'EOF'
          [Default Applications]
          x-scheme-handler/http=google-chrome.desktop
          x-scheme-handler/https=google-chrome.desktop
          text/html=google-chrome.desktop
          EOF

          # ------------------------------------------------------------------
          # Windows-like APP shortcuts (window shortcuts like Alt+Tab are set in the session script)
          #   Win+E          = Files            Win+R          = Run dialog
          #   Win+I          = Settings         Ctrl+Shift+Esc = Task Manager (htop)
          #   Ctrl+Alt+T     = Terminal
          # ------------------------------------------------------------------
          cat > ~/.xbindkeysrc << 'EOF'
          "nautilus --new-window"
            Mod4 + e

          "/usr/local/bin/run-dialog"
            Mod4 + r

          "env GIO_USE_NETWORK_MONITOR=netlink XDG_CURRENT_DESKTOP=GNOME gnome-control-center"
            Mod4 + i

          "xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar --title=TaskManager -x htop"
            Control+Shift + Escape

          "xfce4-terminal --geometry=110x30 --hide-menubar --hide-toolbar"
            Control+Alt + t
          EOF

          # Terminal look (fallback for older xfce4-terminal versions; newer ones are set via xfconf in the session script)
          cat > ~/.config/xfce4/terminal/terminalrc << 'EOF'
          [Configuration]
          FontName=DejaVu Sans Mono 11
          FontUseSystem=FALSE
          MiscDefaultGeometry=110x30
          MiscMenubarDefault=FALSE
          MiscToolbarDefault=FALSE
          MiscConfirmClose=FALSE
          ScrollingUnlimited=TRUE
          ColorForeground=#e6e6e6
          ColorBackground=#1e1e1e
          ColorCursor=#e6e6e6
          EOF

          # Sharp fonts for apps that read fontconfig directly: grayscale antialiasing, slight hinting
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="font">
              <edit name="antialias" mode="assign"><bool>true</bool></edit>
              <edit name="hinting" mode="assign"><bool>true</bool></edit>
              <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
              <edit name="rgba" mode="assign"><const>none</const></edit>
              <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
            </match>
          </fontconfig>
          EOF

          # Comfortable bash: short colored prompt, CMD-like aliases, fast search and folder jumps
          cat >> ~/.bashrc << 'EOF'

          # ---- Terminal comfort ----
          export PATH="/usr/local/go/bin:$HOME/go/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          # All traffic (git, go, curl, pip, npm, apt ...) through Cloudflare WARP. Check: proxy-check
          [ -f /etc/warp-proxy.env ] && . /etc/warp-proxy.env
          # Emergency only (WARP down): run ONE command without WARP, e.g.  direct git pull
          direct() { env -u http_proxy -u https_proxy -u ftp_proxy -u all_proxy -u HTTP_PROXY -u HTTPS_PROXY -u FTP_PROXY -u ALL_PROXY "$@"; }
          export EDITOR=nano
          export VISUAL=nano
          export BROWSER=/usr/local/bin/chrome-warp
          PS1='\[\e[1;32m\]\u\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          alias ls='ls --color=auto --group-directories-first'
          alias ll='ls -alh'
          alias la='ls -A'
          alias dir='ls -lh'
          alias cls='clear'
          alias ..='cd ..'
          alias ...='cd ../..'
          alias grep='grep --color=auto'
          alias df='df -h'
          alias du='du -h'
          alias free='free -h'
          alias drive='gdsh'
          # GitHub token from the GH_PAT secret for Copilot CLI (no /login needed)
          [ -f "$HOME/.config/gh-pat" ] && export COPILOT_GITHUB_TOKEN="$(cat "$HOME/.config/gh-pat")"
          # Open VS Code / Antigravity from the terminal, e.g. "code ." or "ag ."
          alias code='/usr/local/bin/vscode-launch'
          alias ag='/usr/local/bin/antigravity-launch'
          # Unpack almost any archive: x file.zip / file.tar.gz / file.7z / file.rar
          x() { [ -f "$1" ] || { echo "File not found: $1"; return 1; }; bsdtar -xvf "$1"; }
          HISTSIZE=10000
          HISTFILESIZE=20000
          shopt -s histappend autocd cdspell 2>/dev/null
          bind 'set completion-ignore-case on' 2>/dev/null
          [ -f /usr/share/bash-completion/bash_completion ] && . /usr/share/bash-completion/bash_completion
          [ -f /usr/share/doc/fzf/examples/key-bindings.bash ] && . /usr/share/doc/fzf/examples/key-bindings.bash
          command -v zoxide >/dev/null && eval "$(zoxide init bash)"
          EOF

          # Desktop session WITHOUT gnome-session (prevents "Oh no! Something has gone wrong")
          # A watchdog restarts crashed parts automatically.
          cat > ~/desktop-session.sh << 'EOF'
          #!/bin/bash
          export DISPLAY=:99
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=GNOME-Flashback:GNOME
          export XDG_SESSION_DESKTOP=gnome-flashback-metacity
          export DESKTOP_SESSION=gnome-flashback-metacity
          export NO_AT_BRIDGE=1
          export BROWSER=/usr/local/bin/chrome-warp
          export PATH="/usr/local/go/bin:$HOME/go/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          # NEW: every program started on the desktop goes through WARP
          [ -f /etc/warp-proxy.env ] && . /etc/warp-proxy.env
          # Check network state directly instead of via NetworkManager (fixes "offline")
          export GIO_USE_NETWORK_MONITOR=netlink
          export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # Own D-Bus session (apps started via D-Bus also get the WARP proxy variables)
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID
          dbus-update-activation-environment GIO_USE_NETWORK_MONITOR DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR BROWSER PATH \
            http_proxy https_proxy ftp_proxy all_proxy no_proxy HTTP_PROXY HTTPS_PROXY FTP_PROXY ALL_PROXY NO_PROXY \
            NODE_USE_ENV_PROXY SSL_CERT_FILE REQUESTS_CA_BUNDLE NODE_EXTRA_CA_CERTS 2>/dev/null || true

          # Unlock keyring with empty password (for Online Accounts / Google Drive / VS Code / Antigravity)
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets,pkcs11 >/dev/null 2>&1 || true
          eval "$(gnome-keyring-daemon --start --components=secrets,pkcs11 2>/dev/null)" || true
          export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK

          # NEW: GNOME proxy (Files / Google Drive, Online Accounts, GNOME apps) through WARP
          gsettings set org.gnome.system.proxy mode 'manual' 2>/dev/null || true
          gsettings set org.gnome.system.proxy.http host '127.0.0.1' 2>/dev/null || true
          gsettings set org.gnome.system.proxy.http port 8118 2>/dev/null || true
          gsettings set org.gnome.system.proxy.https host '127.0.0.1' 2>/dev/null || true
          gsettings set org.gnome.system.proxy.https port 8118 2>/dev/null || true
          gsettings set org.gnome.system.proxy.socks host '127.0.0.1' 2>/dev/null || true
          gsettings set org.gnome.system.proxy.socks port 1080 2>/dev/null || true
          gsettings set org.gnome.system.proxy ignore-hosts "['localhost', '127.0.0.0/8', '::1']" 2>/dev/null || true

          # Dark theme & desktop icons
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' || true
          gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark' || true
          gsettings set org.gnome.gnome-flashback desktop true || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.default-applications.terminal exec 'xfce4-terminal' 2>/dev/null || true

          # PERFORMANCE: no animations, no compositing (much smoother over VNC)
          gsettings set org.gnome.desktop.interface enable-animations false || true
          gsettings set org.gnome.metacity compositing-manager false 2>/dev/null || true

          # PERFORMANCE: plain dark background instead of a picture (less data on every window move)
          gsettings set org.gnome.desktop.background picture-options 'none' 2>/dev/null || true
          gsettings set org.gnome.desktop.background color-shading-type 'solid' 2>/dev/null || true
          gsettings set org.gnome.desktop.background primary-color '#202124' 2>/dev/null || true

          # SHARPNESS: grayscale font smoothing (no coloured fringes, compresses cleaner over VNC)
          gsettings set org.gnome.desktop.interface font-antialiasing 'grayscale' 2>/dev/null || true
          gsettings set org.gnome.desktop.interface font-hinting 'slight' 2>/dev/null || true
          gsettings set org.gnome.settings-daemon.plugins.xsettings antialiasing 'grayscale' 2>/dev/null || true
          gsettings set org.gnome.settings-daemon.plugins.xsettings hinting 'slight' 2>/dev/null || true

          # UI scale chosen in the workflow (or later via "Display scale")
          SCALE=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
          gsettings set org.gnome.desktop.interface text-scaling-factor "$SCALE" 2>/dev/null || true
          gsettings set org.gnome.desktop.interface cursor-size "$(python3 -c "print(int(round(24*$SCALE)))")" 2>/dev/null || true

          # ------------------------------------------------------------------
          # Windows-like WINDOW shortcuts (window manager metacity)
          #   Alt+Tab / Win+Tab           = switch between ALL windows (Shift = backwards)
          #   Alt+Esc                     = cycle windows directly      Alt+F4      = close window
          #   Win+Up / Win+Down           = maximize / restore          Win+H       = minimize
          #   Win+Left / Win+Right        = window to left / right half Win+D, Win+M = show desktop
          #   Ctrl+Win+Left / Right       = previous / next workspace   Alt+Space   = window menu
          #   Win+S / Alt+F1              = applications menu
          # ------------------------------------------------------------------
          # Make sure the Windows key works as "Super" modifier
          if ! xmodmap -pm 2>/dev/null | grep -E '^mod4' | grep -q Super_L; then
            xmodmap -e 'add mod4 = Super_L Super_R' 2>/dev/null || true
          fi
          kb() { gsettings set "$1" "$2" "$3" 2>/dev/null || true; }
          WMK=org.gnome.desktop.wm.keybindings
          kb $WMK switch-applications "@as []"
          kb $WMK switch-applications-backward "@as []"
          kb $WMK switch-windows "['<Alt>Tab', '<Super>Tab']"
          kb $WMK switch-windows-backward "['<Shift><Alt>Tab', '<Shift><Super>Tab']"
          kb $WMK cycle-windows "['<Alt>Escape']"
          kb $WMK cycle-windows-backward "['<Shift><Alt>Escape']"
          kb $WMK close "['<Alt>F4']"
          kb $WMK maximize "['<Super>Up']"
          kb $WMK unmaximize "['<Super>Down']"
          kb $WMK minimize "['<Super>h']"
          kb $WMK show-desktop "['<Super>d', '<Super>m']"
          kb $WMK activate-window-menu "['<Alt>space']"
          kb $WMK panel-main-menu "['<Alt>F1', '<Super>s']"
          kb $WMK switch-to-workspace-left "['<Control><Super>Left']"
          kb $WMK switch-to-workspace-right "['<Control><Super>Right']"
          kb org.gnome.metacity.keybindings toggle-tiled-left "['<Super>Left']"
          kb org.gnome.metacity.keybindings toggle-tiled-right "['<Super>Right']"

          for f in "$HOME"/Desktop/*.desktop; do gio set "$f" metadata::trusted true 2>/dev/null || true; done

          # Terminal look (xfce4-terminal 1.x stores settings in xfconf)
          if command -v xfconf-query >/dev/null; then
            xt() { xfconf-query -c xfce4-terminal -p "$1" -n -t "$2" -s "$3" 2>/dev/null || true; }
            xt /font-name string "DejaVu Sans Mono 11"
            xt /font-use-system bool false
            xt /misc-default-geometry string "110x30"
            xt /misc-menubar-default bool false
            xt /misc-toolbar-default bool false
            xt /misc-confirm-close bool false
            xt /scrolling-unlimited bool true
            xt /color-foreground string "#e6e6e6"
            xt /color-background string "#1e1e1e"
            xt /color-cursor string "#e6e6e6"
          fi

          # gsd-xsettings passes font smoothing + scale to ALL apps (Chrome, Files, Terminal, Settings)
          XSETTINGS=""
          for p in /usr/libexec/gsd-xsettings /usr/lib/gnome-settings-daemon/gsd-xsettings; do
            [ -x "$p" ] && { XSETTINGS="$p"; break; }
          done

          start_if_missing() {
            local name="$1"; shift
            if ! pgrep -u "$(id -u)" -x "$name" >/dev/null; then
              echo "$(date '+%H:%M:%S') starting $name"
              "$@" >> "/tmp/desktop-$name.log" 2>&1 &
              sleep 1
            fi
          }

          while true; do
            [ -n "$XSETTINGS" ] && start_if_missing gsd-xsettings "$XSETTINGS"
            start_if_missing metacity metacity --replace
            start_if_missing gnome-flashback gnome-flashback
            start_if_missing gnome-panel gnome-panel
            # Windows-like app shortcuts (Win+E, Win+R, Win+I, Ctrl+Shift+Esc, Ctrl+Alt+T)
            command -v xbindkeys >/dev/null && start_if_missing xbindkeys xbindkeys -n -f "$HOME/.xbindkeysrc"
            # German time + world clock + runner countdown (bottom right)
            if ! pgrep -u "$(id -u)" -f /usr/local/bin/runner-clock >/dev/null; then
              echo "$(date '+%H:%M:%S') starting runner-clock"
              /usr/local/bin/runner-clock >> /tmp/desktop-runner-clock.log 2>&1 &
            fi
            sleep 5
          done
          EOF
          chmod +x ~/desktop-session.sh

          # Helper: give the picture pipeline (VNC server, web proxy, tunnel) priority over everything else
          sudo tee /usr/local/bin/boost-priority > /dev/null << 'EOF'
          #!/bin/bash
          for p in $(pgrep -x Xtigervnc; pgrep -x Xvfb; pgrep -x x11vnc; pgrep -f websockify; pgrep -x cloudflared); do
            sudo renice -n -10 -p "$p" > /dev/null 2>&1 || true
          done
          EOF
          sudo chmod +x /usr/local/bin/boost-priority

      - name: Start Display, Desktop Session & VNC
        run: |
          # 1. Virtual display + VNC server.
          #    Preferred: TigerVNC (display and VNC in ONE process = faster, better compression, supports remote resize).
          #    Fallback: Xvfb + x11vnc if TigerVNC does not start.
          VNC_OK=0
          if command -v Xtigervnc >/dev/null; then
            nohup Xtigervnc :99 -geometry 1920x1080 -depth 24 -dpi 96 \
              -rfbport 5900 -SecurityTypes None -localhost \
              -AlwaysShared -ac -FrameRate 60 -CompareFB 2 > /tmp/xvnc.log 2>&1 &
            for i in $(seq 1 20); do
              xdpyinfo -display :99 >/dev/null 2>&1 && { VNC_OK=1; break; }
              sleep 0.5
            done
            if [ "$VNC_OK" != "1" ]; then
              echo "⚠️ Xtigervnc does not start - switching to Xvfb + x11vnc. Log:"
              cat /tmp/xvnc.log
              pkill -x Xtigervnc 2>/dev/null || true
              sleep 1
            fi
          fi

          if [ "$VNC_OK" = "1" ]; then
            echo "tigervnc" > /tmp/vnc-mode
            echo "✅ TigerVNC running."
          else
            nohup Xvfb :99 -screen 0 1920x1080x24 -dpi 96 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
            for i in $(seq 1 20); do
              xdpyinfo -display :99 >/dev/null 2>&1 && break
              sleep 0.5
            done
            xdpyinfo -display :99 >/dev/null 2>&1 || { echo "❌ Xvfb does not start"; cat /tmp/xvfb.log; exit 1; }
            echo "xvfb" > /tmp/vnc-mode
          fi

          # 2. Start the desktop session with watchdog (keeps running on its own, we do NOT wait for it here)
          nohup setsid bash ~/desktop-session.sh > /tmp/desktop-session.log 2>&1 &

          # 3. Only for the fallback: separate VNC server (no password, local only, short wait times = smoother)
          if [ "$(cat /tmp/vnc-mode)" = "xvfb" ]; then
            x11vnc -nopw -localhost -rfbport 5900 -forever -shared -display :99 -wait 5 -defer 5 -bg -o /tmp/x11vnc.log
            echo "✅ Fallback x11vnc running."
          fi

          # 4. noVNC web proxy (port 6080, local only)
          nohup websockify --web=/usr/share/novnc/ 127.0.0.1:6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 1
          boost-priority
          echo "⏱ Display + VNC running after $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds (mode: $(cat /tmp/vnc-mode))"

      - name: Hand over (wait until the previous desktop has finished)
        if: github.event.inputs.handover == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # This desktop is fully prepared. It takes over the tunnel the moment the older run has ended.
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          echo "New desktop is ready ($(( $(date +%s) - $(cat /tmp/start-ts) )) s). Waiting until the old desktop has finished ..."
          FAIL=0
          for i in $(seq 1 360); do   # 360 x 5 s = at most 30 minutes
            if gh api "repos/$REPO/actions/workflows/$WF_FILE/runs?status=in_progress&per_page=100" > /tmp/old.json 2>/dev/null; then
              FAIL=0
              N=$(jq --argjson id "$RUN_ID" --argjson num "$RUN_NUMBER" '[.workflow_runs[] | select(.id != $id and .run_number < $num)] | length' /tmp/old.json)
              if [ "${N:-1}" = "0" ]; then
                echo "✅ Old desktop has finished - taking over now."
                break
              fi
            else
              FAIL=$((FAIL + 1))
              if [ "$FAIL" -ge 5 ]; then
                echo "⚠️ GitHub API not reachable - taking over anyway."
                break
              fi
            fi
            sleep 5
          done

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "❌ ERROR: Secret CLOUDFLARE_TUNNEL_TOKEN is not set!"
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          # Wait until the tunnel is connected (max. 30 seconds)
          for i in $(seq 1 60); do
            grep -q "Registered tunnel connection" /tmp/cloudflared.log 2>/dev/null && break
            sleep 0.5
          done
          boost-priority

          # Make sure the desktop panel is up (max. 20 seconds)
          for i in $(seq 1 20); do
            pgrep -x gnome-panel >/dev/null && break
            sleep 1
          done

          echo "--- Desktop status ---"
          cat /tmp/desktop-session.log
          pgrep -a -x metacity || echo "⚠️ metacity is not running"
          pgrep -a -x gnome-flashback || echo "⚠️ gnome-flashback is not running"
          pgrep -a -x gnome-panel || echo "⚠️ gnome-panel is not running"
          pgrep -a -x gsd-xsettings || echo "⚠️ gsd-xsettings is not running (fonts/scale may look different)"
          pgrep -x xbindkeys >/dev/null && echo "xbindkeys is running (Win+E, Win+R, Win+I, Ctrl+Shift+Esc)" || echo "⚠️ xbindkeys is not running (see /tmp/desktop-xbindkeys.log)"
          pgrep -f /usr/local/bin/runner-clock >/dev/null && echo "runner-clock is running" || echo "⚠️ runner-clock is not running (see /tmp/desktop-runner-clock.log)"
          pgrep -x privoxy >/dev/null && echo "privoxy is running (system-wide WARP proxy)" || echo "⚠️ privoxy is not running - apps outside Chrome have no internet"

          echo "=========================================="
          echo "✅ GNOME Remote Desktop is running and reachable via Cloudflare Zero Trust."
          echo "   Open https://YOUR-SUBDOMAIN.YOUR-DOMAIN.com/ (uses the sharp + smooth settings automatically)"
          echo "   or directly: https://YOUR-SUBDOMAIN.YOUR-DOMAIN.com/vnc.html?autoconnect=true&resize=remote&quality=9&compression=2&reconnect=true"
          echo "   Two screens: https://YOUR-SUBDOMAIN.YOUR-DOMAIN.com/dual.html (close window 2 = back to one screen)"
          echo "   Press F11 in Chrome/Edge: full screen in which Alt+Tab, Win+Tab and the Windows key go to the remote desktop."
          echo "   All apps (terminal, git, go, VS Code ...) go through WARP. Check on the desktop: proxy-check"
          echo "   Gemini in Chrome: sign in to Chrome on the remote desktop, then click 'Ask Gemini' (top right) or press Alt+G."
          echo "   VNC mode: $(cat /tmp/vnc-mode)"
          echo "   Desktop ready after $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds."
          echo "=========================================="

      - name: Wait for WARP (started in background at the beginning)
        run: |
          # WARP was started in parallel at the very beginning. Usually it is done by now.
          for i in $(seq 1 100); do
            [ -f /tmp/warp.done ] && break
            [ -f /tmp/warp.failed ] && break
            sleep 3
          done
          echo "---------- WARP log ----------"
          cat /tmp/warp-setup.log 2>/dev/null || true
          echo "------------------------------"
          if [ -f /tmp/warp.failed ]; then
            echo "⚠️ WARP setup failed. Chrome will not load pages (no data leak)."
          elif [ ! -f /tmp/warp.done ]; then
            echo "⚠️ WARP was not finished after 5 minutes. See log above."
          fi
          # NEW: check the system-wide proxy (terminal, git, go ...) - only prints whether WARP is active
          if curl -s --max-time 15 -x http://127.0.0.1:8118 https://www.cloudflare.com/cdn-cgi/trace | grep -qE '^(warp=(on|plus)|gateway=on)'; then
            echo "✅ System-wide proxy: terminal, git, go and all apps go through Cloudflare WARP"
          else
            echo "⚠️ System-wide proxy: no way out through WARP - apps on the desktop have no internet (fail closed)"
          fi
          echo "Total time so far: $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds."

      # Only shows the result. The desktop is already usable, nothing waits for this step.
      - name: Check VS Code, Go, Antigravity, Antigravity CLI, Copilot CLI, Git & Repositories
        run: |
          for i in $(seq 1 100); do
            [ -f /tmp/devtools.done ] && break
            sleep 3
          done
          echo "---------- Dev tools log ----------"
          cat /tmp/devtools-setup.log 2>/dev/null || true
          echo "-----------------------------------"
          export PATH="/usr/local/go/bin:$HOME/go/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          echo "VS Code:          $(code --version 2>/dev/null | head -1 || echo 'missing')"
          echo "Go:               $(go version 2>/dev/null || echo '⚠️ missing')"
          echo "Go tools:         gopls $(command -v gopls >/dev/null && echo ok || echo '⚠️ missing'), dlv $(command -v dlv >/dev/null && echo ok || echo '⚠️ missing')"
          if [ -x /usr/local/bin/antigravity ] || [ -x /usr/bin/antigravity ]; then
            echo "Antigravity IDE:  installed"
          else
            echo "Antigravity IDE:  ⚠️ missing"
          fi
          echo "Antigravity CLI:  $(command -v agy >/dev/null && (agy --version 2>/dev/null | head -1 || echo installed) || echo '⚠️ missing')"
          echo "Copilot CLI:      $(command -v copilot >/dev/null && (copilot --version 2>/dev/null | head -1 || echo installed) || echo '⚠️ missing')"
          # PRIVACY: only "set / not set", never the name or e-mail
          echo "Git user:         name $([ -n "$(git config --global user.name)" ] && echo set || echo 'NOT set'), email $([ -n "$(git config --global user.email)" ] && echo set || echo 'NOT set')"
          [ -f ~/.git-credentials ] && echo "GitHub token:     stored for git, gh and Copilot CLI" || echo "GitHub token:     ⚠️ not stored"
          # PRIVACY: only counts, never repository names
          if [ -f /tmp/repos.done ]; then
            echo "Repositories:     $(grep -c '^ok' /tmp/repos.result 2>/dev/null) ok, $(grep -c '^failed' /tmp/repos.result 2>/dev/null) failed (details on the remote computer: /tmp/repo-clone.log)"
          else
            echo "Repositories:     still cloning in the background (so far $(grep -c '^ok' /tmp/repos.result 2>/dev/null) ok)"
          fi

      - name: Keep Alive (starts the next desktop early, then ends)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          health() {
            if [ "$(cat /tmp/vnc-mode 2>/dev/null)" = "tigervnc" ]; then
              pgrep -x Xtigervnc >/dev/null || echo "⚠️ Xtigervnc is no longer running"
            else
              pgrep -x Xvfb >/dev/null   || echo "⚠️ Xvfb is no longer running"
              pgrep -x x11vnc >/dev/null || echo "⚠️ x11vnc is no longer running"
            fi
            pgrep -x cloudflared >/dev/null || echo "⚠️ cloudflared is no longer running"
            pgrep -x privoxy >/dev/null || { echo "⚠️ privoxy stopped - restarting"; sudo systemctl restart privoxy 2>/dev/null || true; }
            echo "Load: $(cut -d' ' -f1-3 /proc/loadavg) | Free RAM: $(free -m | awk '/Mem:/ {print $7}') MB"
          }

          # Timeline (counted from the start of this job, values from the job "env" at the top):
          #   minute HANDOVER_MINUTES (315): start the NEXT desktop (it builds itself and waits for the handover)
          #   minute SESSION_MINUTES  (335): this run ends, the next desktop takes over within seconds
          START=$(cat /tmp/start-ts)
          HANDOVER_AT=$((START + HANDOVER_MINUTES * 60))
          END_AT=$((START + SESSION_MINUTES * 60))

          echo "Desktop active. The successor starts in $(( (HANDOVER_AT - $(date +%s)) / 60 )) minutes."
          N=0
          while [ "$(date +%s)" -lt "$HANDOVER_AT" ]; do
            sleep 30
            N=$((N + 1))
            if [ $((N % 30)) -eq 0 ]; then
              echo "Minute $(( ($(date +%s) - START) / 60 ))"
              health
              boost-priority
            fi
          done

          # Find the workflow file name automatically
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          echo "Starting successor (auto restart) for $WF_FILE ..."
          for TRY in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF_FILE/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"handover\":\"true\"}}")
            if [ "$CODE" = "204" ]; then
              echo "✅ Successor started."
              break
            fi
            echo "⚠️ Starting the successor failed (HTTP $CODE): $(cat /tmp/dispatch.out) - attempt $TRY/5"
            sleep 10
          done

          echo "This desktop keeps running for $(( (END_AT - $(date +%s)) / 60 )) more minutes, then the new one takes over."
          while [ "$(date +%s)" -lt "$END_AT" ]; do
            sleep 20
          done

          echo "This run ends now - the next run has taken over or will do so shortly."​‌

