name: Remote Desktop Runner (GNOME + Google Drive, Zero Trust, Auto-Restart)

on:
  workflow_dispatch:
  # Sicherheitsnetz: prüft alle 30 Minuten nach, ob die Auto-Neustart-Kette noch läuft.
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: remote-desktop
  cancel-in-progress: false

permissions:
  actions: write   # nötig, damit der Job den nächsten Lauf selbst anstoßen darf
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Hard-Limit von GitHub Actions liegt bei 360 Min.

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android || true
          docker system prune -af --volumes || true

      - name: Install GNOME Desktop Environment, Chrome & Online Accounts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gnome-session-flashback \
            gnome-control-center \
            gnome-online-accounts \
            nautilus \
            gnome-terminal \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            curl \
            wget \
            dbus-x11

          # Google Chrome installieren
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm google-chrome-stable_current_amd64.deb

      - name: Configure GNOME Dark Theme & Launchers
        run: |
          # Settings-Pfad erstellen
          mkdir -p ~/.config/autostart

          # Chrome-Startlink auf dem Desktop einrichten
          mkdir -p ~/Desktop
          cat > ~/Desktop/google-chrome.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Web-Browser (Dark Mode)
          Exec=/usr/bin/google-chrome-stable --force-dark-mode --enable-features=WebUIDarkMode --start-maximized --no-first-run --disable-session-crashed-bubble %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          EOF
          chmod +x ~/Desktop/google-chrome.desktop

          # Verknüpfung für GNOME Settings auf dem Desktop (für Online Accounts)
          cat > ~/Desktop/gnome-control-center.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Settings
          Comment=GNOME Settings (Online Accounts)
          Exec=gnome-control-center
          Icon=org.gnome.Settings
          Terminal=false
          Categories=Settings;
          EOF
          chmod +x ~/Desktop/gnome-control-center.desktop

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Display & GNOME Desktop Services
        run: |
          # Virtuelles Display (1080p) starten
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # D-Bus & GNOME Flashback Desktop-Umgebung starten
          export $(dbus-launch)
          gnome-session --session=gnome-flashback-metacity &
          sleep 5

          # VNC-Server ohne Passwort (-nopw), gebunden an localhost
          x11vnc -nopw -localhost -rfbport 5900 -forever -shared -display :99 &
          sleep 2

          # noVNC Web-Proxy (Port 6080) via websockify
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "❌ FEHLER: Secret CLOUDFLARE_TUNNEL_TOKEN ist nicht gesetzt!"
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          sleep 5

          echo "=========================================="
          echo "✅ GNOME Remote Desktop läuft und ist via Cloudflare Zero Trust erreichbar."
          echo "   Rufe https://DEINE-SUBDOMAIN.DEINE-DOMAIN.com/vnc.html auf"
          echo "=========================================="

      - name: Keep Alive (mit Auto-Neustart vor Ablauf)
        run: |
          echo "Phase 1: 325 Minuten aktiv..."
          for i in $(seq 1 325); do
            sleep 60
          done

          echo "Stoße nächsten Lauf an (Auto-Neustart)..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/remote-desktop.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"

          echo "Phase 2: restliche 10 Minuten aktiv..."
          for i in $(seq 1 10); do
            sleep 60
          done

          echo "Dieser Lauf endet jetzt - der nachrückende Lauf übernimmt in Kürze."
