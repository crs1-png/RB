          EOF

          # Sharp fonts for apps that read fontconfig directly: grayscale antialiasing, slight hinting
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="font">
              <edit name="antialias" mode="assign"><bool>true</bool></edit>
              <edit name="hinting" mode="assign"><bool>true</bool></edit>
              <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
              <edit name="rgba" mode="assign"><const>none</const></edit>
              <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
            </match>
          </fontconfig>
          EOF

          # Comfortable bash: short colored prompt, CMD-like aliases, fast search and folder jumps
          cat >> ~/.bashrc << 'EOF'

          # ---- Terminal comfort ----
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          export EDITOR=nano
          export VISUAL=nano
          PS1='\[\e[1;32m\]\u\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          alias ls='ls --color=auto --group-directories-first'
          alias ll='ls -alh'
          alias la='ls -A'
          alias dir='ls -lh'
          alias cls='clear'
          alias ..='cd ..'
          alias ...='cd ../..'
          alias grep='grep --color=auto'
          alias df='df -h'
          alias du='du -h'
          alias free='free -h'
          alias drive='gdsh'
          # Unpack almost any archive: x file.zip / file.tar.gz / file.7z / file.rar
          x() { [ -f "$1" ] || { echo "File not found: $1"; return 1; }; bsdtar -xvf "$1"; }
          HISTSIZE=10000
          HISTFILESIZE=20000
          shopt -s histappend autocd cdspell 2>/dev/null
          bind 'set completion-ignore-case on' 2>/dev/null
          [ -f /usr/share/bash-completion/bash_completion ] && . /usr/share/bash-completion/bash_completion
          [ -f /usr/share/doc/fzf/examples/key-bindings.bash ] && . /usr/share/doc/fzf/examples/key-bindings.bash
          command -v zoxide >/dev/null && eval "$(zoxide init bash)"
