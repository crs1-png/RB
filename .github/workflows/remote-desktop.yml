name: Remote Desktop Runner (Zero Trust, Auto-Restart)

on:
  workflow_dispatch:
  # Sicherheitsnetz: prüft alle 30 Minuten nach, ob die Auto-Neustart-Kette
  # (siehe letzter Schritt im Job) noch läuft. Läuft bereits eine Session,
  # passiert dank "concurrency" unten nichts Schädliches - der Trigger
  # wird einfach ignoriert bzw. ersetzt. Ist die Kette abgerissen
  # (z.B. Absturz, harter Timeout), startet dieser Cron sie neu.
  schedule:
    - cron: '*/30 * * * *'

# Genau 1 laufender + 1 wartender Lauf pro Gruppe (Standardverhalten von
# GitHub Actions). cancel-in-progress: false ist WICHTIG - sonst würde ein
# neuer, nachrückender Lauf den noch aktiven Desktop sofort abwürgen,
# statt sauber zu warten, bis der alte fertig ist.
concurrency:
  group: remote-desktop
  cancel-in-progress: false

permissions:
  actions: write   # nötig, damit der Job den nächsten Lauf selbst anstoßen darf
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Hard-Limit von GitHub Actions liegt bei 360 Min.

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android || true
          docker system prune -af --volumes || true

      - name: Install Desktop Environment & Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            curl \
            wget

          # Google Chrome installieren
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm google-chrome-stable_current_amd64.deb

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Display & Desktop Services
        run: |
          # Virtuelles Display (1080p) starten
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # XFCE Desktop-Umgebung starten
          startxfce4 &
          sleep 5

          # VNC-Server ohne Passwort starten (-nopw), nur auf localhost
          # gebunden (-localhost) - erreichbar ausschließlich über den
          # noVNC-Proxy, nicht direkt von außen.
          x11vnc -nopw -localhost -rfbport 5900 -forever -shared -display :99 &
          sleep 2

          # noVNC Web-Proxy starten (Port 6080) via websockify.
          # (Das apt-Paket "novnc" liefert das Skript utils/novnc_proxy
          # nicht zuverlässig mit - websockify ist der offiziell von
          # Debian/Ubuntu dokumentierte, zuverlässige Weg.)
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "❌ FEHLER: Secret CLOUDFLARE_TUNNEL_TOKEN ist nicht gesetzt!"
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          sleep 5

          echo "=========================================="
          echo "✅ Remote Desktop läuft und ist via Cloudflare Zero Trust erreichbar."
          echo "   Rufe https://DEINE-SUBDOMAIN.DEINE-DOMAIN.com/vnc.html auf"
          echo "=========================================="

      - name: Keep Alive (mit Auto-Neustart vor Ablauf)
        run: |
          # Phase 1: Großteil der Laufzeit "normal" offen halten.
          echo "Phase 1: 325 Minuten aktiv..."
          for i in $(seq 1 325); do
            sleep 60
          done

          # Jetzt - noch mit ausreichend Puffer vor dem 350-Minuten-Timeout -
          # den nächsten Lauf über die GitHub-API anstoßen. Er reiht sich
          # dank "concurrency" hinten an und startet automatisch, sobald
          # dieser Job hier endet.
          echo "Stoße nächsten Lauf an (Auto-Neustart)..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/remote-desktop.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"

          # Phase 2: restlichen Puffer noch verbinden lassen, bis dieser
          # Lauf sauber endet und der wartende Lauf übernehmen kann.
          echo "Phase 2: restliche 10 Minuten aktiv..."
          for i in $(seq 1 10); do
            sleep 60
          done

          echo "Dieser Lauf endet jetzt - der nachrückende Lauf übernimmt in Kürze."
