name: Remote Desktop Runner (GNOME + Google Drive, Zero Trust, Auto-Restart)


on:
  workflow_dispatch:
    inputs:
      handover:
        description: 'Internal: the new desktop prepares itself while the old one is still running (do not set by hand)'
        required: false
        default: 'false'
  # Safety net: every 30 minutes. A cron run only starts a desktop if none is running (see Guard step).
  schedule:
    - cron: '*/30 * * * *'


# NOTE: there is intentionally NO "concurrency" block.
# With a concurrency group the next run stays "pending" until the old one has finished,
# so the new desktop could only start building AFTER the old one ended (= minutes of waiting).
# Now the next run starts while the old one is still active and waits just before the tunnel step.


permissions:
  actions: write   # needed so the job can start the next run itself
  contents: read


jobs:
  desktop:
    # More CPU = the biggest lever for smoothness. If you have a larger runner, set the
    # repository variable RUNNER_LABEL (Settings > Secrets and variables > Actions > Variables).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350   # hard limit of GitHub Actions is 360 min

    # Timeline of one desktop (minutes counted from the start of the job).
    # The on-screen countdown (bottom right) uses exactly the same values.
    env:
      HANDOVER_MINUTES: 315   # the next desktop is started and prepares itself
      SESSION_MINUTES: 335    # this desktop ends, the next one takes over

    steps:
      # ------------------------------------------------------------------
      # Cron safety net: only start a new desktop if no other run is active.
      # ------------------------------------------------------------------
      - name: Guard (cron starts a desktop only if none is running)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          if gh api "repos/$REPO/actions/workflows/$WF_FILE/runs?per_page=50" > /tmp/runs.json 2> /tmp/runs.err; then
            ACTIVE=$(jq --argjson id "$RUN_ID" '[.workflow_runs[] | select(.id != $id) | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length' /tmp/runs.json)
          else
            echo "⚠️ API request failed ($(cat /tmp/runs.err)) - starting anyway to be safe."
            ACTIVE=0
          fi
          ACTIVE=${ACTIVE:-0}
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A desktop is already running ($ACTIVE active runs). This cron run stops itself."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" > /dev/null || true
            sleep 90
            exit 1   # only reached if the cancel did not work: stop here, never start a second desktop
          fi
          echo "No desktop active - restarting the chain."

      # ------------------------------------------------------------------
      # FAST START: WARP is prepared in the background while the desktop installs.
      # ------------------------------------------------------------------
      - name: Fast start (tune apt, free CPU, start WARP in background)
        env:
          WARP_ORGANIZATION: ${{ secrets.WARP_ORGANIZATION }}
          WARP_AUTH_CLIENT_ID: ${{ secrets.WARP_AUTH_CLIENT_ID }}
          WARP_AUTH_CLIENT_SECRET: ${{ secrets.WARP_AUTH_CLIENT_SECRET }}
        run: |
          date +%s > /tmp/start-ts

          if [ -z "$WARP_ORGANIZATION" ] || [ -z "$WARP_AUTH_CLIENT_ID" ] || [ -z "$WARP_AUTH_CLIENT_SECRET" ]; then
            echo "❌ ERROR: One or more WARP secrets (WARP_ORGANIZATION, WARP_AUTH_CLIENT_ID, WARP_AUTH_CLIENT_SECRET) are missing!"
            exit 1
          fi

          # make apt faster: no man-db rebuild, no fsync, no translations
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/99-fast-io > /dev/null
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99-fast > /dev/null

          # SMOOTHNESS: stop background services that randomly eat CPU during the session
          for s in unattended-upgrades apt-daily.timer apt-daily-upgrade.timer man-db.timer \
                   packagekit fwupd snapd.service snapd.socket; do
            sudo systemctl stop "$s" > /dev/null 2>&1 || true
          done

          # Free disk space ONLY if it is really tight (the big delete costs disk I/O while apt is installing)
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free space on /: ${FREE_GB:-?} GB"
          if [ "${FREE_GB:-0}" -lt 10 ]; then
            echo "Low disk space - cleaning up in the background."
            sudo nohup rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android > /dev/null 2>&1 &
          fi

          # WARP setup script (runs completely in the background, parallel to the desktop installation)
          cat > ~/warp-setup.sh << 'WARPSCRIPT'
          #!/bin/bash
          exec > /tmp/warp-setup.log 2>&1
          rm -f /tmp/warp.done /tmp/warp.failed /tmp/warp.connected
          fail() { echo "❌ $*"; touch /tmp/warp.failed; exit 1; }

          # 1. Ubuntu container for the official WARP client
          docker run -d \
            --name warp-proxy \
            --privileged \
            --cap-add NET_ADMIN \
            -p 127.0.0.1:1080:1080 \
            ubuntu:22.04 sleep infinity || fail "docker run failed"

          # 2. Install the official cloudflare-warp package
          docker exec warp-proxy bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y curl gnupg lsb-release ca-certificates dbus socat
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main' > /etc/apt/sources.list.d/cloudflare-client.list
            apt-get update
            apt-get install -y cloudflare-warp
          " || fail "WARP install failed"

          # 3. Zero Trust login with service token via mdm.xml (proxy mode on port 4000)
          umask 077
          cat > /tmp/mdm.xml << EOF
          <dict>
            <key>organization</key>
            <string>${WARP_ORGANIZATION}</string>
            <key>auth_client_id</key>
            <string>${WARP_AUTH_CLIENT_ID}</string>
            <key>auth_client_secret</key>
            <string>${WARP_AUTH_CLIENT_SECRET}</string>
            <key>service_mode</key>
            <string>proxy</string>
            <key>proxy_port</key>
            <integer>4000</integer>
            <key>auto_connect</key>
            <integer>1</integer>
            <key>onboarding</key>
            <false/>
          </dict>
          EOF
          docker exec warp-proxy mkdir -p /var/lib/cloudflare-warp
          docker cp /tmp/mdm.xml warp-proxy:/var/lib/cloudflare-warp/mdm.xml
          rm -f /tmp/mdm.xml

          # 4. Start system D-Bus and the WARP service
          docker exec warp-proxy bash -c "mkdir -p /run/dbus && rm -f /run/dbus/pid && dbus-daemon --config-file=/usr/share/dbus-1/system.conf --fork"
          docker exec -d warp-proxy bash -c "warp-svc > /var/log/warp-svc.log 2>&1"

          # 5. Wait for the connection (max. ~90 seconds, checked every 2 s, explicit connect after ~10 s)
          for i in $(seq 1 45); do
            sleep 2
            if docker exec warp-proxy warp-cli --accept-tos status 2>/dev/null | grep -q "Connected"; then
              touch /tmp/warp.connected; break
            fi
            [ "$i" = "5" ] && docker exec warp-proxy warp-cli --accept-tos connect || true
          done

          # 6. Forward the internal WARP proxy (4000) to container port 1080
          docker exec -d warp-proxy socat TCP-LISTEN:1080,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:4000
          sleep 1

          docker exec warp-proxy warp-cli --accept-tos status || true
          if [ -f /tmp/warp.connected ]; then
            echo "✅ WARP connected. Test through the proxy:"
            curl -s --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp=|gateway=" || echo "⚠️ Test failed (certificate may not match)"
          else
            echo "⚠️ WARP is NOT connected. Chrome will not load pages (no data leak)."
            # PRIVACY: the service log can contain account and device details.
            # It stays on the remote computer and is NOT printed into the (public) GitHub log.
            docker exec warp-proxy tail -n 50 /var/log/warp-svc.log > /tmp/warp-svc-tail.log 2>&1 || true
            echo "Details only on the remote computer: /tmp/warp-svc-tail.log"
          fi
          touch /tmp/warp.done
          WARPSCRIPT
          chmod +x ~/warp-setup.sh

          nohup setsid bash ~/warp-setup.sh > /dev/null 2>&1 &
          echo "WARP setup runs in the background (log: /tmp/warp-setup.log)"

      - name: Install Desktop, Chrome, VS Code, Terminal & Tools (one single apt run)
        run: |
          export DEBIAN_FRONTEND=noninteractive

          # VS Code: do not let the package add its own apt repository (keeps apt fast and clean)
          echo "code code/add-microsoft-repo boolean false" | sudo debconf-set-selections

          # Download .deb files in parallel while apt loads the package lists.
          # Chrome is skipped if the runner image already has it (saves download + install time).
          mkdir -p /tmp/dl && chmod 755 /tmp/dl
          DEBS=()
          PIDS=()
          curl -fsSL -o /tmp/dl/cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb &
          PIDS+=($!)
          DEBS+=(/tmp/dl/cloudflared-linux-amd64.deb)
          # Visual Studio Code (official Microsoft .deb, always the latest stable version)
          curl -fsSL -o /tmp/dl/code_amd64.deb "https://update.code.visualstudio.com/latest/linux-deb-x64/stable" &
          PIDS+=($!)
          DEBS+=(/tmp/dl/code_amd64.deb)
          if [ -x /usr/bin/google-chrome-stable ]; then
            echo "Chrome is already installed on the runner - skipping download."
          else
            curl -fsSL -o /tmp/dl/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
            PIDS+=($!)
            DEBS+=(/tmp/dl/google-chrome-stable_current_amd64.deb)
          fi
          # Go (latest stable version from go.dev), downloaded in parallel. A failure here does not stop the desktop.
          (
            GO_VER=$(curl -fsSL "https://go.dev/dl/?mode=json" | jq -r '[.[] | select(.stable)][0].version' 2>/dev/null)
            [ -n "$GO_VER" ] && [ "$GO_VER" != "null" ] && curl -fsSL -o /tmp/dl/go.tar.gz "https://go.dev/dl/${GO_VER}.linux-amd64.tar.gz"
          ) &
          GO_PID=$!
          sudo apt-get update
          for p in "${PIDS[@]}"; do
            wait "$p" || { echo "❌ Download failed"; exit 1; }
          done
          chmod 644 /tmp/dl/*.deb

          # Everything in ONE apt call. Tools already on the runner are skipped by apt.
          # tzdata (world clock time zones), xbindkeys (Windows-like app shortcuts),
          # NEW: privoxy + netcat-openbsd (system-wide proxy through WARP for all apps)
          sudo apt-get install -y "${DEBS[@]}" \
            gnome-session-flashback \
            gnome-flashback \
            gnome-panel \
            gnome-settings-daemon \
            metacity \
            gnome-control-center \
            gnome-online-accounts \
            gnome-keyring \
            gvfs \
            gvfs-backends \
            nautilus \
            adwaita-icon-theme \
            tigervnc-standalone-server \
            tigervnc-common \
            xfonts-base \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11vnc \
            novnc \
            websockify \
            zenity \
            curl \
            wget \
            dbus-x11 \
            libnss3-tools \
            openssl \
            xfce4-terminal \
            xfconf \
            fonts-dejavu-core \
            fonts-noto-core \
            bash-completion \
            mc \
            fzf \
            zoxide \
            tree \
            htop \
            ncdu \
            python3 \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gtk-3.0 \
            zip \
            unzip \
            p7zip-full \
            libarchive-tools \
            rsync \
            nano \
            git \
            jq \
            ripgrep \
            fd-find \
            bat \
            tmux \
            lsof \
            psmisc \
            xclip \
            privoxy \
            netcat-openbsd \
            xbindkeys \
            tzdata \
            libsecret-1-0 \
            libsecret-tools \
            desktop-file-utils \
            xdg-utils
          # Install Go into /usr/local/go (official layout) and make it available everywhere
          if wait "$GO_PID" && [ -s /tmp/dl/go.tar.gz ]; then
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/dl/go.tar.gz
            for b in go gofmt; do sudo ln -sf "/usr/local/go/bin/$b" "/usr/local/bin/$b"; done
            echo "✅ $(/usr/local/go/bin/go version)"
          else
            echo "⚠️ Go could not be downloaded"
          fi
          rm -rf /tmp/dl

          # Ubuntu names some tools differently: make "fd" and "bat" work as usual
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat 2>/dev/null || true

          # Make xfce4-terminal the default terminal
          sudo update-alternatives --set x-terminal-emulator /usr/bin/xfce4-terminal.wrapper || true

          # ------------------------------------------------------------------
          # SHARPNESS: noVNC start page
          #  - quality=9   -> highest JPEG quality, no colour subsampling (no blurry/colour-fringed text)
          #  - compression=2 -> less CPU on the server = smoother
          #  - reconnect   -> reconnects by itself after short network hiccups and after the handover
          #  - The page checks the browser pixel ratio. With Windows scaling 125 %/150 % or a Retina
          #    display the browser stretches the picture = blurry. The page asks the user ONCE to zoom
          #    out (Ctrl + Minus) until the picture is 1:1. The browser remembers the zoom for this site.
          # ------------------------------------------------------------------
          sudo rm -f /usr/share/novnc/index.html
          sudo tee /usr/share/novnc/index.html > /dev/null << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Remote Desktop</title>
          <style>
            html, body { margin: 0; height: 100%; background: #1e1e1e; color: #e6e6e6; font-family: system-ui, sans-serif; }
            #box { max-width: 520px; margin: 12vh auto; padding: 28px; background: #2a2a2a; border-radius: 12px; line-height: 1.5; }
            h1 { font-size: 22px; margin: 0 0 12px; }
            kbd { background: #444; border-radius: 4px; padding: 2px 6px; }
            .big { font-size: 28px; font-weight: 600; color: #8ab4f8; }
            a { color: #8ab4f8; }
            #box[hidden] { display: none; }
          </style>
          </head>
          <body>
          <div id="box" hidden>
            <h1>One-time setup for a sharp picture</h1>
            <p>Your screen uses scaling, so the browser would stretch the remote desktop and it would look blurry.</p>
            <p>Press <kbd>Ctrl</kbd> + <kbd>-</kbd> (Mac: <kbd>Cmd</kbd> + <kbd>-</kbd>) until the zoom is at</p>
            <p class="big" id="target"></p>
            <p>The desktop then opens automatically. Your browser remembers this setting for this site.</p>
            <p>Text too small afterwards? On the remote desktop open <b>Display scale</b> and choose a larger value.</p>
            <p><a href="#" id="skip">Continue without sharp mode</a></p>
          </div>
          <script>
            (function () {
              var url = 'vnc.html?autoconnect=true&resize=remote&quality=9&compression=2' +
                        '&reconnect=true&reconnect_delay=1500&show_dot=true&logging=warn';
              var box = document.getElementById('box');
              var target = document.getElementById('target');
              var zoomPresets = [25, 33, 50, 67, 75, 80, 90, 100];
              var go = function () { window.location.replace(url); };
              var sharp = function () { return Math.abs(window.devicePixelRatio - 1) < 0.03; };
              var check = function () {
                if (sharp()) { go(); return; }
                // devicePixelRatio = OS scaling x browser zoom. Suggest the browser zoom that brings it to 1.
                var osScale = window.devicePixelRatio;
                var best = zoomPresets.reduce(function (a, b) {
                  return Math.abs(100 / osScale - b) < Math.abs(100 / osScale - a) ? b : a;
                });
                target.textContent = 'about ' + best + ' % (smaller than now)';
                box.hidden = false;
              };
              document.getElementById('skip').addEventListener('click', function (e) { e.preventDefault(); go(); });
              window.addEventListener('resize', check);
              check();
            })();
          </script>
          </body>
          </html>
          EOF

          # ------------------------------------------------------------------
          # Windows shortcuts go to the REMOTE desktop (Keyboard Lock).
          #  - F11 (or the full screen button in the noVNC side bar) opens a special full screen
          #    in which Chrome / Edge pass Alt+Tab, Win+Tab, the Windows key, Alt+F4, Esc ...
          #    to the remote desktop instead of to Windows.
          #  - Leave full screen: F11 again, or press and HOLD Esc.
          #  - Only Chromium browsers (Chrome, Edge) support this. Ctrl+Alt+Del and Win+L always stay on Windows.
          #  - The first time, the browser asks for permission to control the keyboard: choose "Allow".
          #  The script is written inline into vnc.html (no separate .js file = no Cloudflare caching problems).
          # ------------------------------------------------------------------
          cat > /tmp/novnc-keyboard-lock.js << 'EOF'
          (function () {
            if (window.__rdKeyboardLock) { return; }
            window.__rdKeyboardLock = true;
            var supported = !!(navigator.keyboard && navigator.keyboard.lock);
            var locked = false;
            var busy = false;

            var toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:2147483647;' +
              'background:rgba(32,33,36,.94);color:#e8eaed;font:14px/1.4 system-ui,sans-serif;padding:10px 16px;' +
              'border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none;display:none;' +
              'max-width:90vw;text-align:center';
            document.body.appendChild(toast);
            var timer = null;
            function show(msg, ms) {
              toast.textContent = msg;
              toast.style.display = 'block';
              clearTimeout(timer);
              timer = setTimeout(function () { toast.style.display = 'none'; }, ms || 5000);
            }

            function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

            // lock() is called directly in the key press / click, so the browser accepts it
            // (it needs a user action). The lock becomes active as soon as the page is in full screen.
            function lockKeys() {
              if (!supported || locked || busy) { return; }
              busy = true;
              navigator.keyboard.lock().then(function () {
                locked = true;
                busy = false;
                if (isFs()) { announce(); }
              }).catch(function () {
                busy = false;
                show('Keyboard control was not allowed. Click the icon left of the address bar, ' +
                     'allow keyboard control for this site and press F11 again.', 9000);
              });
            }

            function announce() {
              show('Windows shortcuts (Alt+Tab, Win+Tab, Win key, Alt+F4 ...) now work on the remote desktop. ' +
                   'Leave full screen: F11 or hold Esc.', 6000);
            }

            function toggle() {
              if (isFs()) {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                return;
              }
              lockKeys();
              var el = document.documentElement;
              var p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
              if (p && p.catch) {
                p.catch(function () { show('Full screen was blocked by the browser. Click into the page and press F11 again.', 6000); });
              }
            }

            document.addEventListener('fullscreenchange', function () {
              if (isFs()) {
                if (!supported) {
                  show('This browser cannot pass Windows shortcuts on. Please use Google Chrome or Microsoft Edge.', 7000);
                } else if (locked) {
                  announce();
                } else {
                  lockKeys();
                }
              } else if (supported && locked) {
                navigator.keyboard.unlock();
                locked = false;
              }
            });

            // F11 = full screen WITH keyboard lock (the normal browser F11 full screen cannot lock keys)
            window.addEventListener('keydown', function (e) {
              if (e.code === 'F11' || e.key === 'F11') {
                e.preventDefault();
                e.stopImmediatePropagation();
                if (!e.repeat) { toggle(); }
              }
            }, true);
            window.addEventListener('keyup', function (e) {
              if (e.code === 'F11' || e.key === 'F11') {
                e.preventDefault();
                e.stopImmediatePropagation();
              }
            }, true);

            // The full screen button in the noVNC side bar also locks the keyboard
            document.addEventListener('click', function (e) {
              if (e.target && e.target.closest && e.target.closest('#noVNC_fullscreen_button') && !isFs()) {
                lockKeys();
              }
            }, true);

            setTimeout(function () {
              if (!isFs()) {
                show(supported
                  ? 'Tip: press F11 for full screen - then Alt+Tab, Win+Tab and the Windows key work on the remote desktop.'
                  : 'Tip: open this page in Chrome or Edge to use Windows shortcuts on the remote desktop.', 6000);
              }
            }, 1500);
          })();
          EOF
          sudo python3 - /usr/share/novnc/vnc.html /tmp/novnc-keyboard-lock.js << 'PY'
          import sys
          page, js_file = sys.argv[1], sys.argv[2]
          with open(page, encoding="utf-8") as f:
              html = f.read()
          with open(js_file, encoding="utf-8") as f:
              js = f.read()
          marker = "<!-- remote-desktop-keyboard-lock -->"
          if marker in html:
              print("Keyboard lock already in vnc.html")
              sys.exit(0)
          block = marker + "\n<script>\n" + js + "\n</script>\n"
          if "</body>" in html:
              html = html.replace("</body>", block + "</body>", 1)
          else:
              html += "\n" + block
          with open(page, "w", encoding="utf-8") as f:
              f.write(html)
          print("✅ Keyboard lock (Windows shortcuts in full screen) added to vnc.html")
          PY
          rm -f /tmp/novnc-keyboard-lock.js

          # ------------------------------------------------------------------
          # NEW: ONE OR TWO SCREENS - every run supports both, you switch any time.
          #   One screen:  https://YOUR-SUBDOMAIN/            (exactly as before)
          #   Two screens: https://YOUR-SUBDOMAIN/dual.html   (button "Start two screens")
          # How it works (one desktop, one login):
          #  - Window 1 (left) and window 2 (right) talk to each other ONLY inside your own browser
          #    (BroadcastChannel, same site). Nothing is sent anywhere else.
          #  - Window 1 asks the VNC server for a desktop with TWO monitors, each exactly as big as
          #    its browser window (standard VNC message "SetDesktopSize" with a screen layout).
          #    Maximize, Win+Left/Right and the panel then work per monitor.
          #  - Close window 2 -> after about 4 seconds window 1 switches back to ONE monitor
          #    and follows its window size again (like the normal start page).
          #  - Open the normal start page again -> also back to one monitor automatically.
          # No new port, no new server, no external files, nothing written to the GitHub log.
          # ------------------------------------------------------------------
          cat > /tmp/novnc-dual.html << 'EOF'
          <!-- remote-desktop-dual-screen -->
          <script type="module">
          import UI from './app/ui.js';
          (function () {
            var p = new URLSearchParams(window.location.search);
            var me = p.get('dual_screen');
            if (me !== '1' && me !== '2') { return; }   // normal one-screen use: do nothing
            if (!('BroadcastChannel' in window)) { return; }
            var ch = new BroadcastChannel('remote-desktop-dual-screen');
            var TIMEOUT = 4000;
            var partner = { seen: 0, w: 0, h: 0, leftW: 0 };
            var lastSent = 0, lastKey = '', mode = '';
            document.title = 'Remote Desktop - Screen ' + me + (me === '1' ? ' (left)' : ' (right)');

            var note = document.createElement('div');
            note.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483646;' +
              'background:rgba(32,33,36,.94);color:#e8eaed;font:14px/1.4 system-ui,sans-serif;padding:8px 14px;' +
              'border-radius:8px;pointer-events:none;display:none;max-width:90vw;text-align:center';
            document.body.appendChild(note);
            function say(t) { note.textContent = t; note.style.display = t ? 'block' : 'none'; }

            function clamp(v, lo, hi) { v = Math.round(Number(v) || 0); return Math.max(lo, Math.min(hi, v)); }
            function ownSize() {
              var c = document.getElementById('noVNC_container') || document.body;
              return { w: clamp(c.clientWidth, 320, 8192), h: clamp(c.clientHeight, 240, 8192) };
            }
            function ready(rfb) {
              return rfb && rfb._sock && rfb._display && rfb._rfbConnectionState === 'connected';
            }

            // RFB "SetDesktopSize" (message 251) with a full screen layout
            function sendLayout(rfb, screens, W, H) {
              var b = [];
              function u8(v) { b.push(v & 255); }
              function u16(v) { b.push((v >> 8) & 255, v & 255); }
              function u32(v) { b.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255); }
              u8(251); u8(0); u16(W); u16(H); u8(screens.length); u8(0);
              screens.forEach(function (s) { u32(s.id); u16(s.x); u16(s.y); u16(s.w); u16(s.h); u32(0); });
              var sock = rfb._sock;
              if (typeof sock.sQpush8 === 'function') {
                b.forEach(function (v) { sock.sQpush8(v); });
                sock.flush();
              } else if (typeof sock.send === 'function') {
                sock.send(b);
              }
            }

            ch.onmessage = function (e) {
              var m = e.data || {};
              if (me === '1' && m.t === 's2') {
                partner.seen = Date.now(); partner.w = clamp(m.w, 320, 8192); partner.h = clamp(m.h, 240, 8192);
              } else if (me === '2' && m.t === 's1') {
                partner.seen = Date.now(); partner.leftW = clamp(m.leftW, 0, 8192);
              } else if (me === '2' && m.t === 'bye1') {
                partner.seen = 0;
              } else if (me === '1' && m.t === 'bye2') {
                partner.seen = 0;
              }
            };
            window.addEventListener('pagehide', function () { ch.postMessage({ t: me === '1' ? 'bye1' : 'bye2' }); });

            function tick() {
              var rfb = UI.rfb;
              var own = ownSize();
              var alive = Date.now() - partner.seen < TIMEOUT;

              if (me === '2') {
                ch.postMessage({ t: 's2', w: own.w, h: own.h });
                if (!ready(rfb)) { return; }
                rfb.scaleViewport = false; rfb.resizeSession = false; rfb.clipViewport = true;
                if (!alive) { say('Waiting for screen 1 (left). Keep the window "Screen 1" open.'); return; }
                say('');
                var d = rfb._display, loc = d._viewportLoc, x = partner.leftW;
                if (loc && (loc.x !== x || loc.y !== 0)) { d.viewportChangePos(x - loc.x, -loc.y); }
                return;
              }

              // ---- screen 1 (left) ----
              if (!ready(rfb)) { return; }
              ch.postMessage({ t: 's1', leftW: alive ? own.w : 0 });
              rfb.scaleViewport = false; rfb.clipViewport = true;
              var d1 = rfb._display, l1 = d1._viewportLoc;
              if (l1 && (l1.x !== 0 || l1.y !== 0)) { d1.viewportChangePos(-l1.x, -l1.y); }

