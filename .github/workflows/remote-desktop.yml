      # ------------------------------------------------------------------
      - name: Install Antigravity, Antigravity CLI, Copilot CLI & Go tools (background)
        run: |
          # Electron apps (VS Code, Antigravity) need user namespaces for their sandbox.
          # Ubuntu 24.04 blocks them by default via AppArmor -> apps would not open.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true

          cat > ~/devtools-setup.sh << 'DEVSCRIPT'
          #!/bin/bash
          exec > /tmp/devtools-setup.log 2>&1
          rm -f /tmp/devtools.done
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          # ---------- 1. GitHub Copilot CLI (official install script, installs to /usr/local/bin) ----------
          echo "== Copilot CLI =="
          for TRY in 1 2 3; do
            curl -fsSL https://gh.io/copilot-install | sudo bash && break
            echo "Attempt $TRY failed, retrying ..."; sleep 5
          done
          command -v copilot && echo "✅ Copilot CLI: $(copilot --version 2>/dev/null | head -1)" || echo "⚠️ Copilot CLI not installed"

          # ---------- 2. Antigravity CLI "agy" (official install script, installs to ~/.local/bin) ----------
          echo "== Antigravity CLI =="
          for TRY in 1 2 3; do
            curl -fsSL https://antigravity.google/cli/install.sh | bash && break
            echo "Attempt $TRY failed, retrying ..."; sleep 5
          done
          AGY=$(command -v agy || ls "$HOME"/.local/bin/agy 2>/dev/null || true)
          if [ -n "$AGY" ]; then
            sudo ln -sf "$AGY" /usr/local/bin/agy
            echo "✅ Antigravity CLI: $(agy --version 2>/dev/null | head -1)"
          else
            echo "⚠️ Antigravity CLI not installed"
          fi

          # ---------- 3. Antigravity IDE ----------
          # Preferred: current IDE tarball from Google's download page.
          # Fallback: Google's official Antigravity apt repository (older 1.x IDE, but always works).
          echo "== Antigravity IDE =="
          URL_RE='https://[A-Za-z0-9._~:/?#@!$&+,;=%-]+\.tar\.gz'
          PAGE=$(curl -fsSL --max-time 30 https://antigravity.google/download || true)
          URLS=$(printf '%s' "$PAGE" | grep -oE "$URL_RE" || true)
          for js in $(printf '%s' "$PAGE" | grep -oE '(src|href)="[^"]+\.js"' | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            case "$js" in
              http*) u="$js" ;;
              /*)    u="https://antigravity.google$js" ;;
              *)     u="https://antigravity.google/$js" ;;
            esac
            URLS="$URLS
          $(curl -fsSL --max-time 20 "$u" 2>/dev/null | grep -oE "$URL_RE" || true)"
          done
          LINUX_URLS=$(printf '%s\n' "$URLS" | grep -i linux | grep -Ei 'x64|amd64|x86_64' | sort -u || true)
          echo "Linux tarballs found:"; printf '%s\n' "$LINUX_URLS"
          IDE_URL=$(printf '%s\n' "$LINUX_URLS" | grep -i 'ide' | head -1 || true)

          IDE_OK=0
          if [ -n "$IDE_URL" ]; then
            echo "Downloading $IDE_URL"
            rm -rf /tmp/ag-ide /tmp/ag-ide.tar.gz && mkdir -p /tmp/ag-ide
            if curl -fL --retry 3 -o /tmp/ag-ide.tar.gz "$IDE_URL" && tar -xzf /tmp/ag-ide.tar.gz -C /tmp/ag-ide; then
              # Use the single top folder of the archive if there is one
              TOP=/tmp/ag-ide
              if [ "$(find /tmp/ag-ide -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/ag-ide -mindepth 1 -maxdepth 1)" ]; then
                TOP=$(find /tmp/ag-ide -mindepth 1 -maxdepth 1)
              fi
              sudo rm -rf /opt/antigravity-ide
              sudo mv "$TOP" /opt/antigravity-ide
              BIN=$(find /opt/antigravity-ide -maxdepth 1 -type f -perm -u+x \( -name 'antigravity-ide' -o -name 'antigravity' -o -name 'Antigravity*' \) | head -1)
              [ -z "$BIN" ] && BIN=$(find /opt/antigravity-ide -maxdepth 2 -type f -perm -u+x \( -name 'antigravity-ide' -o -name 'antigravity' \) | head -1)
              if [ -n "$BIN" ]; then
                # Chromium sandbox helper must belong to root with the setuid bit
                SB=$(find /opt/antigravity-ide -maxdepth 2 -name chrome-sandbox | head -1)
                [ -n "$SB" ] && sudo chown root:root "$SB" && sudo chmod 4755 "$SB"
                sudo ln -sf "$BIN" /usr/local/bin/antigravity
                ICON=$(find /opt/antigravity-ide -type f \( -iname '*antigravity*.png' -o -iname 'code.png' \) | head -1)
                [ -n "$ICON" ] && sudo cp "$ICON" /usr/local/share/antigravity.png
                IDE_OK=1
                echo "✅ Antigravity IDE installed from tarball: $BIN"
              fi
            fi
            rm -rf /tmp/ag-ide /tmp/ag-ide.tar.gz
          fi

          if [ "$IDE_OK" != "1" ]; then
            echo "No current IDE tarball found - using Google's Antigravity apt repository."
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --yes --dearmor -o /etc/apt/keyrings/antigravity-repo-key.gpg
            echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list > /dev/null
            # wait if apt is still busy
            for i in $(seq 1 60); do sudo fuser /var/lib/dpkg/lock-frontend > /dev/null 2>&1 || break; sleep 2; done
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Dir::Etc::sourcelist=sources.list.d/antigravity.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y antigravity; then
              IDE_OK=1
              ICON=$(find /usr/share -type f -iname '*antigravity*.png' 2>/dev/null | head -1)
              [ -n "$ICON" ] && sudo cp "$ICON" /usr/local/share/antigravity.png
              echo "✅ Antigravity IDE installed from apt"
            fi
          fi
          [ "$IDE_OK" = "1" ] || echo "⚠️ Antigravity IDE could not be installed"

          # ---------- 4. Go tools (language server, debugger) + VS Code Go extension ----------
          echo "== Go tools =="
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          if command -v go > /dev/null; then
            go install golang.org/x/tools/gopls@latest && echo "✅ gopls" || echo "⚠️ gopls not installed"
            go install github.com/go-delve/delve/cmd/dlv@latest && echo "✅ dlv (debugger)" || echo "⚠️ dlv not installed"
          else
            echo "⚠️ Go is missing - Go tools skipped"
          fi
          if command -v code > /dev/null; then
            code --install-extension golang.go --force > /dev/null 2>&1 && echo "✅ VS Code Go extension" || echo "⚠️ VS Code Go extension not installed"
          fi

          touch /tmp/devtools.done
          DEVSCRIPT
          chmod +x ~/devtools-setup.sh

          nohup setsid bash ~/devtools-setup.sh > /dev/null 2>&1 &
          echo "Antigravity / Antigravity CLI / Copilot CLI / Go tools install in the background (log: /tmp/devtools-setup.log)"

      - name: Install Google Drive Shell (gdsh)
        run: |
          # gdsh = terminal for Google Drive with REAL file names.
          # Uses the Google account from GNOME Online Accounts. No extra OAuth app, no rclone, no API keys.
          sudo tee /usr/local/bin/gdsh > /dev/null << 'EOF'
          #!/usr/bin/env python3
          """gdsh - Google Drive shell with real file names (account from GNOME Online Accounts)."""
          import cmd, glob, os, re, readline, subprocess, time
          from concurrent.futures import ThreadPoolExecutor
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio, GLib

          ATTRS = "standard::name,standard::display-name,standard::type,standard::size"
          BLUE, GREEN, OFF = "\033[1;34m", "\033[1;32m", "\033[0m"
          DIR = Gio.FileType.DIRECTORY


          def human(n):
              for unit in ("B", "K", "M", "G", "T"):
                  if n < 1024:
                      return f"{n:.0f}{unit}" if unit == "B" else f"{n:.1f}{unit}"
                  n /= 1024
              return f"{n:.1f}P"


          def safe(name):
              return name.replace("/", "_")


          def find_drive_uris():
              try:
                  out = subprocess.run(["gio", "mount", "-li"], capture_output=True, text=True, timeout=30).stdout
              except Exception:
                  return []
              uris = []
              # Stop at whitespace, quotes and angle brackets (gio prints e.g. 'google-drive://user@host/')
              for m in re.findall(r"google-drive://[^\s'\"<>]+", out):
                  if not m.endswith("/"):
                      m += "/"
                  if m not in uris:
                      uris.append(m)
              return uris


          def ensure_mounted(uri):
              root = Gio.File.new_for_uri(uri)
              try:
                  root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
                  return root
              except GLib.Error:
                  pass
              subprocess.run(["gio", "mount", uri], capture_output=True, timeout=90)
              root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
              return root


          class DriveShell(cmd.Cmd):
              intro = "Google Drive shell - type 'help' for commands, 'exit' to quit."

              def __init__(self, root):
                  super().__init__()
                  readline.set_completer_delims(" \t\n")
                  self.stack = [(root, "")]
                  self.cache = {}
                  os.makedirs(os.path.expanduser("~/Downloads"), exist_ok=True)
                  os.chdir(os.path.expanduser("~/Downloads"))
                  self._prompt()

              # ---------- helpers ----------
              def _prompt(self):
                  path = "/" + "/".join(n for _, n in self.stack[1:])
                  self.prompt = f"\001{GREEN}\002drive:{path}\001{OFF}\002> "

              def _arg(self, arg):
                  arg = arg.strip()
                  if len(arg) >= 2 and arg[0] == arg[-1] and arg[0] in "\"'":
                      arg = arg[1:-1]
                  return arg

              def _err(self, e):
                  print(f"Error: {e.message if isinstance(e, GLib.Error) else e}")

              def _list(self, folder, fresh=False):
                  key = folder.get_uri()
                  hit = self.cache.get(key)
                  if hit and not fresh and time.time() - hit[0] < 30:
                      return hit[1]
                  items = []
                  en = folder.enumerate_children(ATTRS, Gio.FileQueryInfoFlags.NONE, None)
                  while True:
                      info = en.next_file(None)
                      if info is None:
                          break
                      items.append(info)
                  en.close(None)
                  items.sort(key=lambda i: (i.get_file_type() != DIR, i.get_display_name().lower()))
                  self.cache[key] = (time.time(), items)
                  return items

              def _find(self, folder, name):
                  items = self._list(folder)
                  for test in (lambda i: i.get_display_name() == name,
                               lambda i: i.get_display_name().lower() == name.lower(),
                               lambda i: i.get_name() == name):
                      for info in items:
                          if test(info):
                              return info
                  return None

              def _walk(self, path):
                  stack = self.stack[:1] if path.startswith("/") else list(self.stack)
                  info = None
                  for part in [p for p in path.split("/") if p and p != "."]:
                      if part == "..":
                          if len(stack) > 1:
                              stack.pop()
                          info = None
                          continue
                      info = self._find(stack[-1][0], part)
                      if info is None:
                          raise LookupError(f"Not found: {part}")
                      stack.append((stack[-1][0].get_child(info.get_name()), info.get_display_name()))
                  return stack, info

              def _target(self, arg):
                  stack, info = self._walk(self._arg(arg))
                  if info is None:
                      raise LookupError("Please give a file or folder name")
                  return stack[-1][0], info

              # ---------- Drive commands ----------
              def do_ls(self, arg):
                  """ls [folder]        list files with real names (also: dir, ll)"""
                  try:
                      stack, info = self._walk(self._arg(arg))
                      if info and info.get_file_type() != DIR:
                          return print(info.get_display_name())
                      items = self._list(stack[-1][0], fresh=True)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if not items:
                      print("(empty)")
                  for i in items:
                      if i.get_file_type() == DIR:
                          print(f"{'<DIR>':>9}  {BLUE}{i.get_display_name()}/{OFF}")
                      else:
                          print(f"{human(i.get_size()):>9}  {i.get_display_name()}")
              do_dir = do_ll = do_ls

              def do_cd(self, arg):
                  """cd <folder>        change folder (cd .. = up, cd / = top, Tab completes)"""
                  try:
                      stack, info = self._walk(self._arg(arg) or "/")
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if info and info.get_file_type() != DIR:
                      return print(f"Not a folder: {info.get_display_name()}")
                  self.stack = stack
                  self._prompt()

              def do_pwd(self, arg):
                  """pwd                show current Drive folder"""
                  print("/" + "/".join(n for _, n in self.stack[1:]))

              def do_get(self, arg):
                  """get <file|folder>  download into the current local folder (see lpwd, lcd)"""
                  try:
                      src, info = self._target(arg)
                      dest = os.path.join(os.getcwd(), safe(info.get_display_name()))
                      self._download(src, info, dest)
                      print(f"Done -> {dest}")
                  except (GLib.Error, LookupError, OSError) as e:
                      self._err(e)

              def _download(self, src, info, dest):
                  if info.get_file_type() == DIR:
                      os.makedirs(dest, exist_ok=True)
                      for child in self._list(src):
                          self._download(src.get_child(child.get_name()), child,
                                         os.path.join(dest, safe(child.get_display_name())))
                      return
                  try:
                      src.copy(Gio.File.new_for_path(dest), Gio.FileCopyFlags.OVERWRITE, None, None)
                      print(f"  {info.get_display_name()}")
                  except GLib.Error as e:
                      print(f"  skipped {info.get_display_name()} ({e.message})")

              def do_put(self, arg):
                  """put <local path>   upload a local file or folder into the current Drive folder"""
                  local = os.path.expanduser(self._arg(arg))
                  if not local or not os.path.exists(local):
                      return print(f"Not found locally: {local}")
                  try:
                      self._upload(os.path.abspath(local), self.stack[-1][0])
                      print("Done.")
                  except (GLib.Error, LookupError) as e:
                      self._err(e)
                  self.cache.clear()

              def _upload(self, local, folder):
                  name = os.path.basename(os.path.normpath(local))
                  existing = self._find(folder, name)
                  if os.path.isdir(local):
                      if not (existing and existing.get_file_type() == DIR):
                          folder.get_child_for_display_name(name).make_directory(None)
                          self.cache.pop(folder.get_uri(), None)
                          existing = self._find(folder, name)
                          if existing is None:
                              raise LookupError(f"Could not create folder: {name}")
                      target = folder.get_child(existing.get_name())
                      for entry in sorted(os.listdir(local)):
                          self._upload(os.path.join(local, entry), target)
                      return
                  if existing:
                      dest, flags = folder.get_child(existing.get_name()), Gio.FileCopyFlags.OVERWRITE
                  else:
                      dest, flags = folder.get_child_for_display_name(name), Gio.FileCopyFlags.NONE
                  Gio.File.new_for_path(local).copy(dest, flags, None, None)
                  print(f"  {name}")

              def do_mkdir(self, arg):
                  """mkdir <name>       create a folder in the current Drive folder"""
                  name = self._arg(arg)
                  if not name:
                      return print("Please give a folder name")
                  try:
                      self.stack[-1][0].get_child_for_display_name(name).make_directory(None)
                      print(f"Created: {name}")
                  except GLib.Error as e:
                      self._err(e)
                  self.cache.clear()

              def do_rm(self, arg):
                  """rm [-rf] <file|folder>   delete a file or a whole folder (asks first, -f = no question)"""
                  rest, force = arg.strip(), False
                  while rest.startswith("-"):
                      flag, _, rest = rest.partition(" ")
                      rest = rest.strip()
                      if flag == "--":
                          break
                      if "f" in flag[1:]:
                          force = True
                  try:
                      f, info = self._target(rest)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  name, is_dir = info.get_display_name(), info.get_file_type() == DIR
                  if not force:
                      what = f"'{name}' and EVERYTHING inside it" if is_dir else f"'{name}'"
                      if input(f"Delete {what}? [y/N] ").strip().lower() != "y":
                          return print("Cancelled.")
                  try:
                      try:
                          f.trash(None)
                          print("Moved to Google Drive trash.")
                          return
                      except GLib.Error:
                          pass  # trash not possible (e.g. folder with content) -> delete directly
                      if not is_dir:
                          f.delete(None)
                          print("Deleted.")
                      else:
                          self._delete_tree(f)
                  except GLib.Error as e:
                      self._err(e)
                  finally:
                      self.cache.clear()

              def _delete_tree(self, root):
                  files, dirs = [], []

                  def collect(folder):
                      dirs.append(folder)
                      for child in self._list(folder, fresh=True):
                          c = folder.get_child(child.get_name())
                          if child.get_file_type() == DIR:
                              collect(c)
                          else:
                              files.append(c)

                  print("Counting files ...")
                  collect(root)
                  total = len(files)
                  print(f"Deleting {total} files in {len(dirs)} folders (Ctrl+C stops) ...")

                  def kill(item):
                      for attempt in range(3):
                          try:
                              item.delete(None)
                              return True
                          except GLib.Error as e:
                              if "not found" in (e.message or "").lower():
                                  return True
                              time.sleep(1 + attempt)
                      return False

                  failed = done = 0
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      for ok in pool.map(kill, files):
                          done += 1
                          failed += 0 if ok else 1
                          if done % 20 == 0 or done == total:
                              print(f"\r  {done}/{total} files", end="", flush=True)
                  print()
                  for d in reversed(dirs):  # children first, top folder last
                      if not kill(d):
                          failed += 1
                  if failed:
                      print(f"Done, but {failed} item(s) could not be deleted. Run the same command again.")
                  else:
                      print("Deleted.")

              def do_cat(self, arg):
                  """cat <file>         show a text file"""
                  try:
                      f, info = self._target(arg)
                      ok, data, _ = f.load_contents(None)
                      print(data[:200000].decode("utf-8", errors="replace"))
                  except (GLib.Error, LookupError) as e:
                      self._err(e)

              def do_refresh(self, arg):
                  """refresh            reload file lists from Google Drive"""
                  self.cache.clear()
                  print("Cache cleared.")

              # ---------- local commands ----------
              def do_lpwd(self, arg):
                  """lpwd               show the local folder (downloads go here)"""
                  print(os.getcwd())

              def do_lcd(self, arg):
                  """lcd <path>         change the local folder"""
                  try:
                      os.chdir(os.path.expanduser(self._arg(arg) or "~"))
                      print(os.getcwd())
                  except OSError as e:
                      self._err(e)

              def do_lls(self, arg):
                  """lls                list the local folder"""
                  subprocess.run(["ls", "-lh", "--color=auto", "--group-directories-first"])

              def do_shell(self, arg):
                  """!<command>         run a normal Linux command locally, e.g. !unzip file.zip"""
                  subprocess.run(arg, shell=True)

              def do_clear(self, arg):
                  """clear              clear the screen (also: cls)"""
                  os.system("clear")
              do_cls = do_clear

              def do_exit(self, arg):
                  """exit               leave gdsh"""
                  return True
              do_quit = do_exit

              def do_EOF(self, arg):
                  print()
                  return True

              def do_help(self, arg):
                  if arg:
                      return super().do_help(arg)
                  print("\nCommands:")
                  for name in ("ls", "cd", "pwd", "get", "put", "mkdir", "rm", "cat", "refresh",
                               "lpwd", "lcd", "lls", "shell", "clear", "exit"):
                      print("  " + getattr(self, "do_" + name).__doc__)
                  print("\nNames with spaces work without quotes. Tab completes names.\n")

              def emptyline(self):
                  pass

              # ---------- tab completion ----------
              def _complete_remote(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  base, sep, partial = arg.rpartition("/")
                  try:
                      stack = self._walk(base + sep)[0] if sep else self.stack
                      items = self._list(stack[-1][0])
                  except Exception:
                      return []
                  out = []
                  for i in items:
                      is_dir = i.get_file_type() == DIR
                      if dirs_only and not is_dir:
                          continue
                      name = i.get_display_name() + ("/" if is_dir else "")
                      if name.lower().startswith(partial.lower()):
                          out.append((base + sep + name)[len(arg) - len(text):])
                  return out

              def _complete_local(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  home = os.path.expanduser("~")
                  out = []
                  for p in glob.glob(os.path.expanduser(arg) + "*"):
                      if dirs_only and not os.path.isdir(p):
                          continue
                      p += "/" if os.path.isdir(p) else ""
                      if arg.startswith("~"):
                          p = "~" + p[len(home):]
                      out.append(p[len(arg) - len(text):])
                  return out

              def complete_cd(self, text, line, b, e):
                  return self._complete_remote(text, line, dirs_only=True)

              def complete_ls(self, text, line, b, e):
                  return self._complete_remote(text, line)
              complete_dir = complete_ll = complete_get = complete_rm = complete_cat = complete_ls

              def complete_put(self, text, line, b, e):
                  return self._complete_local(text, line)

              def complete_lcd(self, text, line, b, e):
                  return self._complete_local(text, line, dirs_only=True)


          def main():
              uris = find_drive_uris()
              if not uris:
                  print("No Google account found.")
                  print("Open 'Settings (Online Accounts)' on the desktop, add your Google account,")
                  print("make sure 'Files' is switched on, then run 'gdsh' again.")
                  return 1
              uri = uris[0]
              if len(uris) > 1:
                  for n, u in enumerate(uris, 1):
                      print(f"  {n}) {u}")
                  choice = input("Which account? [1] ").strip() or "1"
                  if choice.isdigit() and 1 <= int(choice) <= len(uris):
                      uri = uris[int(choice) - 1]
              try:
                  root = ensure_mounted(uri)
              except GLib.Error as e:
                  print(f"Could not open Google Drive ({uri}): {e.message}")
                  print("Tip: open the Google Drive once in 'Files (Google Drive)', then run gdsh again.")
                  return 1
              print(f"Connected: {uri}")
              shell = DriveShell(root)
              while True:
                  try:
                      shell.cmdloop()
                      return 0
                  except KeyboardInterrupt:
                      print("^C")
                      shell.intro = None


          if __name__ == "__main__":
              raise SystemExit(main())
          EOF
          sudo chmod +x /usr/local/bin/gdsh
          python3 -m py_compile /usr/local/bin/gdsh && echo "✅ gdsh installed"

      - name: Fix "Offline" in Online Accounts (disable NetworkManager)
        run: |
          # NetworkManager does not manage the runner's network card and wrongly reports "offline"
          sudo systemctl stop NetworkManager 2>/dev/null || true
          sudo systemctl mask NetworkManager 2>/dev/null || true
          sudo pkill -x NetworkManager 2>/dev/null || true
          # Check: internet must still work
          curl -s --max-time 10 -o /dev/null -w "Internet test: HTTP %{http_code}\n" https://www.google.com || echo "⚠️ No internet"

      - name: Install Cloudflare Zero Trust Root CA (from Secret)
        env:
          CF_CA_1: ${{ secrets.CLOUDFLARE_ROOT_CA_B64 }}
          CF_CA_2: ${{ secrets.CLOUDFLARE_CA_CERT }}
        run: |
          # Accepts both secret names
          if [ -n "$CF_CA_1" ]; then
            CF_CA="$CF_CA_1"; echo "Using secret CLOUDFLARE_ROOT_CA_B64"
          elif [ -n "$CF_CA_2" ]; then
            CF_CA="$CF_CA_2"; echo "Using secret CLOUDFLARE_CA_CERT"
          else
            echo "❌ ERROR: No certificate secret found!"
            echo "   Create a secret named CLOUDFLARE_ROOT_CA_B64 or CLOUDFLARE_CA_CERT under"
            echo "   Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          CERT="$RUNNER_TEMP/cf-zt-root.pem"
          RAW="$RUNNER_TEMP/cf-zt-raw"
          rm -f "$CERT" "$RAW"

          if printf '%s' "$CF_CA" | grep -q "BEGIN CERTIFICATE"; then
            # Secret contains the certificate as text (PEM)
            printf '%s\n' "$CF_CA" | tr -d '\r' > "$CERT"
          else
            # Secret contains the certificate Base64-encoded (PEM or DER file)
            printf '%s' "$CF_CA" | tr -d '\r\n ' | base64 -d > "$RAW" 2>/dev/null || true
            if openssl x509 -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -in "$RAW" -out "$CERT"
            elif openssl x509 -inform DER -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -inform DER -in "$RAW" -out "$CERT"
            fi
            rm -f "$RAW"
          fi

          # Check that the certificate is valid and not expired
          if ! openssl x509 -in "$CERT" -noout 2>/dev/null; then
            echo "❌ ERROR: The secret content is not a valid certificate!"
            exit 1
          fi
          # PRIVACY: only the expiry date is printed (subject and fingerprint can identify your Cloudflare account)
          echo "Certificate $(openssl x509 -in "$CERT" -noout -enddate)"
          openssl x509 -in "$CERT" -noout -checkend 0 > /dev/null || { echo "❌ Certificate has expired"; exit 1; }

          # 1. Trust system-wide (curl, apt, git etc.)
          sudo cp "$CERT" /usr/local/share/ca-certificates/cloudflare-zt-root.crt
          sudo update-ca-certificates

          # 2. Trust in Chrome (NSS database)
          mkdir -p ~/.pki/nssdb
          [ -f ~/.pki/nssdb/cert9.db ] || certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          certutil -d sql:$HOME/.pki/nssdb -D -n "Cloudflare Zero Trust Root CA" 2>/dev/null || true
          certutil -d sql:$HOME/.pki/nssdb -A -t "C,," -n "Cloudflare Zero Trust Root CA" -i "$CERT"
          certutil -d sql:$HOME/.pki/nssdb -L | grep -q "Cloudflare Zero Trust Root CA"
          rm -f "$CERT"
          echo "✅ Cloudflare Zero Trust Root CA installed."

      # ------------------------------------------------------------------
      # NEW: ALL traffic of the desktop goes through Cloudflare WARP (Zero Trust), not only Chrome.
      #   WARP SOCKS5 proxy (127.0.0.1:1080)  <-  Privoxy turns it into an HTTP proxy (127.0.0.1:8118)
      #   Used by: terminal, git (https + ssh), go, curl/wget, pip, npm/node, apt (also with sudo),
      #            VS Code, Antigravity, Copilot CLI, agy, Files / Google Drive, GNOME Online Accounts.
      #   Chrome keeps using the WARP SOCKS5 proxy directly (as before).
      #   Fail closed: if WARP is down, these apps get NO internet (no data leak past Cloudflare).
      #   Only local addresses (localhost, 127.x) stay direct, so VNC / noVNC keep working.
      #   NOT routed (on purpose): the setup steps of this workflow itself (installing, cloning the
      #   repos, Cloudflare Tunnel, GitHub handover). They run before WARP is ready and must keep the
      #   desktop chain alive even if WARP fails.
      # ------------------------------------------------------------------
      - name: Route all desktop traffic through WARP (system-wide proxy)
        run: |
          # 1. Privoxy: HTTP proxy on 127.0.0.1:8118 -> WARP SOCKS5 on 127.0.0.1:1080 (no filtering)
          sudo tee /etc/privoxy/config > /dev/null << 'EOF'
          confdir /etc/privoxy
          logdir /var/log/privoxy
          listen-address 127.0.0.1:8118
          toggle 0
          enable-remote-toggle 0
          enable-edit-actions 0
          enable-remote-http-toggle 0
          accept-intercepted-requests 0
          forward-socks5t / 127.0.0.1:1080 .
          forward localhost .
          forward 127.0.0.1 .
          keep-alive-timeout 300
          socket-timeout 300
          max-client-connections 512
          EOF
          sudo systemctl restart privoxy 2>/dev/null || sudo privoxy --user privoxy /etc/privoxy/config
          sleep 1
          (ss -ltn 2>/dev/null | grep -q '127.0.0.1:8118') && echo "✅ Privoxy listens on 127.0.0.1:8118" || echo "⚠️ Privoxy is not running"

          # 2. Proxy variables for every program (lower and upper case, many tools read only one of them)
          sudo tee /etc/warp-proxy.env > /dev/null << 'EOF'
          # All traffic through Cloudflare WARP (see workflow step "Route all desktop traffic through WARP")
          export http_proxy=http://127.0.0.1:8118
          export https_proxy=http://127.0.0.1:8118
          export ftp_proxy=http://127.0.0.1:8118
          export all_proxy=socks5h://127.0.0.1:1080
          export no_proxy=localhost,127.0.0.1,::1
          export HTTP_PROXY=$http_proxy HTTPS_PROXY=$https_proxy FTP_PROXY=$ftp_proxy ALL_PROXY=$all_proxy NO_PROXY=$no_proxy
          # Node.js (Copilot CLI, npm tools) uses the proxy variables only with this switch (Node 24+)
          export NODE_USE_ENV_PROXY=1
          # Trust the Cloudflare Zero Trust certificate also in Python, Node.js and Go
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          export NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
          EOF
          sudo chmod 644 /etc/warp-proxy.env

          # 3. sudo keeps the proxy (so "sudo apt install ..." also goes through WARP)
          echo 'Defaults env_keep += "http_proxy https_proxy ftp_proxy all_proxy no_proxy HTTP_PROXY HTTPS_PROXY FTP_PROXY ALL_PROXY NO_PROXY SSL_CERT_FILE REQUESTS_CA_BUNDLE NODE_EXTRA_CA_CERTS NODE_USE_ENV_PROXY"' \
            | sudo tee /etc/sudoers.d/warp-proxy > /dev/null
          sudo chmod 440 /etc/sudoers.d/warp-proxy
          sudo visudo -cf /etc/sudoers.d/warp-proxy > /dev/null || { echo "⚠️ sudoers file invalid - removed"; sudo rm -f /etc/sudoers.d/warp-proxy; }

          # 4. git over SSH (git@github.com:...) and every other SSH connection also through WARP
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat >> ~/.ssh/config << 'EOF'

          # All SSH connections through Cloudflare WARP (except local ones)
          Host * !localhost !127.0.0.1
            ProxyCommand nc -X 5 -x 127.0.0.1:1080 %h %p
          EOF
          chmod 600 ~/.ssh/config

          # 5. Check command for the terminal: "proxy-check"
          sudo tee /usr/local/bin/proxy-check > /dev/null << 'EOF'
          #!/bin/bash
          . /etc/warp-proxy.env
          echo "Testing the way out through Cloudflare ..."
          OUT=$(curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace)
          if [ -z "$OUT" ]; then
            echo "❌ No connection. WARP is probably not connected (see /tmp/warp-setup.log)."
            echo "   For a single command without WARP use:  direct <command>"
            exit 1
          fi
          echo "$OUT" | grep -E '^(warp|gateway|colo|loc)='
          echo "$OUT" | grep -qE '^(warp=(on|plus)|gateway=on)' && echo "✅ Traffic goes through Cloudflare WARP" || echo "⚠️ Answer received, but WARP is not shown as active"
          EOF
          sudo chmod +x /usr/local/bin/proxy-check
          echo "✅ System-wide WARP proxy configured (check later on the desktop with: proxy-check)"

      # ------------------------------------------------------------------
      # Git name/email + GitHub token from secrets.
      # git clone/pull/push, gh and Copilot CLI work without ever pasting the token.
      # ------------------------------------------------------------------
      - name: Configure Git & GitHub login (from secrets)
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GIT_USER_NAME" ]; then
            git config --global user.name "$GIT_USER_NAME"
          else
            echo "⚠️ Secret GIT_USER_NAME is not set"
          fi
          if [ -n "$GIT_USER_EMAIL" ]; then
            git config --global user.email "$GIT_USER_EMAIL"
          else
            echo "⚠️ Secret GIT_USER_EMAIL is not set"
          fi
          git config --global init.defaultBranch main
          git config --global pull.rebase false
          git config --global core.editor nano

          if [ -z "$GH_PAT" ]; then
            echo "⚠️ Secret GH_PAT is not set - git will ask for a login on push."
            exit 0
          fi

          # The token is only stored in files that belong to this user (chmod 600) and is never printed
          umask 077
          mkdir -p ~/.config
          printf '%s' "$GH_PAT" > ~/.config/gh-pat
          GH_LOGIN=$(curl -fsS -H "Authorization: Bearer $GH_PAT" https://api.github.com/user | jq -r '.login // empty' || true)
          if [ -z "$GH_LOGIN" ]; then
            echo "⚠️ GH_PAT was rejected by GitHub (expired or wrong?). It is stored anyway."
            GH_LOGIN="x-access-token"
          else
            # PRIVACY: hide the GitHub user name in all following log lines (public repo safe)
            echo "::add-mask::$GH_LOGIN"
            echo "✅ GitHub token is valid"
          fi

          # 1. git: credential store for https://github.com/... (no token prompt on push/pull)
          printf 'https://%s:%s@github.com\n' "$GH_LOGIN" "$GH_PAT" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          git config --global credential.https://github.com.username "$GH_LOGIN"

          # 2. GitHub CLI (gh) logged in with the same token
          if command -v gh > /dev/null; then
            (unset GH_TOKEN GITHUB_TOKEN; printf '%s' "$GH_PAT" | gh auth login --with-token --hostname github.com) \
              && echo "✅ gh logged in" || echo "⚠️ gh login failed"
          fi

          # 3. Copilot CLI reads COPILOT_GITHUB_TOKEN (exported in ~/.bashrc, see launcher step)
          # PRIVACY: only "set / not set" is printed, never the name or e-mail
          echo "Git user name:  $([ -n "$(git config --global user.name)" ] && echo set || echo 'not set')"
          echo "Git user email: $([ -n "$(git config --global user.email)" ] && echo set || echo 'not set')"

      # ------------------------------------------------------------------
      # Clone your repositories into ~/Downloads (in the BACKGROUND, desktop is usable meanwhile).
      # The list comes from the secret CLONE_REPOS (one repository URL per line).
      # PRIVACY: repository names and URLs are NEVER written to the GitHub log.
      # Details only go to /tmp/repo-clone.log on the remote computer.
      # ------------------------------------------------------------------
      - name: Clone repositories into Downloads (background, list from secret)
        env:
          CLONE_REPOS: ${{ secrets.CLONE_REPOS }}
        run: |
          rm -f /tmp/repos.done
          : > /tmp/repos.result
          if [ -z "$CLONE_REPOS" ]; then
            echo "ℹ️ Secret CLONE_REPOS is not set - no repositories are cloned."
            touch /tmp/repos.done
            exit 0
          fi

          umask 077
          mkdir -p ~/.config ~/Downloads
          printf '%s\n' "$CLONE_REPOS" > ~/.config/clone-repos.list
          COUNT=$(grep -cvE '^[[:space:]]*(#|$)' ~/.config/clone-repos.list || true)
          echo "${COUNT:-0} repositories listed - cloning in the background into ~/Downloads."

          cat > ~/clone-repos.sh << 'CLONESCRIPT'
          #!/bin/bash
          umask 077
          exec > /tmp/repo-clone.log 2>&1
          umask 022
          export GIT_TERMINAL_PROMPT=0
          LIST="$HOME/.config/clone-repos.list"
          DEST="$HOME/Downloads"
          RESULT=/tmp/repos.result
          mkdir -p "$DEST"
          declare -A USED

          clone_one() {
            local slug="$1" target="$2"
            for TRY in 1 2 3; do
              # blob:none = full history, file contents are loaded on demand (much faster for big repos)
              if git clone --filter=blob:none "https://github.com/$slug.git" "$target"; then
                echo "✅ $slug -> $target"
                echo ok >> "$RESULT"
                return 0
              fi
              rm -rf "$target"
              echo "Attempt $TRY for $slug failed, retrying ..."
              sleep $((TRY * 3))
            done
            echo "❌ $slug could not be cloned (no access with GH_PAT or wrong name?)"
            echo failed >> "$RESULT"
          }

          while IFS= read -r line || [ -n "$line" ]; do
            url=$(printf '%s' "$line" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
            case "$url" in ''|'#'*) continue ;; esac
            # Accepts https://github.com/owner/repo, .../repo.git, github.com/owner/repo, git@github.com:owner/repo, owner/repo
            slug="${url%/}"
            slug="${slug%.git}"
            slug="${slug#https://}"; slug="${slug#http://}"; slug="${slug#git@github.com:}"
            slug="${slug#www.}"; slug="${slug#github.com/}"
            owner="${slug%%/*}"; name="${slug#*/}"
            if ! [[ "$slug" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [ "$name" = "." ] || [ "$name" = ".." ]; then
              echo "❌ skipped, not a GitHub repository URL: $url"
              echo failed >> "$RESULT"
              continue
            fi
            dir="$name"
            [ -n "${USED[$dir]}" ] && dir="$owner-$name"   # same repo name from two owners
            USED[$dir]=1
            target="$DEST/$dir"
            if [ -d "$target/.git" ]; then
              echo "Already there, updating: $target"
              if git -C "$target" pull --ff-only; then echo ok >> "$RESULT"; else echo failed >> "$RESULT"; fi
              continue
            fi
            if [ -e "$target" ]; then
              echo "❌ skipped, folder already exists: $target"
              echo failed >> "$RESULT"
              continue
            fi
            clone_one "$slug" "$target" &
            # at most 3 clones at the same time
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 0.5; done
          done < "$LIST"
          wait
          rm -f "$LIST"   # the list is not needed any more
          echo "Finished: $(grep -c '^ok' "$RESULT") ok, $(grep -c '^failed' "$RESULT") failed"
          touch /tmp/repos.done
          CLONESCRIPT
          chmod 700 ~/clone-repos.sh

          nohup setsid bash ~/clone-repos.sh > /dev/null 2>&1 &
          echo "Cloning runs in the background (details only on the remote computer: /tmp/repo-clone.log)"

      - name: Configure Launchers & Desktop Session Script
        env:
          # Optional repository variable DESKTOP_SCALE (e.g. 1.25 or 1.5) = default text/UI scale
          DESKTOP_SCALE: ${{ vars.DESKTOP_SCALE }}
        run: |
          mkdir -p ~/.config/autostart ~/Desktop ~/.local/share/applications ~/.config/xfce4/terminal ~/Downloads

          # Default UI scale (only numbers between 1 and 3 are accepted)
          SCALE="${DESKTOP_SCALE:-1}"
          if ! printf '%s' "$SCALE" | grep -Eq '^[1-3](\.[0-9]{1,2})?$'; then SCALE=1; fi
          echo "$SCALE" > ~/.config/desktop-scale
          echo "Default UI scale: $SCALE"

          # Times for the on-screen countdown (same values as the Keep Alive step)
          START=$(cat /tmp/start-ts)
