name: Remote Desktop Runner (GNOME + Google Drive, Zero Trust, Auto-Restart)


on:
  workflow_dispatch:
    inputs:
      handover:
        description: 'Internal: the new desktop prepares itself while the old one is still running (do not set by hand)'
        required: false
        default: 'false'
  # Safety net: every 30 minutes. A cron run only starts a desktop if none is running (see Guard step).
  schedule:
    - cron: '*/30 * * * *'


# NOTE: there is intentionally NO "concurrency" block.
# With a concurrency group the next run stays "pending" until the old one has finished,
# so the new desktop could only start building AFTER the old one ended (= minutes of waiting).
# Now the next run starts while the old one is still active and waits just before the tunnel step.


permissions:
  actions: write   # needed so the job can start the next run itself
  contents: read


jobs:
  desktop:
    # More CPU = the biggest lever for smoothness. If you have a larger runner, set the
    # repository variable RUNNER_LABEL (Settings > Secrets and variables > Actions > Variables).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350   # hard limit of GitHub Actions is 360 min

    steps:
      # ------------------------------------------------------------------
      # Cron safety net: only start a new desktop if no other run is active.
      # ------------------------------------------------------------------
      - name: Guard (cron starts a desktop only if none is running)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          if gh api "repos/$REPO/actions/workflows/$WF_FILE/runs?per_page=50" > /tmp/runs.json 2> /tmp/runs.err; then
            ACTIVE=$(jq --argjson id "$RUN_ID" '[.workflow_runs[] | select(.id != $id) | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length' /tmp/runs.json)
          else
            echo "⚠️ API request failed ($(cat /tmp/runs.err)) - starting anyway to be safe."
            ACTIVE=0
          fi
          ACTIVE=${ACTIVE:-0}
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A desktop is already running ($ACTIVE active runs). This cron run stops itself."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" > /dev/null || true
            sleep 90
            exit 1   # only reached if the cancel did not work: stop here, never start a second desktop
          fi
          echo "No desktop active - restarting the chain."

      # ------------------------------------------------------------------
      # FAST START: WARP is prepared in the background while the desktop installs.
      # ------------------------------------------------------------------
      - name: Fast start (tune apt, free CPU, start WARP in background)
        env:
          WARP_ORGANIZATION: ${{ secrets.WARP_ORGANIZATION }}
          WARP_AUTH_CLIENT_ID: ${{ secrets.WARP_AUTH_CLIENT_ID }}
          WARP_AUTH_CLIENT_SECRET: ${{ secrets.WARP_AUTH_CLIENT_SECRET }}
        run: |
          date +%s > /tmp/start-ts

          if [ -z "$WARP_ORGANIZATION" ] || [ -z "$WARP_AUTH_CLIENT_ID" ] || [ -z "$WARP_AUTH_CLIENT_SECRET" ]; then
            echo "❌ ERROR: One or more WARP secrets (WARP_ORGANIZATION, WARP_AUTH_CLIENT_ID, WARP_AUTH_CLIENT_SECRET) are missing!"
            exit 1
          fi

          # make apt faster: no man-db rebuild, no fsync, no translations
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/99-fast-io > /dev/null
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99-fast > /dev/null

          # SMOOTHNESS: stop background services that randomly eat CPU during the session
          for s in unattended-upgrades apt-daily.timer apt-daily-upgrade.timer man-db.timer \
                   packagekit fwupd snapd.service snapd.socket; do
            sudo systemctl stop "$s" > /dev/null 2>&1 || true
          done

          # Free disk space ONLY if it is really tight (the big delete costs disk I/O while apt is installing)
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free space on /: ${FREE_GB:-?} GB"
          if [ "${FREE_GB:-0}" -lt 10 ]; then
            echo "Low disk space - cleaning up in the background."
            sudo nohup rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android > /dev/null 2>&1 &
          fi

          # WARP setup script (runs completely in the background, parallel to the desktop installation)
          cat > ~/warp-setup.sh << 'WARPSCRIPT'
          #!/bin/bash
          exec > /tmp/warp-setup.log 2>&1
          rm -f /tmp/warp.done /tmp/warp.failed /tmp/warp.connected
          fail() { echo "❌ $*"; touch /tmp/warp.failed; exit 1; }

          # 1. Ubuntu container for the official WARP client
          docker run -d \
            --name warp-proxy \
            --privileged \
            --cap-add NET_ADMIN \
            -p 127.0.0.1:1080:1080 \
            ubuntu:22.04 sleep infinity || fail "docker run failed"

          # 2. Install the official cloudflare-warp package
          docker exec warp-proxy bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y curl gnupg lsb-release ca-certificates dbus socat
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main' > /etc/apt/sources.list.d/cloudflare-client.list
            apt-get update
            apt-get install -y cloudflare-warp
          " || fail "WARP install failed"

          # 3. Zero Trust login with service token via mdm.xml (proxy mode on port 4000)
          umask 077
          cat > /tmp/mdm.xml << EOF
          <dict>
            <key>organization</key>
            <string>${WARP_ORGANIZATION}</string>
            <key>auth_client_id</key>
            <string>${WARP_AUTH_CLIENT_ID}</string>
            <key>auth_client_secret</key>
            <string>${WARP_AUTH_CLIENT_SECRET}</string>
            <key>service_mode</key>
            <string>proxy</string>
            <key>proxy_port</key>
            <integer>4000</integer>
            <key>auto_connect</key>
            <integer>1</integer>
            <key>onboarding</key>
            <false/>
          </dict>
          EOF
          docker exec warp-proxy mkdir -p /var/lib/cloudflare-warp
          docker cp /tmp/mdm.xml warp-proxy:/var/lib/cloudflare-warp/mdm.xml
          rm -f /tmp/mdm.xml

          # 4. Start system D-Bus and the WARP service
          docker exec warp-proxy bash -c "mkdir -p /run/dbus && rm -f /run/dbus/pid && dbus-daemon --config-file=/usr/share/dbus-1/system.conf --fork"
          docker exec -d warp-proxy bash -c "warp-svc > /var/log/warp-svc.log 2>&1"

          # 5. Wait for the connection (max. ~90 seconds, checked every 2 s, explicit connect after ~10 s)
          for i in $(seq 1 45); do
            sleep 2
            if docker exec warp-proxy warp-cli --accept-tos status 2>/dev/null | grep -q "Connected"; then
              touch /tmp/warp.connected; break
            fi
            [ "$i" = "5" ] && docker exec warp-proxy warp-cli --accept-tos connect || true
          done

          # 6. Forward the internal WARP proxy (4000) to container port 1080
          docker exec -d warp-proxy socat TCP-LISTEN:1080,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:4000
          sleep 1

          docker exec warp-proxy warp-cli --accept-tos status || true
          if [ -f /tmp/warp.connected ]; then
            echo "✅ WARP connected. Test through the proxy:"
            curl -s --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp=|gateway=" || echo "⚠️ Test failed (certificate may not match)"
          else
            echo "⚠️ WARP is NOT connected. Chrome will not load pages (no data leak)."
            docker exec warp-proxy tail -n 50 /var/log/warp-svc.log || true
          fi
          touch /tmp/warp.done
          WARPSCRIPT
          chmod +x ~/warp-setup.sh

          nohup setsid bash ~/warp-setup.sh > /dev/null 2>&1 &
          echo "WARP setup runs in the background (log: /tmp/warp-setup.log)"

      - name: Install Desktop, Chrome, Terminal & Tools (one single apt run)
        run: |
          export DEBIAN_FRONTEND=noninteractive

          # Download .deb files in parallel while apt loads the package lists.
          # Chrome is skipped if the runner image already has it (saves download + install time).
          mkdir -p /tmp/dl && chmod 755 /tmp/dl
          DEBS=()
          PIDS=()
          curl -fsSL -o /tmp/dl/cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb &
          PIDS+=($!)
          DEBS+=(/tmp/dl/cloudflared-linux-amd64.deb)
          if [ -x /usr/bin/google-chrome-stable ]; then
            echo "Chrome is already installed on the runner - skipping download."
          else
            curl -fsSL -o /tmp/dl/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
            PIDS+=($!)
            DEBS+=(/tmp/dl/google-chrome-stable_current_amd64.deb)
          fi
          sudo apt-get update
          for p in "${PIDS[@]}"; do
            wait "$p" || { echo "❌ Download failed"; exit 1; }
          done
          chmod 644 /tmp/dl/*.deb

          # Everything in ONE apt call. Tools already on the runner are skipped by apt.
          # NEW: gnome-settings-daemon (provides gsd-xsettings = sharp fonts + scaling for all apps), zenity (scale dialog)
          sudo apt-get install -y "${DEBS[@]}" \
            gnome-session-flashback \
            gnome-flashback \
            gnome-panel \
            gnome-settings-daemon \
            metacity \
            gnome-control-center \
            gnome-online-accounts \
            gnome-keyring \
            gvfs \
            gvfs-backends \
            nautilus \
            adwaita-icon-theme \
            tigervnc-standalone-server \
            tigervnc-common \
            xfonts-base \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11vnc \
            novnc \
            websockify \
            zenity \
            curl \
            wget \
            dbus-x11 \
            libnss3-tools \
            openssl \
            xfce4-terminal \
            xfconf \
            fonts-dejavu-core \
            fonts-noto-core \
            bash-completion \
            mc \
            fzf \
            zoxide \
            tree \
            htop \
            ncdu \
            python3 \
            python3-gi \
            gir1.2-glib-2.0 \
            zip \
            unzip \
            p7zip-full \
            libarchive-tools \
            rsync \
            nano \
            git \
            jq \
            ripgrep \
            fd-find \
            bat \
            tmux \
            lsof \
            psmisc \
            xclip
          rm -rf /tmp/dl

          # Ubuntu names some tools differently: make "fd" and "bat" work as usual
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat 2>/dev/null || true

          # Make xfce4-terminal the default terminal
          sudo update-alternatives --set x-terminal-emulator /usr/bin/xfce4-terminal.wrapper || true

          # ------------------------------------------------------------------
          # SHARPNESS: noVNC start page
          #  - quality=9   -> highest JPEG quality, no colour subsampling (no blurry/colour-fringed text)
          #  - compression=2 -> less CPU on the server = smoother
          #  - reconnect   -> reconnects by itself after short network hiccups and after the handover
          #  - The page checks the browser pixel ratio. With Windows scaling 125 %/150 % or a Retina
          #    display the browser stretches the picture = blurry. The page asks the user ONCE to zoom
          #    out (Ctrl + Minus) until the picture is 1:1. The browser remembers the zoom for this site.
          # ------------------------------------------------------------------
          sudo rm -f /usr/share/novnc/index.html
          sudo tee /usr/share/novnc/index.html > /dev/null << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Remote Desktop</title>
          <style>
            html, body { margin: 0; height: 100%; background: #1e1e1e; color: #e6e6e6; font-family: system-ui, sans-serif; }
            #box { max-width: 520px; margin: 12vh auto; padding: 28px; background: #2a2a2a; border-radius: 12px; line-height: 1.5; }
            h1 { font-size: 22px; margin: 0 0 12px; }
            kbd { background: #444; border-radius: 4px; padding: 2px 6px; }
            .big { font-size: 28px; font-weight: 600; color: #8ab4f8; }
            a { color: #8ab4f8; }
            #box[hidden] { display: none; }
          </style>
          </head>
          <body>
          <div id="box" hidden>
            <h1>One-time setup for a sharp picture</h1>
            <p>Your screen uses scaling, so the browser would stretch the remote desktop and it would look blurry.</p>
            <p>Press <kbd>Ctrl</kbd> + <kbd>-</kbd> (Mac: <kbd>Cmd</kbd> + <kbd>-</kbd>) until the zoom is at</p>
            <p class="big" id="target"></p>
            <p>The desktop then opens automatically. Your browser remembers this setting for this site.</p>
            <p>Text too small afterwards? On the remote desktop open <b>Display scale</b> and choose a larger value.</p>
            <p><a href="#" id="skip">Continue without sharp mode</a></p>
          </div>
          <script>
            (function () {
              var url = 'vnc.html?autoconnect=true&resize=remote&quality=9&compression=2' +
                        '&reconnect=true&reconnect_delay=1500&show_dot=true&logging=warn';
              var box = document.getElementById('box');
              var target = document.getElementById('target');
              var zoomPresets = [25, 33, 50, 67, 75, 80, 90, 100];
              var go = function () { window.location.replace(url); };
              var sharp = function () { return Math.abs(window.devicePixelRatio - 1) < 0.03; };
              var check = function () {
                if (sharp()) { go(); return; }
                // devicePixelRatio = OS scaling x browser zoom. Suggest the browser zoom that brings it to 1.
                var osScale = window.devicePixelRatio;
                var best = zoomPresets.reduce(function (a, b) {
                  return Math.abs(100 / osScale - b) < Math.abs(100 / osScale - a) ? b : a;
                });
                target.textContent = 'about ' + best + ' % (smaller than now)';
                box.hidden = false;
              };
              document.getElementById('skip').addEventListener('click', function (e) { e.preventDefault(); go(); });
              window.addEventListener('resize', check);
              check();
            })();
          </script>
          </body>
          </html>
          EOF

          # Check that the important commands really exist
          MISSING=""
          for c in cp mv rm mkdir ls cat find grep sed awk tar gzip bzip2 xz zip unzip 7z bsdtar rsync \
                   nano git jq rg fd bat curl wget less file tree htop ncdu mc fzf zoxide tmux zenity \
                   xfce4-terminal python3 google-chrome-stable cloudflared Xtigervnc Xvfb x11vnc; do
            command -v "$c" >/dev/null || MISSING="$MISSING $c"
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️ Missing commands:$MISSING"
          else
            echo "✅ All standard commands are available"
          fi
          echo "⏱ Installation finished after $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds"

      - name: Install Google Drive Shell (gdsh)
        run: |
          # gdsh = terminal for Google Drive with REAL file names.
          # Uses the Google account from GNOME Online Accounts. No extra OAuth app, no rclone, no API keys.
          sudo tee /usr/local/bin/gdsh > /dev/null << 'EOF'
          #!/usr/bin/env python3
          """gdsh - Google Drive shell with real file names (account from GNOME Online Accounts)."""
          import cmd, glob, os, re, readline, subprocess, time
          from concurrent.futures import ThreadPoolExecutor
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio, GLib

          ATTRS = "standard::name,standard::display-name,standard::type,standard::size"
          BLUE, GREEN, OFF = "\033[1;34m", "\033[1;32m", "\033[0m"
          DIR = Gio.FileType.DIRECTORY


          def human(n):
              for unit in ("B", "K", "M", "G", "T"):
                  if n < 1024:
                      return f"{n:.0f}{unit}" if unit == "B" else f"{n:.1f}{unit}"
                  n /= 1024
              return f"{n:.1f}P"


          def safe(name):
              return name.replace("/", "_")


          def find_drive_uris():
              try:
                  out = subprocess.run(["gio", "mount", "-li"], capture_output=True, text=True, timeout=30).stdout
              except Exception:
                  return []
              uris = []
              # Stop at whitespace, quotes and angle brackets (gio prints e.g. 'google-drive://user@host/')
              for m in re.findall(r"google-drive://[^\s'\"<>]+", out):
                  if not m.endswith("/"):
                      m += "/"
                  if m not in uris:
                      uris.append(m)
              return uris


          def ensure_mounted(uri):
              root = Gio.File.new_for_uri(uri)
              try:
                  root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
                  return root
              except GLib.Error:
                  pass
              subprocess.run(["gio", "mount", uri], capture_output=True, timeout=90)
              root.query_info("standard::name", Gio.FileQueryInfoFlags.NONE, None)
              return root


          class DriveShell(cmd.Cmd):
              intro = "Google Drive shell - type 'help' for commands, 'exit' to quit."

              def __init__(self, root):
                  super().__init__()
                  readline.set_completer_delims(" \t\n")
                  self.stack = [(root, "")]
                  self.cache = {}
                  os.makedirs(os.path.expanduser("~/Downloads"), exist_ok=True)
                  os.chdir(os.path.expanduser("~/Downloads"))
                  self._prompt()

              # ---------- helpers ----------
              def _prompt(self):
                  path = "/" + "/".join(n for _, n in self.stack[1:])
                  self.prompt = f"\001{GREEN}\002drive:{path}\001{OFF}\002> "

              def _arg(self, arg):
                  arg = arg.strip()
                  if len(arg) >= 2 and arg[0] == arg[-1] and arg[0] in "\"'":
                      arg = arg[1:-1]
                  return arg

              def _err(self, e):
                  print(f"Error: {e.message if isinstance(e, GLib.Error) else e}")

              def _list(self, folder, fresh=False):
                  key = folder.get_uri()
                  hit = self.cache.get(key)
                  if hit and not fresh and time.time() - hit[0] < 30:
                      return hit[1]
                  items = []
                  en = folder.enumerate_children(ATTRS, Gio.FileQueryInfoFlags.NONE, None)
                  while True:
                      info = en.next_file(None)
                      if info is None:
                          break
                      items.append(info)
                  en.close(None)
                  items.sort(key=lambda i: (i.get_file_type() != DIR, i.get_display_name().lower()))
                  self.cache[key] = (time.time(), items)
                  return items

              def _find(self, folder, name):
                  items = self._list(folder)
                  for test in (lambda i: i.get_display_name() == name,
                               lambda i: i.get_display_name().lower() == name.lower(),
                               lambda i: i.get_name() == name):
                      for info in items:
                          if test(info):
                              return info
                  return None

              def _walk(self, path):
                  stack = self.stack[:1] if path.startswith("/") else list(self.stack)
                  info = None
                  for part in [p for p in path.split("/") if p and p != "."]:
                      if part == "..":
                          if len(stack) > 1:
                              stack.pop()
                          info = None
                          continue
                      info = self._find(stack[-1][0], part)
                      if info is None:
                          raise LookupError(f"Not found: {part}")
                      stack.append((stack[-1][0].get_child(info.get_name()), info.get_display_name()))
                  return stack, info

              def _target(self, arg):
                  stack, info = self._walk(self._arg(arg))
                  if info is None:
                      raise LookupError("Please give a file or folder name")
                  return stack[-1][0], info

              # ---------- Drive commands ----------
              def do_ls(self, arg):
                  """ls [folder]        list files with real names (also: dir, ll)"""
                  try:
                      stack, info = self._walk(self._arg(arg))
                      if info and info.get_file_type() != DIR:
                          return print(info.get_display_name())
                      items = self._list(stack[-1][0], fresh=True)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if not items:
                      print("(empty)")
                  for i in items:
                      if i.get_file_type() == DIR:
                          print(f"{'<DIR>':>9}  {BLUE}{i.get_display_name()}/{OFF}")
                      else:
                          print(f"{human(i.get_size()):>9}  {i.get_display_name()}")
              do_dir = do_ll = do_ls

              def do_cd(self, arg):
                  """cd <folder>        change folder (cd .. = up, cd / = top, Tab completes)"""
                  try:
                      stack, info = self._walk(self._arg(arg) or "/")
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  if info and info.get_file_type() != DIR:
                      return print(f"Not a folder: {info.get_display_name()}")
                  self.stack = stack
                  self._prompt()

              def do_pwd(self, arg):
                  """pwd                show current Drive folder"""
                  print("/" + "/".join(n for _, n in self.stack[1:]))

              def do_get(self, arg):
                  """get <file|folder>  download into the current local folder (see lpwd, lcd)"""
                  try:
                      src, info = self._target(arg)
                      dest = os.path.join(os.getcwd(), safe(info.get_display_name()))
                      self._download(src, info, dest)
                      print(f"Done -> {dest}")
                  except (GLib.Error, LookupError, OSError) as e:
                      self._err(e)

              def _download(self, src, info, dest):
                  if info.get_file_type() == DIR:
                      os.makedirs(dest, exist_ok=True)
                      for child in self._list(src):
                          self._download(src.get_child(child.get_name()), child,
                                         os.path.join(dest, safe(child.get_display_name())))
                      return
                  try:
                      src.copy(Gio.File.new_for_path(dest), Gio.FileCopyFlags.OVERWRITE, None, None)
                      print(f"  {info.get_display_name()}")
                  except GLib.Error as e:
                      print(f"  skipped {info.get_display_name()} ({e.message})")

              def do_put(self, arg):
                  """put <local path>   upload a local file or folder into the current Drive folder"""
                  local = os.path.expanduser(self._arg(arg))
                  if not local or not os.path.exists(local):
                      return print(f"Not found locally: {local}")
                  try:
                      self._upload(os.path.abspath(local), self.stack[-1][0])
                      print("Done.")
                  except (GLib.Error, LookupError) as e:
                      self._err(e)
                  self.cache.clear()

              def _upload(self, local, folder):
                  name = os.path.basename(os.path.normpath(local))
                  existing = self._find(folder, name)
                  if os.path.isdir(local):
                      if not (existing and existing.get_file_type() == DIR):
                          folder.get_child_for_display_name(name).make_directory(None)
                          self.cache.pop(folder.get_uri(), None)
                          existing = self._find(folder, name)
                          if existing is None:
                              raise LookupError(f"Could not create folder: {name}")
                      target = folder.get_child(existing.get_name())
                      for entry in sorted(os.listdir(local)):
                          self._upload(os.path.join(local, entry), target)
                      return
                  if existing:
                      dest, flags = folder.get_child(existing.get_name()), Gio.FileCopyFlags.OVERWRITE
                  else:
                      dest, flags = folder.get_child_for_display_name(name), Gio.FileCopyFlags.NONE
                  Gio.File.new_for_path(local).copy(dest, flags, None, None)
                  print(f"  {name}")

              def do_mkdir(self, arg):
                  """mkdir <name>       create a folder in the current Drive folder"""
                  name = self._arg(arg)
                  if not name:
                      return print("Please give a folder name")
                  try:
                      self.stack[-1][0].get_child_for_display_name(name).make_directory(None)
                      print(f"Created: {name}")
                  except GLib.Error as e:
                      self._err(e)
                  self.cache.clear()

              def do_rm(self, arg):
                  """rm [-rf] <file|folder>   delete a file or a whole folder (asks first, -f = no question)"""
                  rest, force = arg.strip(), False
                  while rest.startswith("-"):
                      flag, _, rest = rest.partition(" ")
                      rest = rest.strip()
                      if flag == "--":
                          break
                      if "f" in flag[1:]:
                          force = True
                  try:
                      f, info = self._target(rest)
                  except (GLib.Error, LookupError) as e:
                      return self._err(e)
                  name, is_dir = info.get_display_name(), info.get_file_type() == DIR
                  if not force:
                      what = f"'{name}' and EVERYTHING inside it" if is_dir else f"'{name}'"
                      if input(f"Delete {what}? [y/N] ").strip().lower() != "y":
                          return print("Cancelled.")
                  try:
                      try:
                          f.trash(None)
                          print("Moved to Google Drive trash.")
                          return
                      except GLib.Error:
                          pass  # trash not possible (e.g. folder with content) -> delete directly
                      if not is_dir:
                          f.delete(None)
                          print("Deleted.")
                      else:
                          self._delete_tree(f)
                  except GLib.Error as e:
                      self._err(e)
                  finally:
                      self.cache.clear()

              def _delete_tree(self, root):
                  files, dirs = [], []

                  def collect(folder):
                      dirs.append(folder)
                      for child in self._list(folder, fresh=True):
                          c = folder.get_child(child.get_name())
                          if child.get_file_type() == DIR:
                              collect(c)
                          else:
                              files.append(c)

                  print("Counting files ...")
                  collect(root)
                  total = len(files)
                  print(f"Deleting {total} files in {len(dirs)} folders (Ctrl+C stops) ...")

                  def kill(item):
                      for attempt in range(3):
                          try:
                              item.delete(None)
                              return True
                          except GLib.Error as e:
                              if "not found" in (e.message or "").lower():
                                  return True
                              time.sleep(1 + attempt)
                      return False

                  failed = done = 0
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      for ok in pool.map(kill, files):
                          done += 1
                          failed += 0 if ok else 1
                          if done % 20 == 0 or done == total:
                              print(f"\r  {done}/{total} files", end="", flush=True)
                  print()
                  for d in reversed(dirs):  # children first, top folder last
                      if not kill(d):
                          failed += 1
                  if failed:
                      print(f"Done, but {failed} item(s) could not be deleted. Run the same command again.")
                  else:
                      print("Deleted.")

              def do_cat(self, arg):
                  """cat <file>         show a text file"""
                  try:
                      f, info = self._target(arg)
                      ok, data, _ = f.load_contents(None)
                      print(data[:200000].decode("utf-8", errors="replace"))
                  except (GLib.Error, LookupError) as e:
                      self._err(e)

              def do_refresh(self, arg):
                  """refresh            reload file lists from Google Drive"""
                  self.cache.clear()
                  print("Cache cleared.")

              # ---------- local commands ----------
              def do_lpwd(self, arg):
                  """lpwd               show the local folder (downloads go here)"""
                  print(os.getcwd())

              def do_lcd(self, arg):
                  """lcd <path>         change the local folder"""
                  try:
                      os.chdir(os.path.expanduser(self._arg(arg) or "~"))
                      print(os.getcwd())
                  except OSError as e:
                      self._err(e)

              def do_lls(self, arg):
                  """lls                list the local folder"""
                  subprocess.run(["ls", "-lh", "--color=auto", "--group-directories-first"])

              def do_shell(self, arg):
                  """!<command>         run a normal Linux command locally, e.g. !unzip file.zip"""
                  subprocess.run(arg, shell=True)

              def do_clear(self, arg):
                  """clear              clear the screen (also: cls)"""
                  os.system("clear")
              do_cls = do_clear

              def do_exit(self, arg):
                  """exit               leave gdsh"""
                  return True
              do_quit = do_exit

              def do_EOF(self, arg):
                  print()
                  return True

              def do_help(self, arg):
                  if arg:
                      return super().do_help(arg)
                  print("\nCommands:")
                  for name in ("ls", "cd", "pwd", "get", "put", "mkdir", "rm", "cat", "refresh",
                               "lpwd", "lcd", "lls", "shell", "clear", "exit"):
                      print("  " + getattr(self, "do_" + name).__doc__)
                  print("\nNames with spaces work without quotes. Tab completes names.\n")

              def emptyline(self):
                  pass

              # ---------- tab completion ----------
              def _complete_remote(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  base, sep, partial = arg.rpartition("/")
                  try:
                      stack = self._walk(base + sep)[0] if sep else self.stack
                      items = self._list(stack[-1][0])
                  except Exception:
                      return []
                  out = []
                  for i in items:
                      is_dir = i.get_file_type() == DIR
                      if dirs_only and not is_dir:
                          continue
                      name = i.get_display_name() + ("/" if is_dir else "")
                      if name.lower().startswith(partial.lower()):
                          out.append((base + sep + name)[len(arg) - len(text):])
                  return out

              def _complete_local(self, text, line, dirs_only=False):
                  arg = line.split(" ", 1)[1] if " " in line else ""
                  home = os.path.expanduser("~")
                  out = []
                  for p in glob.glob(os.path.expanduser(arg) + "*"):
                      if dirs_only and not os.path.isdir(p):
                          continue
                      p += "/" if os.path.isdir(p) else ""
                      if arg.startswith("~"):
                          p = "~" + p[len(home):]
                      out.append(p[len(arg) - len(text):])
                  return out

              def complete_cd(self, text, line, b, e):
                  return self._complete_remote(text, line, dirs_only=True)

              def complete_ls(self, text, line, b, e):
                  return self._complete_remote(text, line)
              complete_dir = complete_ll = complete_get = complete_rm = complete_cat = complete_ls

              def complete_put(self, text, line, b, e):
                  return self._complete_local(text, line)

              def complete_lcd(self, text, line, b, e):
                  return self._complete_local(text, line, dirs_only=True)


          def main():
              uris = find_drive_uris()
              if not uris:
                  print("No Google account found.")
                  print("Open 'Settings (Online Accounts)' on the desktop, add your Google account,")
                  print("make sure 'Files' is switched on, then run 'gdsh' again.")
                  return 1
              uri = uris[0]
              if len(uris) > 1:
                  for n, u in enumerate(uris, 1):
                      print(f"  {n}) {u}")
                  choice = input("Which account? [1] ").strip() or "1"
                  if choice.isdigit() and 1 <= int(choice) <= len(uris):
                      uri = uris[int(choice) - 1]
              try:
                  root = ensure_mounted(uri)
              except GLib.Error as e:
                  print(f"Could not open Google Drive ({uri}): {e.message}")
                  print("Tip: open the Google Drive once in 'Files (Google Drive)', then run gdsh again.")
                  return 1
              print(f"Connected: {uri}")
              shell = DriveShell(root)
              while True:
                  try:
                      shell.cmdloop()
                      return 0
                  except KeyboardInterrupt:
                      print("^C")
                      shell.intro = None


          if __name__ == "__main__":
              raise SystemExit(main())
          EOF
          sudo chmod +x /usr/local/bin/gdsh
          python3 -m py_compile /usr/local/bin/gdsh && echo "✅ gdsh installed"

      - name: Fix "Offline" in Online Accounts (disable NetworkManager)
        run: |
          # NetworkManager does not manage the runner's network card and wrongly reports "offline"
          sudo systemctl stop NetworkManager 2>/dev/null || true
          sudo systemctl mask NetworkManager 2>/dev/null || true
          sudo pkill -x NetworkManager 2>/dev/null || true
          # Check: internet must still work
          curl -s --max-time 10 -o /dev/null -w "Internet test: HTTP %{http_code}\n" https://www.google.com || echo "⚠️ No internet"

      - name: Install Cloudflare Zero Trust Root CA (from Secret)
        env:
          CF_CA_1: ${{ secrets.CLOUDFLARE_ROOT_CA_B64 }}
          CF_CA_2: ${{ secrets.CLOUDFLARE_CA_CERT }}
        run: |
          # Accepts both secret names
          if [ -n "$CF_CA_1" ]; then
            CF_CA="$CF_CA_1"; echo "Using secret CLOUDFLARE_ROOT_CA_B64"
          elif [ -n "$CF_CA_2" ]; then
            CF_CA="$CF_CA_2"; echo "Using secret CLOUDFLARE_CA_CERT"
          else
            echo "❌ ERROR: No certificate secret found!"
            echo "   Create a secret named CLOUDFLARE_ROOT_CA_B64 or CLOUDFLARE_CA_CERT under"
            echo "   Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          CERT="$RUNNER_TEMP/cf-zt-root.pem"
          RAW="$RUNNER_TEMP/cf-zt-raw"
          rm -f "$CERT" "$RAW"

          if printf '%s' "$CF_CA" | grep -q "BEGIN CERTIFICATE"; then
            # Secret contains the certificate as text (PEM)
            printf '%s\n' "$CF_CA" | tr -d '\r' > "$CERT"
          else
            # Secret contains the certificate Base64-encoded (PEM or DER file)
            printf '%s' "$CF_CA" | tr -d '\r\n ' | base64 -d > "$RAW" 2>/dev/null || true
            if openssl x509 -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -in "$RAW" -out "$CERT"
            elif openssl x509 -inform DER -in "$RAW" -noout 2>/dev/null; then
              openssl x509 -inform DER -in "$RAW" -out "$CERT"
            fi
            rm -f "$RAW"
          fi

          # Check that the certificate is valid and not expired
          if ! openssl x509 -in "$CERT" -noout 2>/dev/null; then
            echo "❌ ERROR: The secret content is not a valid certificate!"
            exit 1
          fi
          echo "Certificate:"
          openssl x509 -in "$CERT" -noout -subject -enddate -fingerprint -sha256
          openssl x509 -in "$CERT" -noout -checkend 0 || { echo "❌ Certificate has expired"; exit 1; }

          # 1. Trust system-wide (curl, apt etc.)
          sudo cp "$CERT" /usr/local/share/ca-certificates/cloudflare-zt-root.crt
          sudo update-ca-certificates

          # 2. Trust in Chrome (NSS database)
          mkdir -p ~/.pki/nssdb
          [ -f ~/.pki/nssdb/cert9.db ] || certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          certutil -d sql:$HOME/.pki/nssdb -D -n "Cloudflare Zero Trust Root CA" 2>/dev/null || true
          certutil -d sql:$HOME/.pki/nssdb -A -t "C,," -n "Cloudflare Zero Trust Root CA" -i "$CERT"
          certutil -d sql:$HOME/.pki/nssdb -L | grep "Cloudflare Zero Trust Root CA"
          rm -f "$CERT"
          echo "✅ Cloudflare Zero Trust Root CA installed."

      - name: Configure Launchers & Desktop Session Script
        env:
          # Optional repository variable DESKTOP_SCALE (e.g. 1.25 or 1.5) = default text/UI scale
          DESKTOP_SCALE: ${{ vars.DESKTOP_SCALE }}
        run: |
          mkdir -p ~/.config/autostart ~/Desktop ~/.local/share/applications ~/.config/xfce4/terminal ~/Downloads

          # Default UI scale (only numbers between 1 and 3 are accepted)
          SCALE="${DESKTOP_SCALE:-1}"
          if ! printf '%s' "$SCALE" | grep -Eq '^[1-3](\.[0-9]{1,2})?$'; then SCALE=1; fi
          echo "$SCALE" > ~/.config/desktop-scale
          echo "Default UI scale: $SCALE"

          # Chrome start script: reads the chosen scale, sharp grayscale text, no smooth scrolling.
          # REMOVED: --disable-dev-shm-usage (it forced Chrome to use the slow disk instead of RAM = laggy)
          sudo tee /usr/local/bin/chrome-warp > /dev/null << 'EOF'
          #!/bin/bash
          SCALE=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
          exec /usr/bin/google-chrome-stable \
            --proxy-server="socks5://127.0.0.1:1080" \
            --force-device-scale-factor="$SCALE" \
            --force-dark-mode --enable-features=WebUIDarkMode \
            --start-maximized --no-first-run --no-default-browser-check \
            --disable-session-crashed-bubble --password-store=basic \
            --disable-smooth-scrolling \
            --disable-lcd-text \
            --force-color-profile=srgb \
            "$@"
          EOF
          sudo chmod +x /usr/local/bin/chrome-warp

          # Display scale dialog (bigger/smaller text and UI for all apps)
          sudo tee /usr/local/bin/desktop-scale > /dev/null << 'EOF'
          #!/bin/bash
          S="$1"
          if [ -z "$S" ]; then
            CUR=$(cat "$HOME/.config/desktop-scale" 2>/dev/null || echo 1)
            S=$(zenity --list --title="Display scale" --text="Current: $CUR\nChoose a size:" \
                  --column="Scale" --column="Size" --height=360 --width=320 \
                  1 "100 % (small)" 1.25 "125 %" 1.5 "150 %" 1.75 "175 %" 2 "200 % (large)") || exit 0
          fi
          printf '%s' "$S" | grep -Eq '^[1-3](\.[0-9]{1,2})?$' || exit 1
          echo "$S" > "$HOME/.config/desktop-scale"
          gsettings set org.gnome.desktop.interface text-scaling-factor "$S"
          gsettings set org.gnome.desktop.interface cursor-size "$(python3 -c "print(int(round(24*$S)))")"
          [ -z "$1" ] && zenity --info --width=320 --text="Done. Please close and reopen Chrome to apply it there." || true
          EOF
          sudo chmod +x /usr/local/bin/desktop-scale

          # Chrome launcher (routed through the WARP SOCKS5 proxy)
          cat > ~/Desktop/google-chrome.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome (WARP ZT)
          Comment=Web browser via Cloudflare Zero Trust
          Exec=/usr/local/bin/chrome-warp %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          EOF

          # Display scale launcher
          cat > ~/Desktop/display-scale.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Display scale
          Comment=Make text and windows bigger or smaller
          Exec=/usr/local/bin/desktop-scale
          Icon=preferences-desktop-display
          Terminal=false
          Categories=Settings;
          EOF

          # GNOME Settings (Online Accounts -> Google Drive)
          cat > ~/Desktop/gnome-control-center.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Settings (Online Accounts)
          Comment=GNOME Settings - add a Google account for Google Drive
          Exec=env GIO_USE_NETWORK_MONITOR=netlink XDG_CURRENT_DESKTOP=GNOME gnome-control-center online-accounts
          Icon=org.gnome.Settings
