              "$@" >> "/tmp/desktop-$name.log" 2>&1 &
              sleep 1
            fi
          }

          while true; do
            [ -n "$XSETTINGS" ] && start_if_missing gsd-xsettings "$XSETTINGS"
            start_if_missing metacity metacity --replace
            start_if_missing gnome-flashback gnome-flashback
            start_if_missing gnome-panel gnome-panel
            sleep 5
          done
          EOF
          chmod +x ~/desktop-session.sh

          # Helper: give the picture pipeline (VNC server, web proxy, tunnel) priority over everything else
          sudo tee /usr/local/bin/boost-priority > /dev/null << 'EOF'
          #!/bin/bash
          for p in $(pgrep -x Xtigervnc; pgrep -x Xvfb; pgrep -x x11vnc; pgrep -f websockify; pgrep -x cloudflared); do
            sudo renice -n -10 -p "$p" > /dev/null 2>&1 || true
          done
          EOF
          sudo chmod +x /usr/local/bin/boost-priority

      - name: Start Display, Desktop Session & VNC
        run: |
          # 1. Virtual display + VNC server.
          #    Preferred: TigerVNC (display and VNC in ONE process = faster, better compression, supports remote resize).
          #    Fallback: Xvfb + x11vnc if TigerVNC does not start.
          VNC_OK=0
          if command -v Xtigervnc >/dev/null; then
            nohup Xtigervnc :99 -geometry 1920x1080 -depth 24 -dpi 96 \
              -rfbport 5900 -SecurityTypes None -localhost \
              -AlwaysShared -ac -FrameRate 60 -CompareFB 2 > /tmp/xvnc.log 2>&1 &
            for i in $(seq 1 20); do
              xdpyinfo -display :99 >/dev/null 2>&1 && { VNC_OK=1; break; }
              sleep 0.5
            done
            if [ "$VNC_OK" != "1" ]; then
              echo "⚠️ Xtigervnc does not start - switching to Xvfb + x11vnc. Log:"
              cat /tmp/xvnc.log
              pkill -x Xtigervnc 2>/dev/null || true
              sleep 1
            fi
          fi

          if [ "$VNC_OK" = "1" ]; then
            echo "tigervnc" > /tmp/vnc-mode
            echo "✅ TigerVNC running."
          else
            nohup Xvfb :99 -screen 0 1920x1080x24 -dpi 96 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
            for i in $(seq 1 20); do
              xdpyinfo -display :99 >/dev/null 2>&1 && break
              sleep 0.5
            done
            xdpyinfo -display :99 >/dev/null 2>&1 || { echo "❌ Xvfb does not start"; cat /tmp/xvfb.log; exit 1; }
            echo "xvfb" > /tmp/vnc-mode
          fi

          # 2. Start the desktop session with watchdog (keeps running on its own, we do NOT wait for it here)
          nohup setsid bash ~/desktop-session.sh > /tmp/desktop-session.log 2>&1 &

          # 3. Only for the fallback: separate VNC server (no password, local only, short wait times = smoother)
          if [ "$(cat /tmp/vnc-mode)" = "xvfb" ]; then
            x11vnc -nopw -localhost -rfbport 5900 -forever -shared -display :99 -wait 5 -defer 5 -bg -o /tmp/x11vnc.log
            echo "✅ Fallback x11vnc running."
          fi

          # 4. noVNC web proxy (port 6080, local only)
          nohup websockify --web=/usr/share/novnc/ 127.0.0.1:6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 1
          boost-priority
          echo "⏱ Display + VNC running after $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds (mode: $(cat /tmp/vnc-mode))"

      - name: Hand over (wait until the previous desktop has finished)
        if: github.event.inputs.handover == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # This desktop is fully prepared. It takes over the tunnel the moment the older run has ended.
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          echo "New desktop is ready ($(( $(date +%s) - $(cat /tmp/start-ts) )) s). Waiting until the old desktop has finished ..."
          FAIL=0
          for i in $(seq 1 360); do   # 360 x 5 s = at most 30 minutes
            if gh api "repos/$REPO/actions/workflows/$WF_FILE/runs?status=in_progress&per_page=100" > /tmp/old.json 2>/dev/null; then
              FAIL=0
              N=$(jq --argjson id "$RUN_ID" --argjson num "$RUN_NUMBER" '[.workflow_runs[] | select(.id != $id and .run_number < $num)] | length' /tmp/old.json)
              if [ "${N:-1}" = "0" ]; then
                echo "✅ Old desktop has finished - taking over now."
                break
              fi
            else
              FAIL=$((FAIL + 1))
              if [ "$FAIL" -ge 5 ]; then
                echo "⚠️ GitHub API not reachable - taking over anyway."
                break
              fi
            fi
            sleep 5
          done

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "❌ ERROR: Secret CLOUDFLARE_TUNNEL_TOKEN is not set!"
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          # Wait until the tunnel is connected (max. 30 seconds)
          for i in $(seq 1 60); do
            grep -q "Registered tunnel connection" /tmp/cloudflared.log 2>/dev/null && break
            sleep 0.5
          done
          boost-priority

          # Make sure the desktop panel is up (max. 20 seconds)
          for i in $(seq 1 20); do
            pgrep -x gnome-panel >/dev/null && break
            sleep 1
          done

          echo "--- Desktop status ---"
          cat /tmp/desktop-session.log
          pgrep -a -x metacity || echo "⚠️ metacity is not running"
          pgrep -a -x gnome-flashback || echo "⚠️ gnome-flashback is not running"
          pgrep -a -x gnome-panel || echo "⚠️ gnome-panel is not running"
          pgrep -a -x gsd-xsettings || echo "⚠️ gsd-xsettings is not running (fonts/scale may look different)"

          echo "=========================================="
          echo "✅ GNOME Remote Desktop is running and reachable via Cloudflare Zero Trust."
          echo "   Open https://YOUR-SUBDOMAIN.YOUR-DOMAIN.com/ (uses the sharp + smooth settings automatically)"
          echo "   or directly: https://YOUR-SUBDOMAIN.YOUR-DOMAIN.com/vnc.html?autoconnect=true&resize=remote&quality=9&compression=2&reconnect=true"
          echo "   VNC mode: $(cat /tmp/vnc-mode)"
          echo "   Desktop ready after $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds."
          echo "=========================================="

      - name: Wait for WARP (started in background at the beginning)
        run: |
          # WARP was started in parallel at the very beginning. Usually it is done by now.
          for i in $(seq 1 100); do
            [ -f /tmp/warp.done ] && break
            [ -f /tmp/warp.failed ] && break
            sleep 3
          done
          echo "---------- WARP log ----------"
          cat /tmp/warp-setup.log 2>/dev/null || true
          echo "------------------------------"
          if [ -f /tmp/warp.failed ]; then
            echo "⚠️ WARP setup failed. Chrome will not load pages (no data leak)."
          elif [ ! -f /tmp/warp.done ]; then
            echo "⚠️ WARP was not finished after 5 minutes. See log above."
          fi
          echo "Total time so far: $(( $(date +%s) - $(cat /tmp/start-ts) )) seconds."

      - name: Keep Alive (starts the next desktop early, then ends)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          health() {
            if [ "$(cat /tmp/vnc-mode 2>/dev/null)" = "tigervnc" ]; then
              pgrep -x Xtigervnc >/dev/null || echo "⚠️ Xtigervnc is no longer running"
            else
              pgrep -x Xvfb >/dev/null   || echo "⚠️ Xvfb is no longer running"
              pgrep -x x11vnc >/dev/null || echo "⚠️ x11vnc is no longer running"
            fi
            pgrep -x cloudflared >/dev/null || echo "⚠️ cloudflared is no longer running"
            echo "Load: $(cut -d' ' -f1-3 /proc/loadavg) | Free RAM: $(free -m | awk '/Mem:/ {print $7}') MB"
          }

          # Timeline (counted from the start of this job):
          #   minute 315: start the NEXT desktop (it builds itself and waits for the handover)
          #   minute 335: this run ends, the next desktop takes over the tunnel within seconds
          START=$(cat /tmp/start-ts)
          HANDOVER_AT=$((START + 315 * 60))
          END_AT=$((START + 335 * 60))

          echo "Desktop active. The successor starts in $(( (HANDOVER_AT - $(date +%s)) / 60 )) minutes."
          N=0
          while [ "$(date +%s)" -lt "$HANDOVER_AT" ]; do
            sleep 30
            N=$((N + 1))
            if [ $((N % 30)) -eq 0 ]; then
              echo "Minute $(( ($(date +%s) - START) / 60 ))"
              health
              boost-priority
            fi
          done

          # Find the workflow file name automatically
          WF_FILE=$(basename "${WORKFLOW_REF%@*}")
          echo "Starting successor (auto restart) for $WF_FILE ..."
          for TRY in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF_FILE/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"handover\":\"true\"}}")
            if [ "$CODE" = "204" ]; then
              echo "✅ Successor started."
              break
            fi
            echo "⚠️ Starting the successor failed (HTTP $CODE): $(cat /tmp/dispatch.out) - attempt $TRY/5"
            sleep 10
          done

          echo "This desktop keeps running for $(( (END_AT - $(date +%s)) / 60 )) more minutes, then the new one takes over."
          while [ "$(date +%s)" -lt "$END_AT" ]; do
            sleep 20
          done

          echo "This run ends now - the next run has taken over or will do so shortly."
