name: Remote Desktop Runner (Windows, Browser via noVNC, Auto-Restart)

on:
  workflow_dispatch:
  # Sicherheitsnetz: prüft alle 30 Minuten, ob die Auto-Neustart-Kette noch
  # läuft. Läuft bereits eine Session, passiert dank "concurrency" nichts -
  # der Trigger wird ignoriert. Ist die Kette abgerissen, startet er neu.
  schedule:
    - cron: '*/30 * * * *'

# Genau 1 laufender + 1 wartender Lauf pro Gruppe.
# cancel-in-progress: false ist WICHTIG - sonst würde ein neuer,
# nachrückender Lauf die noch aktive Session sofort abwürgen.
concurrency:
  group: remote-desktop-windows
  cancel-in-progress: false

permissions:
  actions: write   # nötig, damit der Job den nächsten Lauf selbst anstoßen darf
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 350   # Hard-Limit von GitHub Actions liegt bei 360 Min.

    steps:
      - name: Install Cloudflared
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

      - name: Install Chrome
        shell: pwsh
        run: |
          choco install googlechrome -y --no-progress
          echo "✅ Chrome installiert."

      - name: Install TightVNC Server (silent, mit Passwort)
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:VNC_PASSWORD)) {
            Write-Error "FEHLER: Secret VNC_PASSWORD ist nicht gesetzt!"
            exit 1
          }

          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "C:\tightvnc.msi"

          # WICHTIG: VNC-Passwoerter duerfen maximal 8 Zeichen lang sein
          # (technische Grenze des VNC-Protokolls, keine Einschraenkung von mir).
          Start-Process msiexec.exe -ArgumentList `
            "/i", "C:\tightvnc.msi", "/quiet", "/norestart", `
            "ADDLOCAL=Server", `
            "SERVER_REGISTER_AS_SERVICE=1", `
            "SERVER_ADD_FIREWALL_EXCEPTION=1", `
            "SERVER_ALLOW_SAS=1", `
            "SET_USEVNCAUTHENTICATION=1", `
            "VALUE_OF_USEVNCAUTHENTICATION=1", `
            "SET_PASSWORD=1", `
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD" `
            -Wait
          echo "✅ TightVNC Server installiert und als Dienst gestartet."

      - name: Install Python websockify & noVNC
        shell: pwsh
        run: |
          # websockify: WebSocket <-> TCP Bruecke, wird als Python-Paket installiert
          # (Python ist auf windows-latest vorinstalliert).
          pip install websockify --quiet

          # noVNC: die eigentliche Web-Oberflaeche (HTML/JS), die im Browser
          # angezeigt wird. Wird per Git-Clone geholt.
          git clone --depth 1 https://github.com/novnc/noVNC.git C:\noVNC
          echo "✅ websockify & noVNC installiert."

      - name: Start noVNC Web-Proxy (Port 6080)
        shell: pwsh
        run: |
          # Verbindet den lokalen VNC-Server (Port 5900) mit einer
          # Web-Oberflaeche auf Port 6080 - darauf zeigt spaeter Cloudflare.
          Start-Process -FilePath "websockify" `
            -ArgumentList "--web=C:\noVNC", "6080", "localhost:5900" `
            -RedirectStandardOutput "C:\websockify.log" `
            -RedirectStandardError "C:\websockify_err.log" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 5
          echo "✅ noVNC laeuft auf Port 6080."

      - name: Start Cloudflare Tunnel
        shell: pwsh
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TUNNEL_TOKEN)) {
            Write-Error "FEHLER: Secret CLOUDFLARE_TUNNEL_TOKEN ist nicht gesetzt!"
            exit 1
          }

          Start-Process -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --no-autoupdate run --token $env:TUNNEL_TOKEN" `
            -RedirectStandardOutput "C:\cloudflared.log" `
            -RedirectStandardError "C:\cloudflared_err.log" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 5

          echo "=========================================="
          echo "Remote Desktop laeuft, erreichbar via Cloudflare Access."
          echo "Oeffne https://DEINE-SUBDOMAIN.DEINE-DOMAIN.com/vnc.html im Browser."
          echo "VNC-Passwort (max. 8 Zeichen) ist das Secret VNC_PASSWORD."
          echo "=========================================="

      - name: Keep Alive mit Auto-Neustart
        shell: pwsh
        run: |
          # Phase 1: Grossteil der Laufzeit "normal" offen halten.
          Start-Sleep -Seconds (325 * 60)

          # Naechsten Lauf anstossen, mit ausreichend Puffer vor dem Timeout.
          echo "Stosse naechsten Lauf an (Auto-Neustart)..."
          $headers = @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            Accept        = "application/vnd.github+json"
          }
          $body = @{ ref = "${{ github.ref_name }}" } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/remote-desktop-windows.yml/dispatches" `
            -Headers $headers -Body $body

          # Restlichen Puffer offen halten, bis dieser Lauf sauber endet und
          # der wartende Lauf uebernehmen kann.
          Start-Sleep -Seconds (10 * 60)
          echo "Dieser Lauf endet jetzt - der nachrueckende Lauf uebernimmt in Kuerze."
